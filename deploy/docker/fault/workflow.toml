[fault_recovery]
kind               = "workflow"
name               = "Docker fault recovery fixture"
workspace_provider = "fault_workspace"

[[fault_recovery.nodes]]
uses = "official.tmux.pane"

[[fault_recovery.nodes]]
id   = "agent"
uses = "official.claude.runtime"

# Short so S6 does not wait out the default 120s for an input box that never
# draws.
[fault_recovery.nodes.inputs]
launch_timeout = "10s"

[fault_recovery.health]
auto_repair_attempts = 3

[fault_recovery.healthcheck]
period          = "15s"
stall_threshold = "45s"
