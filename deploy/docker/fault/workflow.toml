[fault_recovery]
kind               = "workflow"
name               = "Docker fault recovery fixture"
workspace_provider = "fault_workspace"

[[fault_recovery.nodes]]
uses = "official.tmux.pane"

[[fault_recovery.nodes]]
id   = "agent"
uses = "official.claude.runtime"

[[fault_recovery.event.channel]]
name    = "runtime"
uses    = "official.claude.delivery"
include = ["plect.instruction"]

[fault_recovery.event.channel.inputs]
path = { from = "nodes.agent.outputs.socket_path" }

[fault_recovery.health]
auto_repair_attempts = 3

[fault_recovery.healthcheck]
period          = "15s"
stall_threshold = "45s"
