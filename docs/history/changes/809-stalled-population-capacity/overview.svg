<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" width="960" height="425" role="img" aria-labelledby="title desc">
  <title id="title">Change: stalled health joins explicit idle in population capacity selection</title>
  <desc id="desc">Head structure with the diff marked. Session state and the event log feed the changed population capacity coordinator. Its existing explicit-clear path and added stalled-health path feed candidate order; the former sorts by clear event time, the latter by activation time. The coordinator calls unchanged ordinary session down and retries admission. The former explicit-idle-only gate is removed.</desc>
  <defs>
    <style>
      svg { --bg:#fff; --fg:#1f2328; --muted:#59636e; --neutral:#8c959f; --neutral-bg:#f6f8fa; --added:#1a7f37; --added-bg:#dafbe1; --changed:#0969da; --changed-bg:#ddf4ff; --removed:#cf222e; --removed-bg:#ffebe9; }
      @media (prefers-color-scheme:dark) { svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --neutral:#656c76; --neutral-bg:#151b23; --added:#3fb950; --added-bg:#0f2a1a; --changed:#4493f8; --changed-bg:#0c2441; --removed:#f85149; --removed-bg:#3a1416; } }
      text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--fg); } .bg { fill:var(--bg); } .title { font-size:18px; font-weight:600; } .name { font-weight:600; } .note { font-size:12px; fill:var(--muted); } .tag { font-size:11px; font-weight:700; letter-spacing:.06em; }
      .neutral { fill:var(--neutral-bg); stroke:var(--neutral); stroke-width:1.5; } .changed { fill:var(--changed-bg); stroke:var(--changed); stroke-width:2.5; } .added { fill:var(--added-bg); stroke:var(--added); stroke-width:2.5; } .removed { fill:var(--removed-bg); stroke:var(--removed); stroke-width:1.5; stroke-dasharray:8 4; opacity:.7; } .t-added { fill:var(--added); } .t-changed { fill:var(--changed); } .t-removed { fill:var(--removed); }
      .flow { fill:none; stroke:var(--fg); stroke-width:1.5; marker-end:url(#arrow); } .head { fill:var(--fg); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="960" height="425"/>
  <text class="title" x="24" y="36">Population capacity selection at a full root cap</text>
  <text class="note" x="24" y="58">PR 809 · head structure with changed and added paths</text>

  <rect class="neutral" x="30" y="110" width="170" height="67" rx="7"/>
  <text class="name" x="46" y="136">Session state</text>
  <text class="note" x="46" y="155">membership · health</text>
  <rect class="neutral" x="30" y="225" width="170" height="67" rx="7"/>
  <text class="name" x="46" y="251">Event log</text>
  <text class="note" x="46" y="270">status · inbound</text>
  <rect class="changed" x="325" y="139" width="235" height="126" rx="7"/>
  <text class="tag t-changed" x="341" y="162">CHANGED</text>
  <text class="name" x="341" y="186">Capacity coordinator</text>
  <text class="note" x="341" y="207">explicit clear → clear time</text>
  <text class="tag t-added" x="341" y="230">ADDED</text>
  <text class="note" x="405" y="230">stalled → activation time</text>
  <text class="note" x="341" y="249">oldest key, then session name</text>
  <rect class="neutral" x="710" y="139" width="210" height="126" rx="7"/>
  <text class="name" x="726" y="167">Session lifecycle</text>
  <text class="note" x="726" y="190">ordinary down</text>
  <text class="note" x="726" y="211">admission retry</text>

  <path class="flow" d="M200 144 H270 V175 H323"/>
  <text x="208" y="131">health verdict</text>
  <path class="flow" d="M200 258 H270 V229 H323"/>
  <text x="207" y="282">status, inbound events</text>
  <path class="flow" d="M560 203 H708"/>
  <text x="605" y="190">candidate</text>

  <rect class="removed" x="325" y="322" width="235" height="66" rx="7"/>
  <text class="tag t-removed" x="341" y="345">REMOVED</text>
  <text class="name" x="341" y="367">Explicit-idle-only gate</text>
</svg>
