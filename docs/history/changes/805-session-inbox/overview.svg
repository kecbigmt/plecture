<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 676" width="980" height="676" role="img" aria-labelledby="title desc">
  <title id="title">Change: the session inbox replaces the plugin file queues</title>
  <desc id="desc">Head structure with the diff marked. The session dispatcher, changed, reads events from the unchanged event log, delivers one event per delivery to the unchanged pane runtime with superseded pending events omitted, and writes entry rows into the added session inbox, the inbox_entries table. The headless worker, changed, takes a batch from the session inbox with plect inbox take and acknowledges it with plect inbox ack. Removed, shown as ghosts in their old place: the dispatcher ran an enqueue executable once per event, which wrote a queue file into a queue directory handled by headless-batch.sh, from which the worker took one batch per turn; a queue bridge wrote message files into the same directory.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="676"/>

  <text class="title" x="24" y="38">Change: the session inbox replaces the plugin file queues</text>
  <text class="note" x="24" y="60">PR 805 · head structure with the diff marked on it</text>

  <rect class="neutral" x="32" y="100" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="48" y="122">UNCHANGED</text>
  <text class="name" x="48" y="141">event log</text>
  <text class="note" x="48" y="158">storage.db</text>
  <rect class="changed" x="330" y="100" width="230" height="70" rx="6"/>
  <text class="tag t-changed" x="346" y="122">CHANGED</text>
  <text class="name" x="346" y="141">session dispatcher</text>
  <text class="note" x="346" y="158">omits superseded pending events</text>
  <rect class="neutral" x="760" y="100" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="776" y="122">UNCHANGED</text>
  <text class="name" x="776" y="141">pane runtime</text>
  <text class="note" x="776" y="158">socket or terminal channel</text>
  <rect class="added" x="330" y="240" width="190" height="70" rx="6"/>
  <text class="tag t-added" x="346" y="262">ADDED</text>
  <text class="name" x="346" y="281">session inbox</text>
  <text class="note" x="346" y="298">inbox_entries table</text>
  <rect class="changed" x="760" y="240" width="190" height="70" rx="6"/>
  <text class="tag t-changed" x="776" y="262">CHANGED</text>
  <text class="name" x="776" y="281">headless worker</text>
  <text class="note" x="776" y="298">claude and codex scripts</text>
  <line class="flow" x1="222" y1="125" x2="328" y2="125"/>
  <text class="label" text-anchor="middle" x="276" y="116">events</text>

  <line class="flow" x1="560" y1="135" x2="758" y2="135"/>
  <text class="label" text-anchor="middle" x="660" y="111"><tspan x="660">one delivery per</tspan><tspan x="660" dy="15">retained event</tspan></text>

  <line class="flow-added" x1="425" y1="170" x2="425" y2="238"/>
  <text class="label t-added" x="437" y="199"><tspan x="437" font-weight="600">ADDED</tspan><tspan x="437" dy="15">entry rows</tspan></text>

  <line class="flow-added" x1="520" y1="262" x2="757" y2="262"/>
  <text class="label t-added" text-anchor="middle" x="640" y="238"><tspan x="640" font-weight="600">ADDED</tspan><tspan x="640" dy="15">plect inbox take: batch</tspan></text>
  <line class="flow-added" x1="760" y1="292" x2="523" y2="292"/>
  <text class="label t-added" text-anchor="middle" x="640" y="310"><tspan x="640">plect inbox ack: batch id</tspan></text>

  <g class="ghost">
  <rect class="removed" x="32" y="400" width="190" height="70" rx="6"/>
  <text class="tag t-removed" x="48" y="422">REMOVED</text>
  <text class="name" x="48" y="441">enqueue executable</text>
  <text class="note" x="48" y="458">one per plugin</text>
  <rect class="removed" x="330" y="400" width="230" height="70" rx="6"/>
  <text class="tag t-removed" x="346" y="422">REMOVED</text>
  <text class="name" x="346" y="441">queue directory</text>
  <text class="note" x="346" y="458">headless-batch.sh, quarantine</text>
  <rect class="removed" x="330" y="540" width="230" height="70" rx="6"/>
  <text class="tag t-removed" x="346" y="562">REMOVED</text>
  <text class="name" x="346" y="581">queue bridge</text>
  <text class="note" x="346" y="598">channel-server queue</text>
    <path class="flow-removed" d="M330,155 H276 V420 H224"/>
    <text class="label t-removed" x="286" y="345"><tspan x="286" font-weight="600">REMOVED</tspan><tspan x="286" dy="15">exec per event</tspan></text>
    <line class="flow-removed" x1="222" y1="452" x2="328" y2="452"/>
    <text class="label t-removed" text-anchor="middle" x="276" y="488"><tspan x="276" font-weight="600">REMOVED</tspan><tspan x="276" dy="15">queue file</tspan></text>
    <path class="flow-removed" d="M560,435 H855 V312"/>
    <text class="label t-removed" text-anchor="middle" x="700" y="405"><tspan x="700" font-weight="600">REMOVED</tspan><tspan x="700" dy="15">one batch per turn</tspan></text>
    <line class="flow-removed" x1="445" y1="540" x2="445" y2="472"/>
    <text class="label t-removed" x="457" y="500"><tspan x="457" font-weight="600">REMOVED</tspan><tspan x="457" dy="15">message file</tspan></text>
  </g>

  <rect class="added" x="32" y="632" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="644">ADDED · thick solid</text>
  <rect class="changed" x="232" y="632" width="28" height="16" rx="3"/>
  <text class="label" x="270" y="644">CHANGED · solid</text>
  <rect class="removed ghost" x="412" y="632" width="28" height="16" rx="3"/>
  <text class="label" x="450" y="644">REMOVED · faded dashed ghost</text>
  <rect class="neutral" x="672" y="632" width="28" height="16" rx="3"/>
  <text class="label" x="710" y="644">UNCHANGED · grey</text>
  <text class="note" x="32" y="666">arrows are labelled with what crosses them · each state is named in text; colour only repeats it</text>
</svg>
