<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Change: four pinned linters in CI and check-all.sh</title>
  <desc id="desc">The added CI lint job, whose result ci-ok now requires, and the changed check-all.sh both run four added check scripts: check-go-unused.sh (staticcheck U1000 under a build-tag matrix), check-go-errcheck.sh (golangci-lint on added lines only, given a base ref), check-shellcheck.sh (shellcheck at severity warning) and check-actionlint.sh (actionlint with the pinned shellcheck). Both Go checks first pass every tracked Go file to the added Go directive guard, which fails on any suppression directive. check-go-errcheck.sh reads the added golangci-errcheck.yml config, which enables errcheck only. check-shellcheck.sh hands the shellcheck binary to the added shellcheck_report.py, which fails on any suppression directive; check-actionlint.sh gives actionlint the same script as its shellcheck command, so a directive in a run script fails too. Every script asks the added lint-tools.sh for a pinned binary path; lint-tools.sh holds the versions and installs into a cache, verifying the shellcheck tarball's sha256.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .group { fill: none; stroke: var(--neutral); stroke-width: 1.5; stroke-dasharray: 4 3; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

