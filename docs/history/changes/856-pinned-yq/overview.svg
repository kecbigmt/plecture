<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Change: check-ci-scripts decodes ci.yml with the pinned yq</title>
  <desc id="desc">The CI check-all job, changed to also cache the lint-tools directory, runs the unchanged scripts/ci/check-all.sh, which runs check-ci-scripts.sh. The changed check-ci-scripts.sh sources lint-tools.sh and calls lint_tool yq, then executes check_ci_scripts.py as before, with the pinned yq's path added as its first argument. The changed lint-tools.sh pins mikefarah yq v4.54.3 and installs it with go install on first use into the added yq@v4.54.3 directory of the lint-tools cache. The changed check_ci_scripts.py decodes ci.yml with that pinned yq. The removed path, a faded dashed ghost, is check_ci_scripts.py running whatever yq is on PATH. The changed lint-tools_selftest.sh calls lint_tool yq with a different yq ahead on PATH, and with fetching disabled.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="600"/>

  <text class="title" x="24" y="38">Change: check-ci-scripts decodes ci.yml with the pinned yq</text>
  <text class="note" x="24" y="60">PR #856 · head structure with the diff marked on it</text>

  <!-- Row 1 -->
  <rect class="changed" x="32" y="100" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="122">CHANGED</text>
  <text class="name" x="48" y="141">check-all CI job</text>
  <text class="note" x="48" y="158">also caches lint-tools dir</text>

  <rect class="neutral" x="370" y="100" width="220" height="70" rx="6"/>
  <text class="tag t-neutral" x="386" y="122">UNCHANGED</text>
  <text class="name" x="386" y="141">scripts/ci/check-all.sh</text>
  <text class="note" x="386" y="158">job script</text>

  <rect class="changed" x="708" y="100" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="724" y="122">CHANGED</text>
  <text class="name" x="724" y="141">check-ci-scripts.sh</text>
  <text class="note" x="724" y="158">resolves the pinned yq</text>

  <!-- Row 2 -->
  <rect class="changed" x="32" y="270" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="292">CHANGED</text>
  <text class="name" x="48" y="311">lint-tools_selftest.sh</text>
  <text class="note" x="48" y="328">covers the yq pin</text>

  <rect class="changed" x="370" y="270" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="386" y="292">CHANGED</text>
  <text class="name" x="386" y="311">lint-tools.sh</text>
  <text class="note" x="386" y="328">pins mikefarah yq v4.54.3</text>

  <rect class="changed" x="708" y="270" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="724" y="292">CHANGED</text>
  <text class="name" x="724" y="311">check_ci_scripts.py</text>
  <text class="note" x="724" y="328">takes the yq path</text>

  <!-- Row 3 -->
  <rect class="added" x="370" y="440" width="220" height="70" rx="6"/>
  <text class="tag t-added" x="386" y="462">ADDED</text>
  <text class="name" x="386" y="481">yq@v4.54.3</text>
  <text class="note" x="386" y="498">lint-tools cache</text>

  <g class="ghost">
    <rect class="removed" x="770" y="440" width="170" height="70" rx="6"/>
    <text class="tag t-removed" x="786" y="462">REMOVED</text>
    <text class="name" x="786" y="481">yq on PATH</text>
    <text class="note" x="786" y="498">any implementation</text>
    <line class="flow-removed" x1="855" y1="340" x2="855" y2="440"/>
    <text class="label t-removed" x="865" y="384"><tspan x="865" font-weight="600">REMOVED</tspan><tspan x="865" dy="15">runs</tspan></text>
  </g>

  <!-- Unchanged flows -->
  <line class="flow" x1="252" y1="135" x2="370" y2="135"/>
  <text class="label" text-anchor="middle" x="311" y="126">runs</text>
  <line class="flow" x1="590" y1="135" x2="708" y2="135"/>
  <text class="label" text-anchor="middle" x="649" y="126">runs</text>

  <!-- Changed flows -->
  <path class="flow-added" d="M740,170 V220 H480 V270"/>
  <text class="label t-added" text-anchor="middle" x="610" y="198"><tspan x="610" font-weight="600">ADDED</tspan><tspan x="610" dy="15">sources; lint_tool yq</tspan></text>

  <line class="flow" x1="880" y1="170" x2="880" y2="270"/>
  <text class="label" x="890" y="214"><tspan x="890">exec</tspan><tspan x="890" dy="15" class="t-added" font-weight="600">ADDED arg:</tspan><tspan x="890" dy="15" class="t-added">yq path</tspan></text>

  <line class="flow-added" x1="252" y1="305" x2="370" y2="305"/>
  <text class="label t-added" text-anchor="middle" x="311" y="282"><tspan x="311" font-weight="600">ADDED</tspan><tspan x="311" dy="15">lint_tool yq</tspan></text>

  <line class="flow-added" x1="480" y1="340" x2="480" y2="440"/>
  <text class="label t-added" x="490" y="384"><tspan x="490" font-weight="600">ADDED</tspan><tspan x="490" dy="15">go install, first use</tspan></text>

  <path class="flow-added" d="M730,340 V475 H590"/>
  <text class="label t-added" text-anchor="middle" x="660" y="452"><tspan x="660" font-weight="600">ADDED</tspan><tspan x="660" dy="15">decodes ci.yml</tspan></text>

  <!-- Legend -->
  <rect class="added" x="32" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="549">ADDED · thick solid</text>
  <rect class="changed" x="264" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="549">CHANGED · solid</text>
  <rect class="removed ghost" x="496" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="549">REMOVED · faded dashed ghost</text>
  <rect class="neutral" x="752" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="790" y="549">UNCHANGED · grey</text>
  <line class="flow" x1="32" y1="579" x2="58" y2="579"/>
  <text class="label" x="70" y="583">arrow, labelled with what crosses it</text>
  <text class="note" x="496" y="583">each state is named in text; colour only repeats it</text>
</svg>
