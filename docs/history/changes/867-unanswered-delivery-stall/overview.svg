<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Change: a delivered event with no turn after it is a stall</title>
  <desc id="desc">Head structure with the diff marked. The session dispatcher, changed, reads events past its cursor from the unchanged event log and delivers them to the unchanged runtime by push or inbox hand-over. For a binding that reaches a run-scoped node declaring an activity probe it now records the delivery in the added unanswered_deliveries table before the attempt and withdraws it when the runtime did not receive the event. The runtime reports turn status through plect state set-message, changed, which now deletes, on any non-empty status, the rows delivered at or before that status. The health cycle, changed, reads the record and the latest status from the event log; when the runtime has been idle longer than stall_threshold with a delivery unanswered it reports stalled and pushes health.stalled to the parent with the event id and type.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="600"/>

  <text class="title" x="24" y="38">Change: a delivered event with no turn after it is a stall</text>
  <text class="note" x="24" y="60">PR #867 · head structure with the diff marked on it</text>

  <rect class="neutral" x="32" y="100" width="200" height="70" rx="6"/>
  <text class="tag t-neutral" x="48" y="122">UNCHANGED</text>
  <text class="name" x="48" y="141">Event log</text>
  <text class="note" x="48" y="158">events table</text>

  <rect class="changed" x="340" y="100" width="260" height="70" rx="6"/>
  <text class="tag t-changed" x="356" y="122">CHANGED</text>
  <text class="name" x="356" y="141">Session dispatcher</text>
  <text class="note" x="356" y="158">records deliveries to activity nodes</text>

  <rect class="neutral" x="708" y="100" width="220" height="70" rx="6"/>
  <text class="tag t-neutral" x="724" y="122">UNCHANGED</text>
  <text class="name" x="724" y="141">Runtime</text>
  <text class="note" x="724" y="158">pane socket or inbox taker</text>

  <rect class="added" x="340" y="270" width="260" height="70" rx="6"/>
  <text class="tag t-added" x="356" y="292">ADDED</text>
  <text class="name" x="356" y="311">unanswered_deliveries</text>
  <text class="note" x="356" y="328">one row per unanswered event</text>

  <rect class="changed" x="708" y="270" width="220" height="78" rx="6"/>
  <text class="tag t-changed" x="724" y="292">CHANGED</text>
  <text class="name" x="724" y="311">plect state set-message</text>
  <text class="note" x="724" y="328">appends status_message;</text>
  <text class="note" x="724" y="342">answers earlier rows if non-empty</text>

  <rect class="changed" x="340" y="440" width="260" height="70" rx="6"/>
  <text class="tag t-changed" x="356" y="462">CHANGED</text>
  <text class="name" x="356" y="481">Health cycle</text>
  <text class="note" x="356" y="498">stalled regardless of pardon</text>

  <rect class="neutral" x="708" y="440" width="220" height="70" rx="6"/>
  <text class="tag t-neutral" x="724" y="462">UNCHANGED</text>
  <text class="name" x="724" y="481">Parent session</text>
  <text class="note" x="724" y="498">receives escalation</text>


  <line class="flow" x1="232" y1="135" x2="340" y2="135"/>
  <text class="label" text-anchor="middle" x="286" y="126">events past cursor</text>

  <line class="flow" x1="600" y1="135" x2="708" y2="135"/>
  <text class="label" text-anchor="middle" x="654" y="110"><tspan x="654">push or</tspan><tspan x="654" dy="15">inbox hand-over</tspan></text>

  <line class="flow-added" x1="470" y1="170" x2="470" y2="270"/>
  <text class="label t-added" x="482" y="208"><tspan x="482" font-weight="600">ADDED</tspan><tspan x="482" dy="15">record before attempt,</tspan><tspan x="482" dy="15">withdraw on failure</tspan></text>

  <line class="flow" x1="818" y1="170" x2="818" y2="270"/>
  <text class="label" x="830" y="224">turn status</text>

  <line class="flow-added" x1="708" y1="305" x2="600" y2="305"/>
  <text class="label t-added" text-anchor="middle" x="654" y="330"><tspan x="654" font-weight="600">ADDED</tspan><tspan x="654" dy="15">delete rows up</tspan><tspan x="654" dy="15">to status time</tspan></text>

  <line class="flow-added" x1="470" y1="340" x2="470" y2="440"/>
  <text class="label t-added" x="482" y="385"><tspan x="482" font-weight="600">ADDED</tspan><tspan x="482" dy="15">reads record</tspan></text>

  <path class="flow-added" d="M132,170 V475 H340"/>
  <text class="label t-added" x="144" y="400"><tspan x="144" font-weight="600">ADDED</tspan><tspan x="144" dy="15">reads latest</tspan><tspan x="144" dy="15">status_message</tspan></text>

  <line class="flow-added" x1="600" y1="475" x2="708" y2="475"/>
  <text class="label t-added" text-anchor="middle" x="654" y="500"><tspan x="654" font-weight="600">ADDED</tspan><tspan x="654" dy="15">health.stalled with</tspan><tspan x="654" dy="15">event_id, event_type</tspan></text>

  <rect class="added" x="32" y="555" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="567">ADDED · thick solid</text>
  <rect class="changed" x="264" y="555" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="567">CHANGED · solid</text>
  <rect class="neutral" x="496" y="555" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="567">UNCHANGED · grey</text>
  <text class="note" x="700" y="567">arrows labelled with what crosses</text>
</svg>
