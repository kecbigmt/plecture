<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Change: CI and check-all.sh call the same job scripts</title>
  <desc id="desc">The changed ci.yml's required jobs are setup actions followed by run steps that each call one of the added scripts/ci job scripts. The changed check-all.sh calls each of those scripts, for every module, except the added web-browser-acceptance-browser.sh, the job's browser half, which only CI runs because its playwright install with deps needs root. The added check-ci-scripts.sh, run by scripts/ci/check-all.sh, decodes ci.yml with yq and reads check-all.sh --list. The removed scripts/ci_steps.py, which check-all.sh once ran with ci-ok and a base to interpret ci.yml, and the removed check-ci-parity.sh are faded ghosts.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="500"/>
  <rect class="bg" x="0" y="0" width="960" height="500"/>
  <text class="title" x="24" y="38">Change: CI and check-all.sh call the same job scripts</text>

  <rect class="changed" x="32" y="100" width="230" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="122">CHANGED</text>
  <text class="name" x="48" y="141">scripts/check-all.sh</text>
  <text class="note" x="48" y="158">every module · --list</text>

  <rect class="added" x="345" y="100" width="270" height="70" rx="6"/>
  <text class="tag t-added" x="361" y="122">ADDED</text>
  <text class="name" x="361" y="141">scripts/ci/&lt;job&gt;.sh</text>
  <text class="note" x="361" y="158">one per required job</text>

  <rect class="changed" x="700" y="100" width="230" height="70" rx="6"/>
  <text class="tag t-changed" x="716" y="122">CHANGED</text>
  <text class="name" x="716" y="141">.github/workflows/ci.yml</text>
  <text class="note" x="716" y="158">setup actions, then calls</text>

  <rect class="added" x="345" y="250" width="270" height="70" rx="6"/>
  <text class="tag t-added" x="361" y="272">ADDED</text>
  <text class="name" x="361" y="291">web-browser-acceptance-browser.sh</text>
  <text class="note" x="361" y="308">CI only: --with-deps needs root</text>

  <rect class="added" x="345" y="390" width="270" height="70" rx="6"/>
  <text class="tag t-added" x="361" y="412">ADDED</text>
  <text class="name" x="361" y="431">scripts/check-ci-scripts.sh</text>
  <text class="note" x="361" y="448">run by scripts/ci/check-all.sh</text>

  <g class="ghost">
    <rect class="removed" x="32" y="250" width="230" height="70" rx="6"/>
    <text class="tag t-removed" x="48" y="272">REMOVED</text>
    <text class="name" x="48" y="291">scripts/ci_steps.py</text>
    <text class="note" x="48" y="308">interpreted ci.yml</text>
    <line class="flow-removed" x1="147" y1="170" x2="147" y2="250"/>
    <text class="label t-removed" x="157" y="208"><tspan x="157" font-weight="600">REMOVED</tspan><tspan x="157" dy="15">run ci-ok &lt;base&gt;</tspan></text>

    <rect class="removed" x="32" y="390" width="230" height="70" rx="6"/>
    <text class="tag t-removed" x="48" y="412">REMOVED</text>
    <text class="name" x="48" y="431">scripts/check-ci-parity.sh</text>
    <text class="note" x="48" y="448">+ selftest</text>
  </g>

  <line class="flow-added" x1="262" y1="128" x2="341" y2="128"/>
  <text class="label t-added" x="268" y="118">calls each</text>

  <line class="flow-added" x1="700" y1="128" x2="619" y2="128"/>
  <text class="label t-added" x="626" y="118">run: one call</text>

  <line class="flow-added" x1="760" y1="170" x2="619" y2="258"/>
  <text class="label t-added" x="690" y="236">browser half</text>

  <polyline class="flow-added" points="345,425 300,425 300,150 266,150"/>
  <text class="label t-added" x="307" y="360">--list</text>

  <polyline class="flow-added" points="615,425 830,425 830,174"/>
  <text class="label t-added" x="840" y="300">decoded by yq</text>
</svg>
