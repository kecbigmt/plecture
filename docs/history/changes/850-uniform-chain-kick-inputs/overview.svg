<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Change: core kicks carry no forge-shaped text</title>
  <desc id="desc">Head structure of the tick's outbound messages. The plect tick, changed, reads the instance's observed state and sends three messages. To an already-active chain target session it sends a user.emit kick whose metadata holds every declared chain input plus the kick's own keys, and whose body lists each input as a key and value line; the named pr_url, revision and judge_ids picks are gone. To the work session it sends the done_when kick and the review_required notice; the review_required notice now carries only the pending judge leaves and plect judge commands. Two removed parts are drawn as faded dashed ghosts: the mergeability hint, which read mergeable_state from the observed state and appended rebase advice to the kick, and the reviewer dispatch suggestion, which printed a plect up command naming a workflow. The github-watcher plugin service is unchanged and remains the source of the github.mergeable event delivered to the work session.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-changed { fill: none; stroke: var(--changed); stroke-width: 2; marker-end: url(#arrow-changed); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-changed { fill: var(--changed); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-changed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-changed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>

  <text class="title" x="24" y="38">Change: core kicks carry no forge-shaped text</text>
  <text class="note" x="24" y="60">PR #850 · head structure of the tick's outbound messages, diff marked on it</text>

  <!-- Unchanged: observed state -->
  <rect class="neutral" x="32" y="100" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="48" y="122">UNCHANGED</text>
  <text class="name" x="48" y="141">Observed state</text>
  <text class="note" x="48" y="158">task instance row</text>

  <!-- Changed: plect tick -->
  <rect class="changed" x="362" y="100" width="236" height="70" rx="6"/>
  <text class="tag t-changed" x="378" y="122">CHANGED</text>
  <text class="name" x="378" y="141">plect tick</text>
  <text class="note" x="378" y="158">service: check_action, tick_chain</text>

  <!-- Unchanged: chain target session -->
  <rect class="neutral" x="738" y="100" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="754" y="122">UNCHANGED</text>
  <text class="name" x="754" y="141">Chain target session</text>
  <text class="note" x="754" y="158">already active</text>

  <!-- Unchanged: work session -->
  <rect class="neutral" x="738" y="330" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="754" y="352">UNCHANGED</text>
  <text class="name" x="754" y="371">Work session</text>
  <text class="note" x="754" y="388">event log</text>

  <!-- Unchanged: github-watcher -->
  <rect class="neutral" x="32" y="330" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="48" y="352">UNCHANGED</text>
  <text class="name" x="48" y="371">github-watcher</text>
  <text class="note" x="48" y="388">plugin service</text>

  <!-- Removed ghosts: the two core advisories -->
  <g class="ghost">
    <rect class="removed" x="282" y="225" width="186" height="62" rx="6"/>
    <text class="tag t-removed" x="296" y="246">REMOVED</text>
    <text class="name" x="296" y="265">mergeability hint</text>
    <text class="note" x="296" y="280">rebase advice in kick</text>
    <path class="flow-removed" d="M127,170 V256 H282"/>
    <text class="label t-removed" x="137" y="212"><tspan x="137" font-weight="600">REMOVED</tspan><tspan x="137" dy="15">reads mergeable_state</tspan></text>

    <rect class="removed" x="508" y="225" width="190" height="62" rx="6"/>
    <text class="tag t-removed" x="524" y="246">REMOVED</text>
    <text class="name" x="524" y="265">reviewer dispatch</text>
    <text class="note" x="524" y="280">plect up --workflow …</text>
  </g>

  <!-- Unchanged: observed state into tick -->
  <line class="flow" x1="222" y1="135" x2="362" y2="135"/>
  <text class="label" text-anchor="middle" x="292" y="126">done_when facts</text>

  <!-- Changed: chain kick -->
  <line class="flow-changed" x1="598" y1="135" x2="738" y2="135"/>
  <text class="label t-changed" text-anchor="middle" x="668" y="80"><tspan x="668" font-weight="600">CHANGED</tspan><tspan x="668" dy="15">user.emit kick:</tspan><tspan x="668" dy="15">every input, sorted</tspan></text>

  <!-- Changed: kick / review_required into work session -->
  <path class="flow-changed" d="M480,170 V365 H738"/>
  <text class="label t-changed" x="492" y="322"><tspan x="492" font-weight="600">CHANGED</tspan><tspan x="492" dy="15">done_when kick ·</tspan><tspan x="492" dy="15">review_required (judge cmds)</tspan></text>

  <!-- Unchanged: plugin mergeability event -->
  <line class="flow" x1="222" y1="385" x2="738" y2="385"/>
  <text class="label" text-anchor="middle" x="320" y="410">github.mergeable event</text>

  <!-- Legend -->
  <rect class="changed" x="32" y="467" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="479">CHANGED · solid</text>
  <rect class="removed ghost" x="264" y="467" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="479">REMOVED · faded dashed ghost</text>
  <rect class="neutral" x="530" y="467" width="28" height="16" rx="3"/>
  <text class="label" x="568" y="479">UNCHANGED · grey</text>
  <line class="flow" x1="32" y1="511" x2="58" y2="511"/>
  <text class="label" x="70" y="515">arrow, labelled with what crosses it</text>
  <text class="note" x="530" y="515">each state is named in text; colour only repeats it</text>
</svg>
