  <text class="name" x="754" y="151">ci.yml · ci-ok</text>
  <text class="note" x="754" y="168">does not need pr-body</text>

  <rect class="changed" x="32" y="290" width="190" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="312">CHANGED</text>
  <text class="name" x="48" y="331">check-all.sh</text>
  <text class="note" x="48" y="348">skips with no open PR</text>

  <rect class="added" x="362" y="290" width="236" height="70" rx="6"/>
  <text class="tag t-added" x="378" y="312">ADDED</text>
  <text class="name" x="378" y="331">check-pr-body.sh</text>
  <text class="note" x="378" y="348">--repo owner/name body-file</text>

  <rect class="added" x="738" y="290" width="190" height="70" rx="6"/>
  <text class="tag t-added" x="754" y="312">ADDED</text>
  <text class="name" x="754" y="331">scripts/prbody</text>
  <text class="note" x="754" y="348">Go module, GOWORK=off</text>

  <rect class="added" x="362" y="440" width="236" height="70" rx="6"/>
  <text class="tag t-added" x="378" y="462">ADDED</text>
  <text class="name" x="378" y="481">check-pr-body_selftest.sh</text>
  <text class="note" x="378" y="498">seeded defects</text>

  <line class="flow" x1="222" y1="145" x2="362" y2="145"/>
  <text class="label" text-anchor="middle" x="292" y="136">PR body via env</text>

  <line class="flow-added" x1="480" y1="180" x2="480" y2="290"/>
  <text class="label t-added" x="492" y="232"><tspan x="492" font-weight="600">ADDED</tspan><tspan x="492" dy="15">pr-body.md, --repo</tspan></text>

  <line class="flow-added" x1="222" y1="325" x2="362" y2="325"/>
  <text class="label t-added" text-anchor="middle" x="292" y="300"><tspan x="292" font-weight="600">ADDED</tspan><tspan x="292" dy="15">open PR body (gh api)</tspan></text>

  <line class="flow-added" x1="598" y1="325" x2="738" y2="325"/>
  <text class="label t-added" text-anchor="middle" x="668" y="300"><tspan x="668" font-weight="600">ADDED</tspan><tspan x="668" dy="15">go build, run</tspan></text>

  <text class="note" x="754" y="384"><tspan x="754">parses GFM (goldmark,</tspan><tspan x="754" dy="15">x/net/html); prints</tspan><tspan x="754" dy="15">file:line: rule: fix</tspan></text>

  <line class="flow-added" x1="480" y1="440" x2="480" y2="360"/>
  <text class="label t-added" x="492" y="396"><tspan x="492" font-weight="600">ADDED</tspan><tspan x="492" dy="15">seeded bodies</tspan></text>

  <rect class="added" x="32" y="547" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="559">ADDED · thick solid</text>
  <rect class="changed" x="264" y="547" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="559">CHANGED · solid</text>
  <rect class="neutral" x="496" y="547" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="559">UNCHANGED · grey</text>
  <text class="note" x="496" y="585">each state is named in text; colour only repeats it</text>
</svg>
