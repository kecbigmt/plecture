<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Quiet turn-end ticks stop repeated announcements</title>
  <desc id="desc">Before: runtime turn ends call manual tick, which republishes an unchanged kick and resets the heartbeat clock. After: runtime turn ends call quiet tick, which suppresses an unchanged announcement and leaves the heartbeat clock intact; changed states announce once, while manual and heartbeat ticks keep their existing behavior.</desc>
  <defs>
    <style>
      svg { --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d0d7de; --neutral:#8c959f; --neutral-bg:#f6f8fa; --added:#1a7f37; --added-bg:#dafbe1; --changed:#0969da; --changed-bg:#ddf4ff; --removed:#cf222e; --removed-bg:#ffebe9; }
      @media (prefers-color-scheme: dark) { svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --neutral:#656c76; --neutral-bg:#151b23; --added:#3fb950; --added-bg:#0f2a1a; --changed:#4493f8; --changed-bg:#0c2441; --removed:#f85149; --removed-bg:#3a1416; } }
      text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; fill:var(--fg); }
      .bg { fill:var(--bg); } .title { font-size:19px; font-weight:600; } .heading { font-size:15px; font-weight:600; } .name { font-weight:600; } .note { font-size:12px; fill:var(--muted); } .tag { font-size:11px; font-weight:700; letter-spacing:.06em; }
      .panel { fill:none; stroke:var(--line); } .neutral { fill:var(--neutral-bg); stroke:var(--neutral); stroke-width:1.5; } .added { fill:var(--added-bg); stroke:var(--added); stroke-width:3; } .changed { fill:var(--changed-bg); stroke:var(--changed); stroke-width:1.5; } .removed { fill:var(--removed-bg); stroke:var(--removed); stroke-width:1.5; stroke-dasharray:8 4; }
      .t-added { fill:var(--added); } .t-changed { fill:var(--changed); } .t-removed { fill:var(--removed); }
      .flow { fill:none; stroke:var(--fg); stroke-width:1.5; marker-end:url(#arrow); } .flow-changed { fill:none; stroke:var(--changed); stroke-width:2; marker-end:url(#arrow-changed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="var(--fg)" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-changed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="var(--changed)" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="960" height="520"/>
  <text class="title" x="24" y="36">Turn-end tick announcement flow</text>
  <text class="note" x="24" y="58">PR 784 · unchanged work session after a runtime turn</text>
  <rect class="panel" x="16" y="78" width="456" height="366" rx="8"/>
  <text class="heading" x="32" y="104">Before · main</text>
  <rect class="neutral" x="48" y="124" width="350" height="62" rx="6"/>
  <text class="tag" x="64" y="145">UNCHANGED</text><text class="name" x="64" y="166">Runtime turn ends</text>
  <line class="flow" x1="96" y1="186" x2="96" y2="234"/><text x="108" y="212">calls plain plect tick</text>
  <rect class="removed" x="48" y="236" width="350" height="62" rx="6"/>
  <text class="tag t-removed" x="64" y="257">REMOVED FROM TURN-END PATH</text><text class="name" x="64" y="278">Manual trigger</text>
  <line class="flow" x1="96" y1="298" x2="96" y2="346"/><text x="108" y="324">unchanged kick and clock reset</text>
  <rect class="neutral" x="48" y="348" width="350" height="62" rx="6"/>
  <text class="tag" x="64" y="369">UNCHANGED</text><text class="name" x="64" y="390">Agent starts another turn</text>
  <rect class="panel" x="488" y="78" width="456" height="366" rx="8"/>
  <text class="heading" x="504" y="104">After · this PR</text>
  <rect class="changed" x="520" y="124" width="350" height="62" rx="6"/>
  <text class="tag t-changed" x="536" y="145">CHANGED</text><text class="name" x="536" y="166">Runtime turn ends</text>
  <line class="flow-changed" x1="568" y1="186" x2="568" y2="234"/><text x="580" y="212">calls --quiet-unchanged</text>
  <rect class="added" x="520" y="236" width="350" height="62" rx="6"/>
  <text class="tag t-added" x="536" y="257">ADDED</text><text class="name" x="536" y="278">Quiet trigger uses fingerprint debounce</text>
  <line class="flow-changed" x1="568" y1="298" x2="568" y2="346"/><text x="580" y="324">unchanged state: no announcement</text>
  <rect class="changed" x="520" y="348" width="350" height="62" rx="6"/>
  <text class="tag t-changed" x="536" y="369">CHANGED</text><text class="name" x="536" y="390">Heartbeat clock stays due</text>
  <text class="note" x="32" y="479">Changed state announces once. Manual ticks re-announce; heartbeat ticks re-announce within their budget.</text>
</svg>
