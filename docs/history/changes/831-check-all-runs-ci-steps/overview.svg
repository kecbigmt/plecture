<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Change: check-all.sh runs the steps ci-ok requires</title>
  <desc id="desc">check-all.sh, changed, no longer keeps its own list of commands; that hand-kept list is a removed ghost. It now calls the added scripts/ci_steps.py with run, the aggregator job ci-ok and a base ref. ci_steps.py decodes the changed ci.yml with yq, keeping lines and comments, and runs each required job step in bash with expressions substituted. The added check-ci-parity.sh, run by a step of ci.yml's check-all job, calls ci_steps.py check. ci.yml gains two check-all-skip exceptions and the two parity steps.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="500"/>

  <text class="title" x="24" y="38">Change: check-all.sh runs the steps ci-ok requires</text>
  <text class="note" x="24" y="60">PR #831 · head structure with the diff marked on it</text>

  <rect class="changed" x="32" y="100" width="210" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="122">CHANGED</text>
  <text class="name" x="48" y="141">scripts/check-all.sh</text>
  <text class="note" x="48" y="158">refuses a dirty tree</text>

  <rect class="added" x="370" y="100" width="220" height="70" rx="6"/>
  <text class="tag t-added" x="386" y="122">ADDED</text>
  <text class="name" x="386" y="141">scripts/ci_steps.py</text>
  <text class="note" x="386" y="158">check · run</text>

  <rect class="changed" x="720" y="100" width="210" height="70" rx="6"/>
  <text class="tag t-changed" x="736" y="122">CHANGED</text>
  <text class="name" x="736" y="141">.github/workflows/ci.yml</text>
  <text class="note" x="736" y="158">+2 exceptions, +2 steps</text>

  <g class="ghost">
    <rect class="removed" x="32" y="290" width="210" height="70" rx="6"/>
    <text class="tag t-removed" x="48" y="312">REMOVED</text>
    <text class="name" x="48" y="331">hand-kept step list</text>
    <text class="note" x="48" y="348">inside check-all.sh</text>
    <line class="flow-removed" x1="137" y1="170" x2="137" y2="290"/>
    <line class="flow-removed" x1="242" y1="325" x2="370" y2="325"/>
    <text class="label t-removed" text-anchor="middle" x="306" y="295"><tspan x="306" font-weight="600">REMOVED</tspan><tspan x="306" dy="15">own commands</tspan></text>
  </g>

  <rect class="neutral" x="370" y="290" width="220" height="70" rx="6"/>
  <text class="tag t-neutral" x="386" y="312">UNCHANGED</text>
  <text class="name" x="386" y="331">required job steps</text>
  <text class="note" x="386" y="348">scripts, go test, pnpm …</text>

  <rect class="added" x="720" y="290" width="210" height="70" rx="6"/>
  <text class="tag t-added" x="736" y="312">ADDED</text>
  <text class="name" x="736" y="331">check-ci-parity.sh</text>
  <text class="note" x="736" y="348">+ selftest</text>

  <line class="flow-added" x1="242" y1="135" x2="370" y2="135"/>
  <text class="label t-added" text-anchor="middle" x="306" y="110"><tspan x="306" font-weight="600">ADDED</tspan><tspan x="306" dy="15">run ci-ok &lt;base&gt;</tspan></text>

  <line class="flow-added" x1="590" y1="125" x2="720" y2="125"/>
  <text class="label t-added" text-anchor="middle" x="655" y="92"><tspan x="655" font-weight="600">ADDED</tspan><tspan x="655" dy="15">decoded by yq</tspan></text>

  <line class="flow-added" x1="480" y1="170" x2="480" y2="290"/>
  <text class="label t-added" x="492" y="222"><tspan x="492" font-weight="600">ADDED</tspan><tspan x="492" dy="15">bash per step,</tspan><tspan x="492" dy="15">substituted ${{ }}</tspan></text>

  <line class="flow-added" x1="825" y1="170" x2="825" y2="290"/>
  <text class="label t-added" x="837" y="222"><tspan x="837" font-weight="600">ADDED</tspan><tspan x="837" dy="15">check-all job</tspan><tspan x="837" dy="15">step runs it</tspan></text>

  <path class="flow-added" d="M720,340 H660 V160 H590"/>
  <text class="label t-added" x="668" y="255"><tspan x="668" font-weight="600">ADDED</tspan><tspan x="668" dy="15">check</tspan></text>

  <rect class="added" x="32" y="417" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="429">ADDED · thick solid</text>
  <rect class="changed" x="264" y="417" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="429">CHANGED · solid</text>
  <rect class="removed ghost" x="496" y="417" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="429">REMOVED · faded dashed ghost</text>
  <rect class="neutral" x="752" y="417" width="28" height="16" rx="3"/>
  <text class="label" x="790" y="429">UNCHANGED · grey</text>
  <line class="flow" x1="32" y1="461" x2="58" y2="461"/>
  <text class="label" x="70" y="465">arrow, labelled with what crosses it</text>
</svg>
