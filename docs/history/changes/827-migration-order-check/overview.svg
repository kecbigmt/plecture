<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Change: migration order check in storage-contract</title>
  <desc id="desc">The storage-contract CI job, changed, runs the added check-migration-order.sh wrapper on pull requests with the base and head SHAs. check-all.sh, changed, runs it with origin/main and HEAD, and the added selftest runs it against scratch repositories with seeded defects. The wrapper is the only part that reads git: it lists the base tip's migrations and the change's added migrations, and passes them to the added check-migration-order Go command under app/db as NUL-delimited lists, and the command reads each version with goose's parser. A violation is reported as file:line: rule: fix with exit status 1.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="600"/>

  <text class="title" x="24" y="38">Change: migration order check in storage-contract</text>
  <text class="note" x="24" y="60">PR #827 · head structure with the diff marked on it</text>

  <rect class="changed" x="32" y="100" width="190" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="122">CHANGED</text>
  <text class="name" x="48" y="141">storage-contract job</text>
  <text class="note" x="48" y="158">CI, full history</text>

  <rect class="changed" x="362" y="100" width="236" height="70" rx="6"/>
  <text class="tag t-changed" x="378" y="122">CHANGED</text>
  <text class="name" x="378" y="141">check-all.sh</text>
  <text class="note" x="378" y="158">local pre-push run</text>

  <rect class="added" x="738" y="100" width="190" height="70" rx="6"/>
  <text class="tag t-added" x="754" y="122">ADDED</text>
  <text class="name" x="754" y="141">order selftest</text>
  <text class="note" x="754" y="158">seeded defects</text>

  <rect class="added" x="362" y="250" width="236" height="70" rx="6"/>
  <text class="tag t-added" x="378" y="272">ADDED</text>
  <text class="name" x="378" y="291">check-migration-order.sh</text>
  <text class="note" x="378" y="308">scripts/, the only git reader</text>

  <rect class="added" x="362" y="400" width="236" height="70" rx="6"/>
  <text class="tag t-added" x="378" y="422">ADDED</text>
  <text class="name" x="378" y="441">check-migration-order</text>
  <text class="note" x="378" y="458">app/db, reads no repository</text>

  <rect class="neutral" x="32" y="250" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="48" y="272">UNCHANGED</text>
  <text class="name" x="48" y="291">git repository</text>
  <text class="note" x="48" y="308">base tip, head</text>

  <rect class="neutral" x="32" y="400" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="48" y="422">UNCHANGED</text>
  <text class="name" x="48" y="441">goose</text>
  <text class="note" x="48" y="458">version parser</text>

  <path class="flow-added" d="M222,135 H300 V270 H362"/>
  <text class="label t-added" text-anchor="end" x="290" y="190"><tspan x="290" font-weight="600">ADDED</tspan><tspan x="290" dy="15">pull_request:</tspan><tspan x="290" dy="15">base.sha,</tspan><tspan x="290" dy="15">head.sha</tspan></text>

  <line class="flow-added" x1="480" y1="170" x2="480" y2="250"/>
  <text class="label t-added" x="492" y="200"><tspan x="492" font-weight="600">ADDED</tspan><tspan x="492" dy="15">origin/main, HEAD</tspan></text>

  <path class="flow-added" d="M833,170 V285 H598"/>
  <text class="label t-added" x="845" y="215"><tspan x="845" font-weight="600">ADDED</tspan><tspan x="845" dy="15">main, feature</tspan><tspan x="845" dy="15">(scratch repo)</tspan></text>

  <line class="flow-added" x1="362" y1="300" x2="222" y2="300"/>
  <text class="label t-added" x="226" y="340"><tspan x="226" font-weight="600">ADDED</tspan><tspan x="226" dy="15">ls-tree, diff -z</tspan></text>

  <line class="flow-added" x1="480" y1="320" x2="480" y2="400"/>
  <text class="label t-added" x="492" y="350"><tspan x="492" font-weight="600">ADDED</tspan><tspan x="492" dy="15">NUL-delimited path lists</tspan></text>

  <line class="flow-added" x1="362" y1="435" x2="222" y2="435"/>
  <text class="label t-added" text-anchor="middle" x="292" y="410"><tspan x="292" font-weight="600">ADDED</tspan><tspan x="292" dy="15">file name → version</tspan></text>

  <text class="note" x="362" y="492">fails: &lt;file&gt;:&lt;line&gt;: &lt;rule&gt;: &lt;fix&gt;, exit 1</text>

  <rect class="added" x="32" y="547" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="559">ADDED · thick solid</text>
  <rect class="changed" x="264" y="547" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="559">CHANGED · solid</text>
  <rect class="neutral" x="496" y="547" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="559">UNCHANGED · grey</text>
  <text class="note" x="32" y="586">each arrow is labelled with what crosses it; each state is named in text, colour only repeats it</text>
</svg>
