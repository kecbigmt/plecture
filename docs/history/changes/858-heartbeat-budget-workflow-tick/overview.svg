<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Change: heartbeat budget moves from the task to the workflow tick</title>
  <desc id="desc">Head structure of PR 858. Task documents (changed) no longer carry a budget; workflow files (changed) declare tick heartbeat_budget. The loader (changed) refuses a task budget with a migration pointer, closes done_when to its all leaves, and refuses a heartbeat_budget below 1. The loader output is pinned into the session's workflow revision (unchanged) at up or rebase. Tick evaluation (changed) now reads heartbeat_budget from that revision over an added path; the removed path is the task budget, which defaulted to 3, shown as a faded dashed ghost. Task setup with done-when-json (changed) now accepts only all leaves. Tick evaluation escalates done_when.non_convergence to the parent session (unchanged) and reports ticks over budget to plect status (unchanged).</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1160" height="600"/>

  <text class="title" x="24" y="38">Change: heartbeat budget moves to the workflow tick</text>
  <text class="note" x="24" y="60">PR #858 · head structure with the diff marked on it</text>

  <!-- Task document -->
  <rect class="changed" x="32" y="100" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="122">CHANGED</text>
  <text class="name" x="48" y="141">Task document</text>
  <text class="note" x="48" y="158">no [budget]</text>

  <!-- Workflow file -->
  <rect class="changed" x="32" y="230" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="252">CHANGED</text>
  <text class="name" x="48" y="271">Workflow</text>
  <text class="note" x="48" y="288">[tick] heartbeat_budget</text>

  <!-- task setup -->
  <rect class="changed" x="32" y="430" width="220" height="70" rx="6"/>
  <text class="tag t-changed" x="48" y="452">CHANGED</text>
  <text class="name" x="48" y="471">plect task setup</text>
  <text class="note" x="48" y="488">--done-when-json: all only</text>

  <!-- Loader -->
  <rect class="changed" x="330" y="100" width="220" height="200" rx="6"/>
  <text class="tag t-changed" x="346" y="122">CHANGED</text>
  <text class="name" x="346" y="141">Loader</text>
  <text class="note" x="346" y="158">lang + config</text>
  <text class="note" x="346" y="190"><tspan x="346">task budget: FIELD-UNKNOWN</tspan><tspan x="346" dy="16">+ migration guide</tspan><tspan x="346" dy="22">done_when: all only</tspan><tspan x="346" dy="22">heartbeat_budget &lt; 1:</tspan><tspan x="346" dy="16">FIELD-TYPE</tspan></text>

  <!-- Workflow revision -->
  <rect class="neutral" x="630" y="100" width="220" height="70" rx="6"/>
  <text class="tag t-neutral" x="646" y="122">UNCHANGED</text>
  <text class="name" x="646" y="141">Workflow revision</text>
  <text class="note" x="646" y="158">stored per session</text>

  <!-- Tick evaluation -->
  <rect class="changed" x="630" y="260" width="220" height="80" rx="6"/>
  <text class="tag t-changed" x="646" y="282">CHANGED</text>
  <text class="name" x="646" y="301">Tick evaluation</text>
  <text class="note" x="646" y="318">service: evaluateSessionActions</text>

  <!-- Parent session -->
  <rect class="neutral" x="920" y="265" width="210" height="70" rx="6"/>
  <text class="tag t-neutral" x="936" y="287">UNCHANGED</text>
  <text class="name" x="936" y="306">Parent session</text>
  <text class="note" x="936" y="323">receives escalation</text>

  <!-- plect status -->
  <rect class="neutral" x="920" y="430" width="210" height="70" rx="6"/>
  <text class="tag t-neutral" x="936" y="452">UNCHANGED</text>
  <text class="name" x="936" y="471">plect status</text>
  <text class="note" x="936" y="488">per-instance display</text>

  <!-- Removed: task budget -->
  <g class="ghost">
    <rect class="removed" x="330" y="345" width="220" height="70" rx="6"/>
    <text class="tag t-removed" x="346" y="367">REMOVED</text>
    <text class="name" x="346" y="386">task [budget]</text>
    <text class="note" x="346" y="403">omitted = 3</text>
    <path class="flow-removed" d="M550,380 H600 V325 H630"/>
    <text class="label t-removed" x="560" y="410"><tspan x="560" font-weight="600">REMOVED</tspan><tspan x="560" dy="15">per-task budget</tspan></text>
  </g>

  <!-- Flows -->
  <line class="flow" x1="252" y1="135" x2="330" y2="135"/>
  <text class="label" text-anchor="middle" x="291" y="112"><tspan x="291">task</tspan><tspan x="291" dy="14">TOML</tspan></text>

  <line class="flow" x1="252" y1="265" x2="330" y2="265"/>
  <text class="label" text-anchor="middle" x="291" y="242"><tspan x="291">workflow</tspan><tspan x="291" dy="14">TOML</tspan></text>

  <line class="flow" x1="550" y1="135" x2="630" y2="135"/>
  <text class="label" text-anchor="middle" x="590" y="112"><tspan x="590">pinned at</tspan><tspan x="590" dy="13">up / rebase</tspan></text>

  <line class="flow-added" x1="740" y1="170" x2="740" y2="260"/>
  <text class="label t-added" text-anchor="end" x="728" y="205"><tspan x="728" font-weight="600">ADDED</tspan><tspan x="728" dy="15">[tick] heartbeat_budget</tspan></text>

  <line class="flow" x1="850" y1="300" x2="920" y2="300"/>
  <text class="label" text-anchor="middle" x="885" y="215"><tspan x="885">escalate</tspan><tspan x="885" dy="14">non_</tspan><tspan x="885" dy="14">convergence</tspan></text>

  <path class="flow" d="M790,340 V465 H920"/>
  <text class="label" x="800" y="455">ticks/budget</text>

  <path class="flow" d="M252,465 H690 V340"/>
  <text class="label" x="440" y="485">extra done_when leaves</text>

  <!-- Legend -->
  <rect class="added" x="32" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="549">ADDED · thick solid</text>
  <rect class="changed" x="264" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="549">CHANGED · solid</text>
  <rect class="removed ghost" x="496" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="549">REMOVED · faded dashed ghost</text>
  <rect class="neutral" x="752" y="537" width="28" height="16" rx="3"/>
  <text class="label" x="790" y="549">UNCHANGED · grey</text>
  <line class="flow" x1="32" y1="577" x2="58" y2="577"/>
  <text class="label" x="70" y="581">arrow, labelled with what crosses it</text>
</svg>
