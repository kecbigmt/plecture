<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Change: config load walks every first-error table in key order</title>
  <desc id="desc">The configuration load pipeline, left to right: definition files are read in path order by lang DiscoverRoot, whose ParseDefinitionDocument now walks a file's top-level tables in id order. The lang validators, changed, walk node, action, bind, tagged-value, json-operand, contract, instructions-element and query tables in key order. The config loaders, changed, take each layer's definitions, and every later pass over a loaded namespace, in file path order and then id or address order, freeze revision schema files in key order, and walk channel input_schema, chain inputs and workflow channel bindings in key order. task CompileWorkflow, changed, walks public outputs in key order. Each changed stage takes its key order from a sortedKeys helper: the lang and config ones are changed to be generic, and task uses its existing sortedValueKeys. The per-type wrappers sortedBindKeys, sortedOperandKeys and sortedValueKeys in lang, and sortedSpecKeys in config, are removed and drawn as faded ghosts. Definition files themselves are unchanged and still read in path order.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-changed { fill: none; stroke: var(--changed); stroke-width: 2; marker-end: url(#arrow-changed); }
      .head { fill: var(--fg); }
      .head-changed { fill: var(--changed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-changed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-changed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="500"/>

  <text class="title" x="24" y="38">Change: config load walks every first-error table in key order</text>
  <text class="note" x="24" y="60">PR #852 · issue #839 · head structure of the load pipeline with the diff marked on it</text>

  <rect class="neutral" x="24" y="110" width="150" height="70" rx="6"/>
  <text class="tag t-neutral" x="38" y="132">UNCHANGED</text>
  <text class="name" x="38" y="151">definition files</text>
  <text class="note" x="38" y="168">read in path order</text>

  <rect class="changed" x="214" y="110" width="170" height="70" rx="6"/>
  <text class="tag t-changed" x="228" y="132">CHANGED</text>
  <text class="name" x="228" y="151">lang.DiscoverRoot</text>
  <text class="note" x="228" y="168">tables in id order</text>

  <rect class="changed" x="424" y="110" width="170" height="70" rx="6"/>
  <text class="tag t-changed" x="438" y="132">CHANGED</text>
  <text class="name" x="438" y="151">lang validators</text>
  <text class="note" x="438" y="168">field walks in key order</text>

  <rect class="changed" x="634" y="110" width="160" height="70" rx="6"/>
  <text class="tag t-changed" x="648" y="132">CHANGED</text>
  <text class="name" x="648" y="151">config loaders</text>
  <text class="note" x="648" y="168">file order, revisions</text>

  <rect class="changed" x="834" y="110" width="146" height="70" rx="6"/>
  <text class="tag t-changed" x="848" y="132">CHANGED</text>
  <text class="name" x="848" y="151">task.Compile…</text>
  <text class="note" x="848" y="168">public outputs</text>

  <line class="flow" x1="174" y1="145" x2="214" y2="145"/>
  <text class="label" text-anchor="middle" x="194" y="100">TOML</text>
  <line class="flow" x1="384" y1="145" x2="424" y2="145"/>
  <text class="label" text-anchor="middle" x="404" y="100">definitions</text>
  <line class="flow" x1="594" y1="145" x2="634" y2="145"/>
  <text class="label" text-anchor="middle" x="614" y="100">valid defs</text>
  <line class="flow" x1="794" y1="145" x2="834" y2="145"/>
  <text class="label" text-anchor="middle" x="814" y="100">workflow</text>

  <rect class="changed" x="214" y="290" width="380" height="64" rx="6"/>
  <text class="tag t-changed" x="228" y="312">CHANGED</text>
  <text class="name" x="228" y="331">lang.sortedKeys</text>
  <text class="note" x="228" y="346">generic over a table's value type</text>

  <rect class="changed" x="634" y="290" width="160" height="64" rx="6"/>
  <text class="tag t-changed" x="648" y="312">CHANGED</text>
  <text class="name" x="648" y="331">config.sortedKeys</text>
  <text class="note" x="648" y="346">generic</text>

  <rect class="neutral" x="834" y="290" width="146" height="64" rx="6"/>
  <text class="tag t-neutral" x="848" y="312">UNCHANGED</text>
  <text class="name" x="848" y="331">sortedValueKeys</text>
  <text class="note" x="848" y="346">task</text>

  <line class="flow-changed" x1="299" y1="290" x2="299" y2="180"/>
  <line class="flow-changed" x1="509" y1="290" x2="509" y2="180"/>
  <line class="flow-changed" x1="714" y1="290" x2="714" y2="180"/>
  <line class="flow-changed" x1="907" y1="290" x2="907" y2="180"/>
  <text class="label t-changed" text-anchor="middle" x="404" y="240"><tspan x="404" font-weight="600">CHANGED</tspan><tspan x="404" dy="15">sorted keys</tspan></text>
  <text class="label t-changed" text-anchor="middle" x="811" y="240"><tspan x="811" font-weight="600">CHANGED</tspan><tspan x="811" dy="15">sorted keys</tspan></text>

  <g class="ghost">
    <rect class="removed" x="24" y="290" width="170" height="64" rx="6"/>
    <text class="tag t-removed" x="38" y="312">REMOVED</text>
    <text class="name" x="38" y="331">lang wrappers</text>
    <text class="note" x="38" y="346">three per-type helpers</text>
    <rect class="removed" x="634" y="370" width="160" height="52" rx="6"/>
    <text class="tag t-removed" x="648" y="390">REMOVED</text>
    <text class="note" x="648" y="408">config.sortedSpecKeys</text>
  </g>

  <rect class="changed" x="24" y="447" width="28" height="16" rx="3"/>
  <text class="label" x="62" y="459">CHANGED · solid blue</text>
  <rect class="removed ghost" x="244" y="447" width="28" height="16" rx="3"/>
  <text class="label" x="282" y="459">REMOVED · faded dashed ghost</text>
  <rect class="neutral" x="504" y="447" width="28" height="16" rx="3"/>
  <text class="label" x="542" y="459">UNCHANGED · grey</text>
  <text class="note" x="24" y="486">each state is named in text; colour only repeats it</text>
</svg>
