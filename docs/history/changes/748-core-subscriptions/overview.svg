<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Core-owned resource subscriptions</title>
  <desc id="description">Before: task and node bindings invoke resource hooks, while plugin registries and retry queues decide delivery. After: runtime, dispatch, task, and node sources write a core subscriptions table; publishing selects distinct sessions and appends once per session. Green marks added components, blue marks changed components, and red marks removed components.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243a}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#52627a}
      .panel{fill:#fff;stroke:#d7e0ea;stroke-width:2}.panel-title{font-size:22px;font-weight:700}
      .label{font-size:15px;font-weight:650}.detail{font-size:13px;fill:#42526a}
      .removed{fill:#fff1f1;stroke:#d96969;stroke-width:2}.added{fill:#ecf9f0;stroke:#39a464;stroke-width:2}
      .changed{fill:#ecf4ff;stroke:#4a83c4;stroke-width:2}.neutral{fill:#f5f7fa;stroke:#94a3b8;stroke-width:2}
      .flow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .legend{font-size:13px;fill:#42526a}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f9fc"/>
  <text x="48" y="55" class="title">Resource delivery moves into core</text>
  <text x="48" y="82" class="subtitle">Subscription membership and fan-out have one durable authority.</text>

  <rect x="40" y="112" width="540" height="568" rx="14" class="panel"/>
  <text x="68" y="151" class="panel-title">Before</text>
  <text x="68" y="176" class="subtitle">Delivery depends on plugin state and hooks.</text>
  <rect x="72" y="204" width="200" height="82" rx="10" class="neutral"/>
  <text x="92" y="235" class="label">Task / node binding</text>
  <text x="92" y="257" class="detail">Session needs a resource</text>
  <rect x="350" y="204" width="196" height="82" rx="10" class="removed"/>
  <text x="370" y="235" class="label">Subscribe hooks</text>
  <text x="370" y="257" class="detail">External registration</text>
  <path d="M272 245 H338" class="flow"/>
  <rect x="350" y="350" width="196" height="90" rx="10" class="removed"/>
  <text x="370" y="380" class="label">Plugin registries</text>
  <text x="370" y="402" class="detail">subscriptions.json and</text>
  <text x="370" y="421" class="detail">subscribers.json</text>
  <path d="M448 286 V338" class="flow"/>
  <rect x="72" y="350" width="200" height="90" rx="10" class="removed"/>
  <text x="92" y="380" class="label">Lock and retry</text>
  <text x="92" y="402" class="detail">Task cleanup decisions;</text>
  <text x="92" y="421" class="detail">pending delivery state</text>
  <path d="M272 395 H338" class="flow"/>
  <rect x="350" y="508" width="196" height="84" rx="10" class="removed"/>
  <text x="370" y="538" class="label">Plugin fan-out</text>
  <text x="370" y="560" class="detail">Registry chooses sessions</text>
  <path d="M448 440 V496" class="flow"/>
  <text x="72" y="626" class="detail">Several stores can disagree about who receives an event.</text>

  <rect x="620" y="112" width="540" height="568" rx="14" class="panel"/>
  <text x="648" y="151" class="panel-title">After</text>
  <text x="648" y="176" class="subtitle">Core owns membership and delivery.</text>
  <rect x="652" y="204" width="202" height="104" rx="10" class="changed"/>
  <text x="672" y="234" class="label">Four binding sources</text>
  <text x="672" y="257" class="detail">runtime · dispatch</text>
  <text x="672" y="278" class="detail">task · node</text>
  <rect x="936" y="204" width="190" height="104" rx="10" class="added"/>
  <text x="956" y="234" class="label">Core subscriptions</text>
  <text x="956" y="257" class="detail">One row per session,</text>
  <text x="956" y="278" class="detail">resource, and source</text>
  <path d="M854 256 H924" class="flow"/>
  <rect x="652" y="365" width="202" height="86" rx="10" class="changed"/>
  <text x="672" y="396" class="label">Publish request</text>
  <text x="672" y="419" class="detail">CLI or service stdio</text>
  <rect x="936" y="365" width="190" height="86" rx="10" class="added"/>
  <text x="956" y="396" class="label">Distinct sessions</text>
  <text x="956" y="419" class="detail">SELECT DISTINCT</text>
  <path d="M1031 308 V353" class="flow"/>
  <path d="M854 408 H924" class="flow"/>
  <rect x="936" y="508" width="190" height="84" rx="10" class="changed"/>
  <text x="956" y="538" class="label">Session event logs</text>
  <text x="956" y="560" class="detail">Append once; count sent</text>
  <path d="M1031 451 V496" class="flow"/>
  <text x="652" y="626" class="detail">Task and node rows reconcile with bindings in one transaction.</text>

  <rect x="47" y="714" width="18" height="18" rx="3" class="added"/><text x="75" y="729" class="legend">Added</text>
  <rect x="172" y="714" width="18" height="18" rx="3" class="changed"/><text x="200" y="729" class="legend">Changed</text>
  <rect x="314" y="714" width="18" height="18" rx="3" class="removed"/><text x="342" y="729" class="legend">Removed</text>
</svg>
