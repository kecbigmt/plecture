<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="An action invoking a service-marked executable is resolved by whether an operator declaration exists for that executable. With none, the action runs as a helper with its ordinary environment and the plugin cache directory, without service env-file values, and a service.config reference fails; this replaces the earlier rule that such an action fails. With a valid declaration, it also receives that declaration's env-file values and may refer to service.config. An invalid declaration for this executable fails the action, while errors in other declarations do not block it. Rejected: requiring a declaration for every action invocation, and splitting each helper command into its own manifest executable.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
    <text x="24" y="32" font-size="15" font-weight="600">An action may run a service-marked executable without an operator declaration</text>

    <!-- Action -->
    <rect x="24" y="160" width="170" height="90" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="36" y="186" font-weight="600">Action</text>
    <text x="36" y="206" fill="#59636e">node, channel, or hook</text>
    <text x="36" y="224" fill="#59636e">e.g. resource observe</text>
    <line x1="194" y1="205" x2="224" y2="205" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Executable -->
    <rect x="226" y="160" width="180" height="90" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="238" y="183" font-weight="600">plugin executable</text>
    <text x="238" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">service = true</text>
    <text x="238" y="223" fill="#59636e">can be supervised; no</text>
    <text x="238" y="240" fill="#59636e">resident process implied</text>
    <line x1="406" y1="205" x2="436" y2="205" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Decision -->
    <rect x="438" y="160" width="140" height="90" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="508" y="195" text-anchor="middle" font-weight="600">operator</text>
    <text x="508" y="212" text-anchor="middle" font-weight="600">declaration for</text>
    <text x="508" y="229" text-anchor="middle" font-weight="600">this executable?</text>

    <!-- Branches -->
    <polyline points="578,190 600,190 600,96 698,96" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="612" y="89" fill="#0969da" font-weight="600">none</text>
    <polyline points="578,200 620,200 620,184 698,184" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
    <text x="628" y="177" fill="#cf222e" font-size="11">superseded</text>
    <polyline points="578,215 600,215 600,282 698,282" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="612" y="275">valid</text>
    <polyline points="578,228 590,228 590,372 698,372" fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="612" y="365">invalid</text>

    <!-- Outcome: none (this decision) -->
    <rect x="700" y="52" width="276" height="96" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="712" y="74" font-weight="600">runs as an action helper</text>
    <text x="712" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">action env + PLECT_CACHE_DIR</text>
    <text x="712" y="113" fill="#59636e">no service env-file values</text>
    <text x="712" y="132" fill="#59636e">a <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">service.config</tspan> reference fails</text>

    <!-- Superseded -->
    <rect x="700" y="160" width="276" height="66" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-dasharray="6 4"/>
    <text x="712" y="180" fill="#cf222e" font-weight="600">✗ fails, naming the executable</text>
    <text x="712" y="198" fill="#59636e">superseded rule of 2026-11-09;</text>
    <text x="712" y="215" fill="#59636e">blocks standalone resource observation</text>

    <!-- Outcome: valid -->
    <rect x="700" y="240" width="276" height="84" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="712" y="262" font-weight="600">runs with the declaration</text>
    <text x="712" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">action env + env_file</text>
    <text x="712" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">+ PLECT_CACHE_DIR</text>
    <text x="712" y="316" fill="#59636e">may refer to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">service.config</tspan></text>

    <!-- Outcome: invalid -->
    <rect x="700" y="340" width="276" height="64" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="712" y="362" font-weight="600">action fails</text>
    <text x="712" y="380" fill="#59636e">errors in other service</text>
    <text x="712" y="396" fill="#59636e">declarations do not block it</text>

    <!-- Rejected alternative: split helpers -->
    <rect x="24" y="428" width="952" height="80" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-dasharray="6 4"/>
    <text x="36" y="451" fill="#cf222e" font-weight="600">✗ split each helper command into its own manifest executable</text>
    <text x="36" y="471" fill="#59636e">duplicate executable identities for one binary,</text>
    <text x="36" y="489" fill="#59636e">without a distinct lifecycle or credential boundary</text>
    <rect x="470" y="440" width="190" height="26" rx="4" fill="#ffffff" stroke="#cf222e" stroke-dasharray="4 3"/>
    <text x="482" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">executable (service)</text>
    <rect x="470" y="474" width="190" height="26" rx="4" fill="#ffffff" stroke="#cf222e" stroke-dasharray="4 3"/>
    <text x="482" y="492" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">executable (helper)</text>
    <polyline points="660,453 700,453 700,468 738,468" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
    <polyline points="660,487 700,487 700,472" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="740" y="455" width="150" height="26" rx="4" fill="#ffffff" stroke="#cf222e" stroke-dasharray="4 3"/>
    <text x="815" y="473" text-anchor="middle">one binary</text>

    <!-- Legend -->
    <line x1="24" y1="536" x2="64" y2="536" stroke="#0969da" stroke-width="2"/>
    <text x="72" y="540">this decision</text>
    <line x1="170" y1="536" x2="210" y2="536" stroke="#1f2328" stroke-width="1.5"/>
    <text x="218" y="540">unchanged</text>
    <line x1="310" y1="536" x2="350" y2="536" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="358" y="540" fill="#cf222e">✗ superseded or rejected</text>
  </g>
</svg>
