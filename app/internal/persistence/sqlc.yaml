# Regenerate with: go generate ./internal/persistence/...
# (see this package's doc.go for the full command and pin rationale)
version: "2"
sql:
  - engine: "sqlite"
    schema: "../../db/schema.sql"
    queries: "../../db/query.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "sqlcgen"
