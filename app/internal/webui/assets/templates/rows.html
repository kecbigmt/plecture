{{define "rows"}}
{{- if . -}}
<ul role="list" class="space-y-2">
{{- range . }}
{{ template "card" . }}
{{- end }}
</ul>
{{- else -}}
<div role="status" class="flex flex-col items-center gap-2 py-12 text-muted-foreground">{{ template "icon-inbox" "size-8" }}<p>No sessions</p></div>
{{- end -}}
{{end}}
