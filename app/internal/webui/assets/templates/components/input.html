{{- /* input: labelled form field. props = id, name, label, type (default
       "text"), value, placeholder, required. Label is associated via for/id. */ -}}
{{define "input"}}<div class="grid gap-1.5">
  <label for="{{ .id }}" class="text-label font-medium text-foreground">{{ .label }}</label>
  <input id="{{ .id }}" name="{{ .name }}" type="{{ or .type "text" }}"{{ if .value }} value="{{ .value }}"{{ end }}{{ if .placeholder }} placeholder="{{ .placeholder }}"{{ end }}{{ if .required }} required aria-required="true"{{ end }} class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-body text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
</div>{{end}}
