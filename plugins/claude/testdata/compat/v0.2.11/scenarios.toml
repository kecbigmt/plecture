# Scenarios for the released declarations in config/ and for the current ones:
# each effect set up as that release set it up, and each probe or cleanup run
# against the outputs that release recorded. Every action must succeed.

[[runtime]]
name = "fresh-lifecycle"

[[runtime.files]]
path    = ".claude/sessions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

[[runtime]]
name  = "released-record-is-alive-and-cleaned-up"
self  = { pid = "PID", pid_started = "started-PID", session_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee", socket_path = "STATE/claude-channel/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.sock", mcp_config = "STATE/mcp.json", hooks_settings = "STATE/hooks.json" }
hooks = ["health.alive", "cleanup"]

[[headless_runtime]]
name = "fresh-lifecycle"

[[headless_runtime]]
name                       = "released-record-is-alive-and-cleaned-up"
self                       = { pid = "WORKER_PID", pid_started = "started-WORKER_PID", state_dir = "HOME/headless" }
hooks                      = ["health.alive", "cleanup"]
expect_worker_process_dead = true

[[headless_runtime.files]]
path    = "headless/worker.pid"
content = "WORKER_PID"

[[claude_initial_prompt]]
inputs  = { terminal_ready = "acme-widget-1", agent_session = "1234", prompt = "rendered instruction", repeat = "" }
capture = "› "
