# What each of this plugin's effects is exercised with when its invocation
# record is regenerated. bin/ pins the session id and the scratch paths and
# seeds the session file the launch waits for; pgrep/ps report a process
# distinct from the pane's own root (PLECT_EFFECT_PID), so a kill-on-failure
# scenario can prove it left the pane alone.

[[runtime]]
name = "resume-stale-record"
prev = { session_id = "11111111-2222-3333-4444-555555555555", pid = "999999" }

[[runtime.files]]
path    = ".claude/sessions/stale.json"
content = '{"sessionId":"11111111-2222-3333-4444-555555555555","pid":999999}'

[[runtime.artifacts]]
output = "hooks_settings"
path   = ""

[[runtime.artifacts]]
output = "mcp_config"
path   = ""

# A stale stored PID is a failed liveness check, even when a session file
# advertises another live process in the same pane. Recovery owns cleanup and
# setup; a probe must not repair state as an observation side effect.
[[runtime]]
name    = "stale-pid-is-not-rediscovered"
node_id = "agent"
self    = { pid = "999999999" }
hooks   = ["health.alive"]

[[runtime.files]]
path    = ".claude/sessions/live.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

# Normal recovery may replace a matching Claude process left in the pane,
# ensuring setup never types its launch line into that process's conversation.
[[runtime]]
name                       = "stale-pid-cleans-matching-pane-claude"
self                       = { pid = "999999999", session_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee" }
hooks                      = ["cleanup"]
expect_worker_process_dead = true

[[runtime.files]]
path    = ".claude/sessions/restarted.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":WORKER_PID}'

# A different Claude conversation makes recovery unsafe. Cleanup must fail
# before setup can type a launch command, leaving that process untouched.
[[runtime]]
name                        = "stale-pid-refuses-foreign-pane-claude"
self                        = { pid = "999999999", session_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee" }
hooks                       = ["cleanup"]
expect_worker_process_alive = true
pane_child                  = true

[[runtime.files]]
path    = ".claude/sessions/foreign.json"
content = '{"sessionId":"bbbbbbbb-cccc-dddd-eeee-ffffffffffff","pid":WORKER_PID}'

# A missing pane leaves no process that setup could type into, so cleanup
# still releases local state and lets the same up invocation recreate it.
[[runtime]]
name            = "cleanup-succeeds-without-pane"
self            = { session_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee" }
hooks           = ["cleanup"]
no_terminal_pid = true

[[runtime]]
name   = "channel-server-present"
inputs = { model = "opus", effort = "high", permission_mode = "plan", launch_env = '{"PLECT_TEAM_CONTEXT":"acme"}', mcp_servers = '[{"name":"kbn","command":"kbn-mcp"}]', path_prepend = "/spy/guard" }

[[runtime.files]]
path    = ".claude/sessions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

[[runtime.artifacts]]
output = "mcp_config"
path   = ""

[[runtime.artifacts]]
output = "hooks_settings"
path   = ""

[[runtime]]
name               = "channel-server-absent"
absent_executables = ["channel-server"]

[[runtime.files]]
path    = ".claude/sessions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

[[runtime.artifacts]]
output = "hooks_settings"
path   = ""

[[runtime.artifacts]]
output = "mcp_config"
path   = ""

# Proves the declaration's own inputs_schema enum rejects an out-of-set
# permission_mode before the shell script ever runs, not merely that a
# schema engine can reject enums in the abstract.
[[runtime]]
name   = "permission-mode-rejected"
inputs = { permission_mode = "not-a-real-mode" }
# A rejected setup never reaches health probes in real orchestration.
hooks  = ["setup"]

# Proves permission_mode = "" opts out of both the --permission-mode flag
# and the bypassPermissions-only skipDangerousModePermissionPrompt key,
# distinct from an omitted input (which falls through to the bypassPermissions
# default, seen in every other scenario above).
[[runtime]]
name   = "permission-mode-empty-opt-out"
inputs = { permission_mode = "" }

[[runtime.files]]
path    = ".claude/sessions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

[[runtime.artifacts]]
output = "hooks_settings"
path   = ""

[[runtime.artifacts]]
output = "mcp_config"
path   = ""

# This proves the timed-out launch's child is killed, the pane survives,
# and a retry against that same pane succeeds.
[[runtime]]
name                       = "launch-timeout-then-retry-succeeds"
prev                       = { session_id = "33333333-4444-5555-6666-777777777777" }
inputs                     = { launch_timeout = "1s" }
retry_inputs               = { model = "opus", effort = "high", launch_env = '{"PLECT_TEAM_CONTEXT":"acme"}', path_prepend = "/spy/guard" }
expect_worker_process_dead = true
# A failed node never reaches health probes in real orchestration.
hooks                      = ["setup"]

# This proves cleanup also runs when the final output-construction call
# fails (see bin/jq), not only on a detection timeout.
[[runtime]]
name                       = "launch-succeeds-then-output-fails-kills-worker"
fail_output                = true
expect_worker_process_dead = true
hooks                      = ["setup"]

[[runtime.files]]
path    = ".claude/sessions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

[[claude_initial_prompt]]
inputs  = { terminal_ready = "acme-widget-1", agent_session = "1234", prompt = "rendered instruction", repeat = "" }
capture = "› "

[[headless_runtime]]
name   = "fresh-with-inputs"
inputs = { model = "opus", effort = "high", api_key_file = "/spy/secrets/anthropic-key", launch_env = '{"PLECT_TEAM_CONTEXT":"acme"}', mcp_servers = '[{"name":"kbn","command":"kbn-mcp"}]', path_prepend = "/spy/guard" }

[[headless_runtime.artifacts]]
output = "state_dir"
path   = "hooks.json"

[[headless_runtime.artifacts]]
output = "state_dir"
path   = "mcp.json"

# A resumed session keeps the conversation it already started: the worker is
# relaunched under the previous session id, not a fresh one.
[[headless_runtime]]
name  = "resume-keeps-session"
prev  = { session_id = "11111111-2222-3333-4444-555555555555" }
hooks = ["setup"]

# Cleanup confirms a stored pid is still this effect's worker — the pane's
# child that wrote worker.pid — before each signal: a worker that exited can
# have had its pid reused by an unrelated process.
[[headless_runtime]]
name                       = "cleanup-kills-confirmed-worker"
self                       = { pid = "WORKER_PID", state_dir = "HOME/headless" }
hooks                      = ["cleanup"]
expect_worker_process_dead = true

[[headless_runtime.files]]
path    = "headless/worker.pid"
content = "WORKER_PID"

[[headless_runtime]]
name                        = "cleanup-spares-pid-without-worker-pidfile"
self                        = { pid = "WORKER_PID", state_dir = "HOME/headless-other" }
hooks                       = ["cleanup"]
expect_worker_process_alive = true

# With the pane gone there is nothing to confirm parentage against.
[[headless_runtime]]
name                        = "cleanup-spares-pid-without-pane"
self                        = { pid = "WORKER_PID", state_dir = "HOME/headless" }
hooks                       = ["cleanup"]
no_terminal_pid             = true
expect_worker_process_alive = true

# This proves the timed-out launch's worker is killed and the pane
# survives. No retry_inputs: a retry here would make bin/terminal-send_keys
# seed the runtime effect's own retry session file into the shared home,
# where it outlives this scenario.
[[headless_runtime]]
name                       = "launch-timeout-kills-worker"
inputs                     = { launch_env = '{"PLECT_TEST_NEVER_READY":"1"}', launch_timeout = "1s" }
expect_worker_process_dead = true
hooks                      = ["setup"]

# This proves a worker.pid naming the pane's own pid is rejected, and
# cleanup still lands on the real worker.
[[headless_runtime]]
name                       = "poisoned-pidfile-kills-real-worker"
inputs                     = { launch_env = '{"PLECT_TEST_POISON_PID":"1"}', launch_timeout = "1s" }
pane_child                 = true
expect_worker_process_dead = true
hooks                      = ["setup"]

# This proves cleanup still finds the worker when it never wrote
# worker.pid at all.
[[headless_runtime]]
name                       = "no-pid-report-kills-real-worker"
inputs                     = { launch_env = '{"PLECT_TEST_NO_PID_REPORT":"1"}', launch_timeout = "1s" }
pane_child                 = true
expect_worker_process_dead = true
hooks                      = ["setup"]

# This proves cleanup also runs when the final output-construction call
# fails (see bin/jq), not only on a detection timeout.
[[headless_runtime]]
name                       = "launch-succeeds-then-output-fails-kills-worker"
fail_output                = true
expect_worker_process_dead = true
hooks                      = ["setup"]
