# What each of this plugin's effects is exercised with when its invocation
# record is regenerated. The launch line typed into the terminal is the
# contract here, so every steering input is set. bin/ pins the session id and
# the scratch paths, and seeds the session file the launch waits for; the
# answers/ scripts are how this plugin's own executables reply.

# A resume onto a session id whose only session file left over from the
# previous (now-dead) process still satisfies the launch's own sessionId
# match. The poll loop must discard that stale, dead-pid candidate and keep
# sending Enter rather than treating its mere presence as done; this
# plugin's own terminal-send-keys stand-in only produces the live-pid
# session file once a second Enter actually arrives, so this scenario only
# succeeds if the loop does that. It runs before the channel-server pair
# below so its own record isn't shaped by the executable removal
# "channel-server-absent" performs.
[[runtime]]
name = "resume-stale-record"
prev = { session_id = "11111111-2222-3333-4444-555555555555", pid = "999999" }

[[runtime.files]]
path    = ".claude/sessions/stale.json"
content = '{"sessionId":"11111111-2222-3333-4444-555555555555","pid":999999}'

[[runtime.artifacts]]
output = "hooks_settings"
path   = ""

[[runtime.artifacts]]
output = "mcp_config"
path   = ""

[[runtime]]
name   = "channel-server-present"
inputs = { model = "opus", effort = "high", launch_env = '{"PLECT_TEAM_CONTEXT":"acme"}', mcp_servers = '[{"name":"kbn","command":"kbn-mcp"}]', path_prepend = "/spy/guard" }

# The launch polls for the session file the agent writes; it names the id
# uuidgen reported and a live process, so the poll accepts it on its first
# pass rather than timing out.
[[runtime.files]]
path    = ".claude/sessions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

# The mcp_config content is the record of the presence check that gates
# channel-server registration: this plugin's channel-server executable is
# present in this variant, so the record shows the resolved bin path
# actually used as the mcpServers entry's command, not a bare "channel-server"
# name that would only ever work by coincidence of the runner's own PATH.
[[runtime.artifacts]]
output = "mcp_config"
path   = ""

[[runtime.artifacts]]
output = "hooks_settings"
path   = ""

# The counterpart to the variant above: a mount that declares channel-server
# but never built it (a custom catalog omitting it, or a builder stage that
# failed partway). absent_executables removes the spy this harness would
# otherwise install for it, so the setup script's presence check has to take
# its false branch on its own — the launch line must come out with no
# channels flag and no channel-server registration.
[[runtime]]
name               = "channel-server-absent"
absent_executables = ["channel-server"]

[[runtime.files]]
path    = ".claude/sessions/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee.json"
content = '{"sessionId":"aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee","pid":PID}'

[[runtime.artifacts]]
output = "hooks_settings"
path   = ""

[[runtime.artifacts]]
output = "mcp_config"
path   = ""

[[claude_initial_prompt]]
inputs  = { terminal_ready = "acme-widget-1", agent_session = "1234", prompt = "rendered instruction", repeat = "" }
# The readiness poll and the submit re-check both read the endpoint's input
# box; an empty prompt line is what "ready, nothing pending" looks like.
capture = "› "
