schema_version = 3
version = "0.1.0"
# 0.0.0 matches app/internal/version.Current ("0.0.0-dev"): plect has no
# release/tagging process yet, so any higher floor would reject the plugin
# against every build until real versioning exists.
plect_min_version = "0.0.0"
description = "Claude Code launch task, initial-prompt submit/readiness composition, the channel-server delivery daemon, and the headless claude -p worker/enqueue pair."

[[executables]]
name = "claude-agent-activity"
path = "scripts/claude-agent-activity"

[[executables]]
name = "claude-mcp-servers"
path = "scripts/claude-mcp-servers"

[[executables]]
name = "claude-headless-worker"
path = "scripts/claude-headless-worker"

[[executables]]
name = "claude-headless-enqueue"
path = "scripts/claude-headless-enqueue"

[[executables]]
name = "channel-server"
path = "bin/channel-server"
build = "go -C src/channel-server build -o ../../bin/channel-server ./cmd/channel-server"
