# GitHub provider: maps issue and pull request URLs to session ids, and owns
# the git workdir those sessions work in.
#
# The resolver is pure regex plus template, so a session id is derived
# offline and never depends on the GitHub API being reachable. Acquisition
# and release run through plect-github-provider, which resolves the branch
# for the resource and owns the git workdir lifecycle.

match = '^https://github\.com/(?P<owner>[^/]+)/(?P<repo>[^/]+)/(?:issues|pull)/(?P<number>\d+)'
name = "{{.owner}}/{{.repo}}-{{.number}}"

setup = 'plect-github-provider setup --resource {{.ResourceID | shellQuote}} --session {{.SessionName | shellQuote}} --workdirs-root {{.WorkdirsRoot | shellQuote}}'
cleanup = 'plect-github-provider cleanup --workdir {{.Self.workdir | shellQuote}} --branch {{.Self.branch | shellQuote}} --workdirs-root {{.WorkdirsRoot | shellQuote}} --force={{.Force}}'

[outputs_schema]
type = "object"
required = ["workdir", "branch"]

[outputs_schema.properties.workdir]
type = "string"

[outputs_schema.properties.branch]
type = "string"

[outputs_schema.properties.url]
type = "string"

[outputs_schema.properties.owner_repo]
type = "string"

[outputs_schema.properties.owner]
type = "string"

[outputs_schema.properties.repo]
type = "string"

[outputs_schema.properties.number]
type = "integer"
