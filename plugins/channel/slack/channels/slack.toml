# Channel: deliver a session event to its Slack thread via a companion
# slack-adapter HTTP API (see plugins/slack-adapter in this repository for
# the adapter itself — it is not part of this plugin, which only ships the
# delivery channel that talks to it). exec runs argv directly (no shell); the
# event interpolates only as JSON values (json quotes/escapes them), never
# as the command or URL. `command`/`args` precede [input_schema] so TOML
# scopes them at top level. Posts the event body, falling back to its
# summary.
type = "exec"
command = "curl"
args = [
  "-sf",
  "--max-time", "10",
  "-X", "POST",
  "{{.Inputs.base_url}}/messages",
  "-H", "Content-Type: application/json",
  '-d', '{"thread_ts":{{json .Inputs.thread_ts}},"channel_id":{{json .Inputs.channel_id}},"text":{{if .Event.body}}{{json .Event.body}}{{else}}{{json .Event.summary}}{{end}}}',
]
timeout = "10s"

[input_schema]
base_url   = { type = "string", required = true }
channel_id = { type = "string", required = true }
thread_ts  = { type = "string", required = true }
