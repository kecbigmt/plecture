# GitHub resource provider — owns every piece of GitHub knowledge a session
# needs, independent of any particular workflow: resolving an issue/PR URL to
# a session id, acquiring and releasing the git workdir that resource maps
# to, and binding a session to the shipped watcher's subscription registry.
# Workflows compose on top via `provider = "github"`.
#
# `setup`/`cleanup`/`subscribe` resolve plect-github-provider and
# github-watcher (this plugin's bin/) through `{{bin ...}}`'s plugin-local
# bare-name reading, so both are reachable purely from this plugin being
# enabled — no PATH setup required, and no dependency on which alias the
# operator registered this catalog under.

match = '^https://github\.com/(?P<owner>[^/]+)/(?P<repo>[^/]+)/(?:issues|pull)/(?P<number>\d+)'
name  = "{{.owner}}/{{.repo}}-{{.number}}"

# Title/state fetches route through github-watcher's gh-api subcommand, so a
# setup call and the daemon's own polling share one rate budget instead of
# each independently re-tripping GitHub's secondary rate limit.
setup = '''
{{bin "plect-github-provider"}} setup \
  --resource {{.ResourceID | shellQuote}} \
  --session {{.SessionName | shellQuote}} \
  --workdirs-root {{.WorkdirsRoot | shellQuote}} \
  --watcher-bin {{bin "github-watcher" | shellQuote}}
'''

# --delete-branch reads the delete_branch cleanup input (`plect destroy
# --input delete_branch=true`, or the plect_destroy MCP tool's cleanup_inputs
# object) — a provider-level opt-in, not a core flag, so core carries no
# branch vocabulary. Default is off: a branch left behind after workdir
# removal is safer than one silently reclaimed.
cleanup = '{{bin "plect-github-provider"}} cleanup --workdir {{.Self.workdir | shellQuote}} --branch {{.Self.branch | shellQuote}} --workdirs-root {{.WorkdirsRoot | shellQuote}} --force={{.Force}} --delete-branch={{eq .CleanupInputs.delete_branch "true"}}'

# subscribe binds a session to a resource at runtime (the `plect subscribe`
# verb) — the same watcher subscription registry the setup-time
# tasks/github_watch.toml task uses, additive, never replacing.
subscribe = '{{bin "github-watcher"}} subscribe --session {{.SessionName | shellQuote}} --resource {{.ResourceID | shellQuote}}'

# Outputs contract. `workdir`/`branch` are always present; the rest degrade
# to absent when their gh-api fetch is tolerated as best-effort (see
# plect-github-provider's setup command). `mutable` keys may additionally be
# merged from trusted side paths (`plect state set-output`) — GitHub status
# for done_when is fetched by dynamic output refresh via
# resources/github.toml, not by re-running this hook.
[outputs_schema]
type     = "object"
required = ["workdir", "branch"]

[outputs_schema.properties.workdir]
type = "string"

[outputs_schema.properties.branch]
type = "string"

[outputs_schema.properties.url]
type = "string"

[outputs_schema.properties.owner_repo]
type = "string"

[outputs_schema.properties.owner]
type = "string"

[outputs_schema.properties.repo]
type = "string"

[outputs_schema.properties.number]
type = "integer"

[outputs_schema.properties.title]
type    = "string"
mutable = true

[outputs_schema.properties.pr_state]
type    = "string"
mutable = true

[outputs_schema.properties.issue_state]
type    = "string"
mutable = true
