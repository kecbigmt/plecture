schema_version = 2
version = "0.1.0"
# No plect release has been tagged yet (pre-1.0, no version tags exist), and
# every source build reports itself as "0.0.0-dev" — a nonzero floor here
# would make the plugin unloadable for every current build, not gate on any
# real compatibility fact. Raise this once a first tagged release exists.
plect_min_version = "0.0.0"
description = "GitHub workspace provider, resource observation, and watcher subscription."

[[executables]]
name = "github-worktree"
path = "bin/github-worktree"
build = "go -C src build -o ../bin/github-worktree ./cmd/github-worktree"

[[executables]]
name = "github-issue-pr"
path = "bin/github-issue-pr"
build = "go -C src build -o ../bin/github-issue-pr ./cmd/github-issue-pr"

[[executables]]
name = "github-watcher"
path = "bin/github-watcher"
build = "go -C src build -o ../bin/github-watcher ./cmd/github-watcher"

# Verifies GitHub webhook deliveries and streams matching pull-request
# appearances. Not declared under [[services]]: exposing its endpoint and
# provisioning its signing secret are deployment infrastructure, so it runs
# only when something invokes it, not as a plugin-managed daemon.
[[executables]]
name = "github-webhook-receiver"
path = "bin/github-webhook-receiver"
build = "go -C src build -o ../bin/github-webhook-receiver ./cmd/github-webhook-receiver"

# Mints and caches GitHub App installation access tokens, consumed by
# gh-app-guard and the workspace provider's git credential helper path.
[[executables]]
name = "gh-app-token"
path = "bin/gh-app-token"
build = "go -C src build -o ../bin/gh-app-token ./cmd/gh-app-token"

# A `gh` shim that mechanically denies `pr merge`/`issue close`/`pr close`
# (and their `gh api` equivalents), consumed by this plugin's own gh_guard
# task (config/tasks/gh_guard.toml) — see
# docs/design/plugin-boundary-contracts.md's GitHub CLI Guard section.
[[executables]]
name = "gh-guard"
path = "scripts/gh-guard"

# A `gh` shim composing gh-app-token's minting with gh-guard's denial
# semantics in one wrapper, consumed by this plugin's own gh_app_guard task
# (config/tasks/gh_app_guard.toml) — see
# docs/design/plugin-boundary-contracts.md's GitHub CLI Guard section.
[[executables]]
name = "gh-app-guard"
path = "scripts/gh-app-guard"

# The watcher polls subscribed resources via the gh CLI, authenticated
# outside plect (the user's own `gh auth login`) by default — no
# required_env, since there is no plect-owned credential to gate on. A
# deployment that sets GITHUB_WATCHER_APP_ID (and the rest of the App auth
# env — see `github-watcher serve`'s own usage text) authenticates as a
# single GitHub App installation instead, and fails startup loud if that
# configuration is incomplete or the mint fails, rather than staying
# process-healthy with every fetch dying.
[[services]]
name = "github-watcher"
executable = "github-watcher"
args = ["serve"]
restart = "on-failure"
health = { type = "process" }
