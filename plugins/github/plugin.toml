schema_version = 1
version = "0.1.0"
# No plect release has been tagged yet (pre-1.0, no version tags exist), and
# every source build reports itself as "0.0.0-dev" — a nonzero floor here
# would make the plugin unloadable for every current build, not gate on any
# real compatibility fact. Raise this once a first tagged release exists.
plect_min_version = "0.0.0"
description = "GitHub workspace provider, resource observation, and watcher subscription."

[[executables]]
name = "github-worktree"
path = "bin/github-worktree"
build = "go -C src build -o ../bin/github-worktree ./cmd/github-worktree"

[[executables]]
name = "github-issue-pr"
path = "bin/github-issue-pr"
build = "go -C src build -o ../bin/github-issue-pr ./cmd/github-issue-pr"

[[executables]]
name = "github-watcher"
path = "bin/github-watcher"
build = "go -C src build -o ../bin/github-watcher ./cmd/github-watcher"

# A `gh` shim that mechanically denies `pr merge`/`issue close`/`pr close`
# (and their `gh api` equivalents), consumed by this plugin's own gh_guard
# task (config/tasks/gh_guard.toml) — see
# docs/design/plugin-boundary-contracts.md's GitHub CLI Guard section.
[[executables]]
name = "gh-guard"
path = "scripts/gh-guard"

# The watcher polls subscribed resources via the gh CLI, authenticated
# outside plect (the user's own `gh auth login`) — no required_env, since
# there is no plect-owned credential to gate on.
[[services]]
name = "github-watcher"
executable = "github-watcher"
args = ["serve"]
restart = "on-failure"
health = { type = "process" }
