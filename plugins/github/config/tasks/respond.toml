[respond]
kind     = "effect"
scope    = "session"
requires = ["resource_kind", "checks_status", "issue_status"]

[respond.setup]
type   = "shell"
script = '''
set -eu
INSTRUCTION=$(plect template render respond --session "$session" --instruction "$extra")
if [ -z "$INSTRUCTION" ]; then
  echo "plect template render respond produced empty instruction" >&2
  exit 1
fi
jq -nc --arg instruction "$INSTRUCTION" '{instruction:$instruction}'
'''

[respond.setup.bind]
session = { from = "session.name" }
extra   = { from = "inputs.instruction", default = "" }

# See tasks/work.toml for why resource status stays three first-class
# outputs, and why the "NULL" sentinel exists, instead of one rolled-up
# completion flag.
[[respond.outputs]]
produces = ["resource_kind", "checks_status", "issue_status", "revision"]
from_resource_status = true

[respond.done_when]
all = [
  { check = "resource_kind", in = ["pull", "issue"] },
  { check = "checks_status", in = ["SUCCESS", "NULL"] },
  { judge = "acceptance criteria are satisfied, with a concrete reason", id = "ac-met" },
  { judge = "the resource change actually resolves the requested work without unaddressed risks", id = "solves" },
]

[respond.done_when.budget]
heartbeat_budget = 3
on_exhaust = "escalate"

[respond.inputs_schema]
type                 = "object"
additionalProperties = false

[respond.inputs_schema.properties]
instruction = { type = "string" }

[respond.outputs_schema]
type     = "object"
required = ["instruction"]

[respond.outputs_schema.properties]
instruction   = { type = "string" }
resource_kind = { type = "string", mutable = true }
checks_status = { type = "string", mutable = true }
issue_status  = { type = "string", mutable = true }
revision      = { type = "string", mutable = true }
