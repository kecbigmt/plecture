scope = "session"

setup = '''
set -euo pipefail
EXTRA='{{get .Inputs "instruction" ""}}'
INSTRUCTION=$(plect template render work --session '{{.SessionName}}' --instruction "$EXTRA")
if [ -z "$INSTRUCTION" ]; then
  echo "plect template render work produced empty instruction" >&2
  exit 1
fi
jq -nc --arg instruction "$INSTRUCTION" '{instruction:$instruction}'
'''

requires = ["resource_kind", "checks_status", "issue_status"]

# Resource status is kept as first-class outputs rather than one rolled-up
# "completion" flag: collapsing a failing PR check and a still-running one onto a
# single value erases the failure↔pending distinction the check needs. done_when
# can express neither a null literal nor OR, so a fact that has nothing to
# report yet — an issue with no linked PR, a head commit with no checks — is
# the literal sentinel "NULL", which `in [..., "NULL"]` accepts without it ever
# satisfying on its own. A gh failure exits non-zero so the whole fetch stays
# pending (prior values retained), never silently flipping a check to "NULL".
#
# This task is written against either resource kind, so it reads only the keys
# both observers publish. issue_status is an issue observation's alone: a
# pull-keyed instance never receives it, which is why done_when does not read
# it. mergeable_state is deliberately absent from done_when too — a merge
# conflict is a work signal, not a failure, so it must not gate completion.
# Observed state is copied from the resource definition (resources/issue.toml
# or resources/pull.toml, whichever recognizes this instance's resource)
# rather than fetched by a task-local script, so `plect resource status`, show,
# and this instance all read one contract.
[[outputs]]
produces = ["resource_kind", "checks_status", "issue_status", "revision", "pr_url", "mergeable_state"]
from_resource_status = true

[done_when]
all = [
  { check = "resource_kind", in = ["pull", "issue"] },
  { check = "checks_status", in = ["SUCCESS", "NULL"] },
  { judge = "acceptance criteria are satisfied, with a concrete reason", id = "ac-met" },
  { judge = "the resource change actually resolves the requested work without unaddressed risks", id = "solves" },
]

[done_when.budget]
heartbeat_budget = 3
on_exhaust = "escalate"

[inputs_schema]
type                 = "object"
additionalProperties = false

[inputs_schema.properties]
instruction = { type = "string" }

[outputs_schema]
type     = "object"
required = ["instruction"]

[outputs_schema.properties]
instruction     = { type = "string" }
resource_kind   = { type = "string", mutable = true }
checks_status   = { type = "string", mutable = true }
issue_status    = { type = "string", mutable = true }
revision        = { type = "string", mutable = true }
pr_url          = { type = "string", mutable = true }
mergeable_state = { type = "string", mutable = true }
