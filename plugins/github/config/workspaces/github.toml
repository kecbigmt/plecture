# GitHub workspace provider — owns every piece of GitHub knowledge a
# session needs, independent of any particular workflow: resolving an
# issue/PR URL to a session id, acquiring and releasing the git worktree
# that resource maps to, and binding a session to the shipped watcher's
# subscription registry. Workflows compose on top via
# `workspace_provider = "github"`.
#
# `setup`/`cleanup`/`subscribe` name github-worktree and github-watcher
# (this plugin's bin/) through `bin`'s plugin-local bare-name reading, so
# both are reachable purely from this plugin being enabled — no PATH setup
# required, and no dependency on which alias the operator registered this
# catalog under.
[github]
kind  = "workspace_provider"
match = '^https://github\.com/(?P<owner>[^/]+)/(?P<repo>[^/]+)/(?:issues|pull)/(?P<number>\d+)'
name  = { expr = "match.owner + '/' + match.repo + '-' + match.number" }

# Title/state fetches route through github-watcher's gh-api subcommand, so a
# setup call and the daemon's own polling share one rate budget instead of
# each independently re-tripping GitHub's secondary rate limit.
[github.setup]
type = "exec"
bin  = "github-worktree"
args = [
  "setup",
  "--resource",
  { from = "resource.id" },
  "--session",
  { from = "session.name" },
  "--workspace-dirs-root",
  { from = "config.workspace_dirs_root" },
  "--workspace-layout-root",
  { from = "inputs.workspace_layout_root", default = "" },
  "--issue-branch-template",
  { from = "inputs.issue_branch_template", default = "" },
  "--tagged-branch-suffix",
  { from = "inputs.tagged_branch_suffix", default = "" },
  "--watcher-bin",
  { bin = "github-watcher" },
]

# --delete-branch reads the delete_branch cleanup input (`plect destroy
# --input delete_branch=true`, or the plect_destroy MCP tool's cleanup_inputs
# object) — a workspace-provider-level opt-in, not a core flag, so core
# carries no branch vocabulary. A caller who expressed no intent falls through
# to the `delete_branch_default` parameter, which is itself off unless a
# workflow says otherwise: a branch left behind after worktree removal is
# safer than one silently reclaimed.
#
# This is a shell action because releasing the worktree and dropping the
# session's watcher subscriptions are two steps with a deliberate ordering
# rule between them: the unsubscribe runs unconditionally after worktree
# cleanup and never gates the exit status, since dropping subscriptions is
# orthogonal to whether the worktree came out clean, and a dirty-worktree
# failure must still fail `plect destroy`. Without it a destroyed session's
# subscriptions poll forever — the watcher has no other way to learn a
# session is gone between its own startup sweeps.
[github.cleanup]
type = "shell"
script = '''
"$worktree_bin" cleanup \
  --workspace-dir "$workspace_dir" \
  --branch "$branch" \
  --workspace-dirs-root "$workspace_dirs_root" \
  --workspace-layout-root "$workspace_layout_root" \
  --force="$force" \
  --delete-branch="$delete_branch" \
  --delete-branch-default="$delete_branch_default"
status=$?
"$watcher_bin" unsubscribe --session "$session_name"
exit $status
'''

[github.cleanup.bind]
worktree_bin          = { bin = "github-worktree" }
watcher_bin           = { bin = "github-watcher" }
session_name          = { from = "session.name" }
workspace_dir         = { from = "self.outputs.workspace_dir" }
branch                = { from = "self.outputs.branch" }
workspace_dirs_root   = { from = "config.workspace_dirs_root" }
workspace_layout_root = { from = "inputs.workspace_layout_root", default = "" }
force                 = { from = "force" }
delete_branch         = { from = "cleanup.inputs.delete_branch", default = "" }
delete_branch_default = { from = "inputs.delete_branch_default", default = "" }

# subscribe binds a session to a resource at runtime (the `plect subscribe`
# verb) — the same watcher subscription registry `cleanup` unsubscribes from
# on destroy, additive, never replacing.
[github.subscribe]
type = "exec"
bin  = "github-watcher"
args = ["subscribe", "--session", { from = "session.name" }, "--resource", { from = "resource.id" }]

# Author-declared parameters, set by a workflow's
# `[workspace_provider_inputs]`. Every one is data — a path, a naming
# template, a boolean — so wiring one can change where and under what name a
# worktree lands but never what the hooks run. The naming templates use
# single-brace placeholders (`{number}`, `{tag}`) rather than value
# projections because these strings are expanded by github-worktree itself.
#
# `subscribe` deliberately reads none of them: it resolves this provider from
# the resource alone, with no workflow in scope to have set one.
[github.inputs_schema]
type                 = "object"
additionalProperties = false

[github.inputs_schema.properties]
# The charset restrictions survive the move to values, where nothing is
# spliced into a command line any more, because they also bound what reaches
# github-worktree's own path and template handling.
workspace_layout_root = { type = "string", pattern = "^[A-Za-z0-9_./~:-]*$" }
issue_branch_template = { type = "string", pattern = "^[A-Za-z0-9_./{}-]*$" }
tagged_branch_suffix  = { type = "string", pattern = "^[A-Za-z0-9_./+{}-]*$" }
# A string, not a TOML boolean: a workflow's [workspace_provider_inputs] table
# carries data values as strings, so the schema states the two that mean
# something rather than accepting any spelling.
delete_branch_default = { type = "string", enum = ["true", "false"] }

# Outputs contract. `workspace_dir`/`branch` are always present; the rest
# degrade to absent when their gh-api fetch is tolerated as best-effort (see
# github-worktree's setup command). `mutable` keys may additionally be
# merged from trusted side paths (`plect state set-output`) — GitHub status
# for done_when is fetched by dynamic output refresh via the resource
# observers, not by re-running this hook.
[github.outputs_schema]
type     = "object"
required = ["workspace_dir", "branch"]

[github.outputs_schema.properties.workspace_dir]
type = "string"

[github.outputs_schema.properties.branch]
type = "string"

[github.outputs_schema.properties.url]
type = "string"

[github.outputs_schema.properties.owner_repo]
type = "string"

[github.outputs_schema.properties.owner]
type = "string"

[github.outputs_schema.properties.repo]
type = "string"

[github.outputs_schema.properties.number]
type = "integer"

[github.outputs_schema.properties.title]
type    = "string"
mutable = true

[github.outputs_schema.properties.pr_state]
type    = "string"
mutable = true

[github.outputs_schema.properties.issue_state]
type    = "string"
mutable = true
