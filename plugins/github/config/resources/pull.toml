# The generic Resource contract applied to a GitHub pull request. Independent
# of the GitHub workspace provider (workspaces/worktree.toml, which resolves a
# *session's* resource identifier to a worktree) — this consolidates the same
# observation into a standalone contract callable via `plect resource status`
# outside any one task instance.
#
# Issues get their own contract (issue.toml) rather than sharing this one: a
# pull request's facts are its own, while an issue's check and mergeability
# facts belong to whichever pull request closes it, so one state_schema
# covering both could only type them as a union whose halves are NULL by turns.
#
# workspace.dir is the observing task instance's session workspace directory
# when one exists, and absent for a standalone `plect resource status` call.
# A pull request needs neither, and the flag is passed for one observe
# invocation shared with issue.toml.

[pull]
kind  = "resource_observer"
match = '^https://github\.com/(?P<owner>[^/]+)/(?P<repo>[^/]+)/pull/(?P<number>\d+)'

[pull.observe]
type = "exec"
bin  = "github-issue-pr"
args = [
  "observe",
  "--resource",
  { from = "resource.id" },
  "--workspace-dir-path",
  { from = "workspace.dir", default = "" },
  "--watcher-bin",
  { bin = "github-watcher" },
]

# --watcher-bin/--cache-path are omitted: a population evaluator has no
# per-call app_id/private_key_path input to select a token by, so both
# binaries read deployment-level GitHub App auth from the environment
# instead.
[pull.query.poll]
type = "exec"
bin  = "github-issue-pr"
args = [
  "query-pulls",
  "--repositories",
  { json = { from = "inputs.repositories" } },
  "--labels",
  { json = { from = "inputs.labels" } },
  "--state",
  { from = "inputs.state" },
  "--draft",
  { expr = "inputs.draft ? 'true' : 'false'" },
]

[pull.query.subscribe]
type = "exec"
bin  = "github-webhook-receiver"
args = [
  "subscribe-pulls",
  "--repositories",
  { json = { from = "inputs.repositories" } },
  "--labels",
  { json = { from = "inputs.labels" } },
  "--state",
  { from = "inputs.state" },
  "--draft",
  { expr = "inputs.draft ? 'true' : 'false'" },
]

[pull.query.inputs_schema]
type                 = "object"
required             = ["repositories", "labels", "state", "draft"]
additionalProperties = false

[pull.query.inputs_schema.properties]
repositories = { type = "array", minItems = 1, items = { type = "string" } }
labels       = { type = "array", items = { type = "string" } }
state        = { type = "string", enum = ["open", "closed", "all"] }
draft        = { type = "boolean" }

[pull.query.item_schema]
type                 = "object"
required             = ["resource"]
additionalProperties = false

[pull.query.item_schema.properties]
resource   = { type = "string", format = "uri" }
owner      = { type = "string" }
repository = { type = "string" }

[pull.state_schema]
type     = "object"
required = ["resource_kind", "checks_status", "revision", "pr_url", "mergeable_state", "review_decision"]

[pull.state_schema.properties]
resource_kind = { type = "string", enum = ["pull"] }
# "NULL" here means the head commit has no checks configured at all, which is
# distinct from a rollup that is merely still running. A gh failure exits
# non-zero so the whole observation fails and prior values stand, rather than
# silently flipping a check to "NULL".
checks_status = { type = "string", enum = ["SUCCESS", "PENDING", "FAILURE", "NULL"] }
revision      = { type = "string" }
pr_url        = { type = "string" }
# GitHub's own vocabulary for pulls.mergeable_state. "unknown" is a real pull
# request whose mergeability GitHub is still computing, and must never read as
# a rebase prompt.
mergeable_state = { type = "string", enum = ["clean", "dirty", "unstable", "blocked", "behind", "unknown", "draft", "has_hooks"] }
# GitHub's own aggregate review verdict (GraphQL `reviewDecision`), plus
# "NULL" for GitHub reporting no decision because the pull request requires no
# reviewer.
review_decision = { type = "string", enum = ["APPROVED", "CHANGES_REQUESTED", "REVIEW_REQUIRED", "NULL"] }
