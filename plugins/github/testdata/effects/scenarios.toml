# What each of this plugin's effects is exercised with when its invocation
# record is regenerated. The stand-ins under bin/ answer for the GitHub CLI
# and pin the scratch directory mktemp would otherwise randomize.
#
# The completion declarations are task documents, which own no lifecycle and
# so invoke nothing; what they say is recorded by the gate-key record beside
# this one.

[gh_guard]
# The guard's product is the wrapper it writes into the directory it reports,
# so the record carries that file's contents as well as the calls.
[[gh_guard.artifacts]]
output = "dir"
path   = "gh"
