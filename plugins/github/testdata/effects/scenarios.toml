# What each of this plugin's effects is exercised with when its invocation
# record is regenerated. The stand-ins under bin/ answer for the GitHub CLI
# and pin the scratch directory mktemp would otherwise randomize.
#
# This plugin ships no task documents: the work/review/respond/investigate
# instructions are host config now, so there is nothing here for them to
# invoke.

[gh_guard]
# The guard's product is the wrapper it writes into the directory it reports,
# so the record carries that file's contents as well as the calls.
[[gh_guard.artifacts]]
output = "dir"
path   = "gh"

[gh_app_guard]
inputs = { app_id = "123456", installation_id = "987654", private_key_path = "/etc/plect/gh-app.pem" }
# Same rationale as gh_guard: the wrapper file it writes is the effect's real
# product, and its content is what actually pins the auth+deny composition
# (which bin it execs, which env vars it bakes in) — not just that setup
# exited 0.
[[gh_app_guard.artifacts]]
output = "dir"
path   = "gh"
