scope = "run"

# Inputs:
#   tmux_session  — pane to send keys into (from the upstream tmux node).
#   template      — initial-prompt template name (from session input; empty
#                   means no prompt is sent).
#   agent_session — ordering edge: forces this node to run after the agent is
#                   up. Its value is never read; only its presence in the
#                   workflow DAG matters.
#   repeat        — "true" resends the prompt on every `plect up` (a kick).
#                   Empty/unset sends it once per session lifetime.
#
# Workspace-provider-agnostic: the prompt is rendered with `--session {{.SessionName}}`,
# so the template receives session/workspace-provider vars without needing a resource
# URL. The session is persisted before this task runs, so the render can
# resolve it.
#
# Gate: by default `.Prev.sent` short-circuits re-sends across `plect down` →
# `up` (a resumed session stays quiet). `repeat=true` skips the gate so the
# prompt re-sends on every `up`. State is wiped on destroy, so the next
# `plect create` sends the prompt either way.
setup = '''
if [ '{{get .Inputs "repeat"}}' != "true" ] && [ '{{get .Prev "sent"}}' = "true" ]; then
  echo '{"sent":"true"}'
  exit 0
fi

SESSION='{{.Inputs.tmux_session}}'

# A cold pane can take tens of seconds to load its shell environment before
# the agent CLI's input box (a `›`/`❯` prompt line — CLI versions differ on
# which glyph they use) is even drawn. A fixed sleep loses the paste on a
# slow cold load, so poll for either glyph instead. A `--resume` node with a
# long conversation history (e.g. an orchestrator session) draws slower than
# a cold boot, which is why the bound below is generous: it only costs time
# on the failure path, since the loop exits as soon as the pane is ready.
ready=0
for _ in $(seq 1 180); do
  if tmux capture-pane -p -t "$SESSION" 2>/dev/null | grep -q '^[›❯]'; then
    ready=1
    break
  fi
  sleep 1
done
if [ "$ready" != 1 ]; then
  echo "initial_prompt: pane '$SESSION' did not show input box within 180s" >&2
  exit 1
fi

TEMPLATE='{{.Inputs.template}}'
if [ -n "$TEMPLATE" ]; then
  PROMPT=$(plect template render "$TEMPLATE" --session '{{.SessionName}}' 2>/dev/null || true)
  if [ -n "$PROMPT" ]; then
    # tmux send-keys caps argument length, and a long template (a multi-KB
    # operating procedure) exceeds it with "command too long". A tmux buffer
    # has no such cap, and bracketed paste (-p) makes the TUI treat the whole
    # buffer as one paste, so embedded newlines in the prompt body are never
    # read as a submit.
    printf '%s' "$PROMPT" | tmux load-buffer -b plect-initial-prompt -
    tmux paste-buffer -p -d -b plect-initial-prompt -t "$SESSION"
    # Right after a paste, the TUI can still treat the very next Enter as a
    # newline rather than a submit, so send it as a separate send-keys call
    # after a short pause.
    sleep 1
    tmux send-keys -t "$SESSION" Enter

    # The TUI's paste-burst detection window can still be open just after a
    # long paste, absorbing the trailing Enter as a newline instead of a
    # submit — a distinct race from the boot-readiness one above, so gating
    # on boot readiness alone does not fix it. Re-check the input box and
    # resend Enter with backoff until it reads empty (submitted); a session
    # with heavy resume history renders and processes input slowly enough
    # that this needs several rounds in practice.
    submitted=0
    for delay in 2 4 8 16; do
      input=$(tmux capture-pane -p -t "$SESSION" 2>/dev/null | grep '^[›❯]' | tail -n 1)
      # The `❯` glyph is followed by NBSP (U+00A0), not a regular space, in
      # observed pane output; normalize it before the case match below.
      input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
      case "$input" in
        ''|'›'|'› '|'❯'|'❯ ') submitted=1; break ;;
      esac
      sleep "$delay"
      tmux send-keys -t "$SESSION" Enter
    done
    if [ "$submitted" != 1 ]; then
      input=$(tmux capture-pane -p -t "$SESSION" 2>/dev/null | grep '^[›❯]' | tail -n 1)
      input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
      case "$input" in
        ''|'›'|'› '|'❯'|'❯ ') submitted=1 ;;
      esac
    fi
    if [ "$submitted" != 1 ]; then
      echo "initial_prompt: instruction still unsubmitted in pane '$SESSION' after retries" >&2
      exit 1
    fi
  fi
fi

echo '{"sent":"true"}'
'''

[inputs_schema]
type                 = "object"
required             = ["tmux_session"]
additionalProperties = false

[inputs_schema.properties]
tmux_session  = { type = "string" }
template      = { type = "string" }
agent_session = { type = "string" }
repeat        = { type = "string" }

[outputs_schema]
type     = "object"
required = ["sent"]

[outputs_schema.properties]
sent = { type = "string", enum = ["true"] }
