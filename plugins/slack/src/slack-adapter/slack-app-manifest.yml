display_information:
  name: Plecture Review Threads
  description: Posts Plecture review threads and conclusions to Slack
  background_color: "#DE7356"

features:
  bot_user:
    display_name: plect-review
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
