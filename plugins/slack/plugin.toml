schema_version = 2
version = "0.1.0"
# 0.0.0 matches app/internal/version.Current ("0.0.0-dev"): plect has no
# release/tagging process yet, so any higher floor would reject the plugin
# against every build until real versioning exists.
plect_min_version = "0.0.0"
description = "Slack adapter service, thread binding, and the Slack delivery channel."

[[executables]]
name = "slack-adapter"
path = "bin/slack-adapter"
build = "go -C src/slack-adapter build -o ../../bin/slack-adapter ./cmd/slack-adapter"

[[services]]
name = "slack-adapter"
executable = "slack-adapter"
# A bot token is enough for outbound thread creation and posting. Socket Mode
# remains inactive until an app token is configured.
required_env = ["SLACK_BOT_TOKEN"]
restart = "on-failure"
health = { type = "process" }
