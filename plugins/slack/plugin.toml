schema_version = 3
version = "0.1.0"
# 0.0.0 matches app/internal/version.Current ("0.0.0-dev"): plect has no
# release/tagging process yet, so any higher floor would reject the plugin
# against every build until real versioning exists.
plect_min_version = "0.0.0"
description = "Slack adapter service, thread subscriptions, and Slack delivery channels."

[[executables]]
name = "slack-adapter"
path = "bin/slack-adapter"
build = "go -C src/slack-adapter build -o ../../bin/slack-adapter ./cmd/slack-adapter"
service = true

[executables.config_schema]
type = "object"
required = ["bots"]
additionalProperties = false

[executables.config_schema.properties.bots]
type = "array"
minItems = 1

[executables.config_schema.properties.bots.items]
type = "object"
required = ["app_token_env", "bot_token_env", "channel_id", "allowed_user_ids"]
additionalProperties = false

[executables.config_schema.properties.bots.items.properties]
app_token_env = { type = "string", pattern = "^[A-Za-z_][A-Za-z0-9_]*$" }
bot_token_env = { type = "string", pattern = "^[A-Za-z_][A-Za-z0-9_]*$" }
channel_id = { type = "string", pattern = "^[A-Z0-9]+$" }
allowed_user_ids = { type = "array", items = { type = "string", pattern = "^[A-Z0-9]+$" } }
denied_user_message = { type = "string" }
denied_channel_message = { type = "string" }
