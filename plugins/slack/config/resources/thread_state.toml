# Colocated with workspaces/thread.toml because both recognize the same
# Slack thread permalink, but thread_state is a distinct resource_observer
# identity from that workspace provider: thread resolves a permalink to a
# session's workspace, while thread_state exists only to host the query
# face a workflow population binds to find threads with an unbound mention.
# A mention is not enumerable — there is no "list every currently-mentioned
# thread" API — so this observer declares only query.subscribe, never
# query.poll.
#
# observe is required by the language even though this observer has no live
# fact of its own to add beyond the appearance a query item already
# carries: the bound command prints "{}", matching the empty state_schema
# below rather than fabricating a state key.

[thread_state]
kind  = "resource_observer"
match = '^https://[A-Za-z0-9.-]+\.slack\.com/archives/[A-Z0-9]+/p\d{16}(?:\?thread_ts=\d{10}\.\d{6}&cid=[A-Z0-9]+)?$'

[thread_state.observe]
type = "exec"
bin  = "slack-adapter"
args = ["resource", "observe", "--resource", { from = "resource.id" }]

# The subscribe client never opens a second Socket Mode connection: it
# reads the resident adapter's own already-running unbound-mention feed and
# converts each mention straight into this query's item contract.
[thread_state.query.subscribe]
type = "exec"
bin  = "slack-adapter"
args = [
  "subscribe",
  "unbound-mentions",
  "--base-url",
  { from = "inputs.base_url" },
  "--channel-ids",
  { json = { from = "inputs.channel_ids" } },
]

[thread_state.query.inputs_schema]
type                 = "object"
required             = ["base_url", "channel_ids"]
additionalProperties = false

[thread_state.query.inputs_schema.properties]
base_url    = { type = "string", format = "uri" }
channel_ids = { type = "array", minItems = 1, items = { type = "string" } }

# resource, channel_id, thread_ts, and mention_ts mirror the adapter's own
# mention item exactly; state_schema below declares no property, so there
# is nothing here to overlap with it.
[thread_state.query.item_schema]
type                 = "object"
required             = ["resource"]
additionalProperties = false

[thread_state.query.item_schema.properties]
resource   = { type = "string", format = "uri" }
channel_id = { type = "string" }
thread_ts  = { type = "string" }
mention_ts = { type = "string" }

[thread_state.state_schema]
type                 = "object"
additionalProperties = false
