[thread]
kind = "resource"
match = '^https://[A-Za-z0-9.-]+\.slack\.com/archives/(?P<channel_id>[A-Z0-9]+)/p(?P<ts16>\d{16})(?:\?thread_ts=(?P<thread_ts>\d{10}\.\d{6})&cid=[A-Z0-9]+)?$'
name = { expr = "'slack/' + match.channel_id + '-' + (match.thread_ts != '' ? match.thread_ts.replace('.', '') : match.ts16)" }

[thread.observe]
type = "exec"
bin = "slack-adapter"
args = ["resource", "observe", "--resource", { from = "resource.id" }]

[thread.query.subscribe]
type = "exec"
bin = "slack-adapter"
args = ["subscribe", "unbound-mentions", "--socket", { from = "inputs.socket_path" }, "--channel-ids", { json = { from = "inputs.channel_ids" } }]

[thread.query.inputs_schema]
type = "object"
required = ["socket_path", "channel_ids"]
additionalProperties = false

[thread.query.inputs_schema.properties]
socket_path = { type = "string", minLength = 1, pattern = "^/" }
channel_ids = { type = "array", minItems = 1, uniqueItems = true, items = { type = "string", pattern = "^[A-Z0-9]+$" } }

[thread.query.item_schema]
type = "object"
required = ["resource"]
additionalProperties = false

[thread.query.item_schema.properties]
resource = { type = "string", format = "uri" }
channel_id = { type = "string" }
thread_ts = { type = "string" }
mention_ts = { type = "string" }
user_id = { type = "string" }

[thread.state_schema]
type = "object"
additionalProperties = false
