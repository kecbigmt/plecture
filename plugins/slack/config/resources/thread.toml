# This resource owns the thread's session identity and subscription hooks;
# tasks/thread_dir.toml is the effect that gives such a session a directory.
# A mention is not enumerable, so this observer declares no query.poll.

[thread]
kind  = "resource"
match = '^https://[A-Za-z0-9.-]+\.slack\.com/archives/(?P<channel_id>[A-Z0-9]+)/p(?P<ts16>\d{16})(?:\?thread_ts=(?P<thread_ts>\d{10}\.\d{6})&cid=[A-Z0-9]+)?$'
name  = { expr = "'slack/' + match.channel_id + '-' + (match.thread_ts != '' ? match.thread_ts.replace('.', '') : match.ts16)" }

# observe is required even though this observer has no live fact of its
# own to add; the bound command prints "{}" rather than fabricate one.
[thread.observe]
type = "exec"
bin  = "slack-adapter"
args = ["resource", "observe", "--resource", { from = "resource.id" }]

[thread.query.subscribe]
type = "exec"
bin  = "slack-adapter"
args = [
  "subscribe",
  "unbound-mentions",
  "--base-url",
  { from = "inputs.base_url" },
  "--channel-ids",
  { json = { from = "inputs.channel_ids" } },
  "--user-ids",
  { json = { from = "inputs.user_ids", default = [] } },
  "--denied-user-message",
  { from = "inputs.denied_user_message", default = "" },
  "--denied-channel-message",
  { from = "inputs.denied_channel_message", default = "" },
]

[thread.query.inputs_schema]
type                 = "object"
required             = ["base_url", "channel_ids"]
additionalProperties = false

[thread.query.inputs_schema.properties]
base_url               = { type = "string", format = "uri" }
channel_ids            = { type = "array", minItems = 1, items = { type = "string" } }
user_ids               = { type = "array", minItems = 1, items = { type = "string" } }
denied_user_message    = { type = "string" }
denied_channel_message = { type = "string" }

[thread.query.item_schema]
type                 = "object"
required             = ["resource"]
additionalProperties = false

[thread.query.item_schema.properties]
resource   = { type = "string", format = "uri" }
channel_id = { type = "string" }
thread_ts  = { type = "string" }
mention_ts = { type = "string" }
user_id    = { type = "string" }

[thread.state_schema]
type                 = "object"
additionalProperties = false
