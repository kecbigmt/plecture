[mentions]
kind  = "resource"
match = '^slack://(?P<team_id>[A-Z0-9]+)/(?P<bot_user_id>[A-Z0-9]+)/mentions$'
name  = { expr = "'slack/' + match.team_id + '-' + match.bot_user_id + '-mentions'" }

[mentions.observe]
type = "exec"
bin  = "slack-adapter"
args = ["resource", "observe", "--resource", { from = "resource.id" }]

[mentions.state_schema]
type = "object"
additionalProperties = false
