# Channel: deliver a session event to its Slack thread via this plugin's
# slack-adapter service (see this plugin's src/slack-adapter and its
# [[services]] declaration in plugin.toml) over that service's HTTP API.
# exec runs argv directly (no shell); the event reaches the adapter only as
# JSON values the serializer quotes and escapes, never as the command or URL.
# Posts the event body, falling back to its summary.
[slack]
kind    = "channel"
type    = "exec"
command = "curl"
args = [
  "-sf",
  "--max-time",
  "10",
  "-X",
  "POST",
  { expr = "inputs.base_url + '/messages'" },
  "-H",
  "Content-Type: application/json",
  "-d",
  { json = { thread_ts = { from = "inputs.thread_ts" }, channel_id = { from = "inputs.channel_id" }, text = { expr = "event.body != '' ? event.body : event.summary" } } },
]
timeout = "10s"

[slack.input_schema]
base_url   = { type = "string", required = true }
channel_id = { type = "string", required = true }
thread_ts  = { type = "string", required = true }
