[status]
kind = "channel"
type = "exec"
bin = "slack-adapter"
args = [
  "status", "set",
  "--config", { json = { from = "service.config" } },
  "--channel-id", { from = "inputs.channel_id" },
  "--thread-ts", { from = "inputs.thread_ts" },
  "--text", { expr = "event.body != '' ? event.body : event.summary" },
]
timeout = "10s"

[status.input_schema]
channel_id = { type = "string", required = true }
thread_ts = { type = "string", required = true }
