# A bare conversation directory for one Slack thread, with no repository
# checkout and no `slack-adapter` call. The session identity and the
# permalink forms it resolves from live on resources/thread.toml; a workflow
# whose entry resource is that thread composes this effect as a node and
# names its `workspace_dir` output as the workflow's `workdir`.
#
[thread_dir]
kind  = "effect"
scope = "session"

# `setup` has no `match` root, so it recovers channel_id and the root
# timestamp by re-parsing `permalink`, the same string the thread resource's
# `match` parsed to build `session.name` in the first place, rather than
# splitting `session.name` itself. `session.name` carries a trailing
# `+<workflow-id>` appended after resolution, which a positional slice of it
# can't tell apart from the digits it's after; `permalink` carries no such
# suffix.
[thread_dir.setup]
type = "shell"
script = '''
set -eu

# dirs_root is an operator-chosen input that nothing here constrains, so it
# cannot be assumed JSON-safe the way a permalink capture is. Escaping it by
# hand, rather than reaching for jq, keeps this action's dependencies at a
# POSIX shell.
json_escape() {
  value=$1
  ctrl=$(printf '\001\002\003\004\005\006\007\010\011\012\013\014\015\016\017\020\021\022\023\024\025\026\027\030\031\032\033\034\035\036\037')
  out=
  while [ -n "$value" ]; do
    case $value in
      *[\\\"$ctrl]*)
        prefix=${value%%[\\\"$ctrl]*}
        rest=${value#"$prefix"}
        char=${rest%"${rest#?}"}
        case $char in
          '\') repl='\\' ;;
          '"') repl='\"' ;;
          *) repl="\\u00$(printf '%02x' "'$char")" ;;
        esac
        out="$out$prefix$repl"
        value=${rest#?}
        ;;
      *)
        out="$out$value"
        value=
        ;;
    esac
  done
  printf '%s' "$out"
}

# Same shape `match` requires, walked by parameter expansion instead of a
# second regex engine call: .../archives/<channel_id>/p<ts16> optionally
# followed by ?thread_ts=<root-ts>&cid=<channel_id>.
rest=${permalink#*://}
rest=${rest#*/archives/}
channel_id=${rest%%/*}
rest=${rest#*/p}
ts16=${rest%%\?*}
if [ "$rest" != "$ts16" ]; then
  query=${rest#*\?}
  thread_ts=${query#thread_ts=}
  thread_ts=${thread_ts%%&*}
else
  thread_ts=""
fi
if [ -z "$thread_ts" ]; then
  thread_ts="${ts16%??????}.${ts16#??????????}"
fi

workspace_dir="${dirs_root:-$HOME/workspace_dirs}/slack/$channel_id/$thread_ts"
mkdir -p "$workspace_dir"

printf '{"workspace_dir":"%s","channel_id":"%s","thread_ts":"%s","permalink":"%s"}\n' \
  "$(json_escape "$workspace_dir")" "$(json_escape "$channel_id")" \
  "$(json_escape "$thread_ts")" "$(json_escape "$permalink")"
'''

[thread_dir.setup.bind]
permalink = { from = "resource.id" }
dirs_root = { from = "inputs.dirs_root", default = "" }

[thread_dir.cleanup]
type   = "shell"
script = 'rm -rf "$workspace_dir"'

[thread_dir.cleanup.bind]
workspace_dir = { from = "self.outputs.workspace_dir" }

[thread_dir.health.alive]
type    = "exec"
command = "test"
args    = ["-d", { from = "self.outputs.workspace_dir" }]

# Empty or absent selects `$HOME/workspace_dirs`, which the setup script
# itself resolves.
[thread_dir.inputs_schema]
type                 = "object"
additionalProperties = false

[thread_dir.inputs_schema.properties]
dirs_root = { type = "string" }

[thread_dir.outputs_schema]
type     = "object"
required = ["workspace_dir", "channel_id", "thread_ts", "permalink"]

[thread_dir.outputs_schema.properties.workspace_dir]
type = "string"

[thread_dir.outputs_schema.properties.channel_id]
type = "string"

[thread_dir.outputs_schema.properties.thread_ts]
type = "string"

[thread_dir.outputs_schema.properties.permalink]
type = "string"
