# What each of this plugin's effects is exercised with when its invocation
# record is regenerated. The launch line typed into the terminal is the
# contract here, so every steering input is set. bin/ pins the profile name,
# answers the pane introspection each launch performs, and — for the headless
# shape — stands in for the worker's own readiness signal.

[codex]
inputs = { tmux_session = "acme-widget-1", model = "gpt-5.6-sol", effort = "high", launch_env = '{"PLECT_TEAM_CONTEXT":"acme"}', path_prepend = "/spy/guard" }
# The readiness poll reads the endpoint; a bare prompt line is neither the
# boot banner nor the busy indicator, so it reads as ready.
capture = "› "

# The launch reads the session transcript to learn its own session id.
[[codex.files]]
path    = ".codex/sessions/rollout.jsonl"
content = '{"type":"session_meta","payload":{"cwd":"WORKSPACE","session_id":"11111111-2222-3333-4444-555555555555"}}'

[codex_exec]
inputs = { tmux_session = "acme-widget-1", model = "gpt-5.6-sol", effort = "high", launch_env = '{"PLECT_TEAM_CONTEXT":"acme"}', path_prepend = "/spy/guard" }

[codex_initial_prompt]
inputs  = { terminal_ready = "acme-widget-1", agent_session = "1234", template = "work", repeat = "" }
capture = "› "
