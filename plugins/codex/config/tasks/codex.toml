scope   = "run"
primary = true

# Inputs:
#   tmux_session — the multiplexer's own session/pane identifier (typically
#                  {{.Nodes.tmux.outputs.session_name}} from whichever task
#                  in the workflow declares [terminal]). Launch keystrokes go
#                  through {{terminal "..."}}; this value is still needed
#                  directly below for `tmux display-message`/`tmux
#                  capture-pane`'s process-tree and TUI-readiness discovery,
#                  which has no [terminal] verb of its own — a documented,
#                  scoped-out gap, same as this plugin's claude counterpart
#                  (see docs/design/plugin-boundary-contracts.md's Terminal
#                  Operation Surface).
#   model        — when set, appended to every launch as `-m <value>`. Empty
#                  = codex's own config default. Restricted to a plain-token
#                  charset (see inputs_schema) since it is spliced into this
#                  setup script.
#   effort       — when set, appended as `-c model_reasoning_effort=<value>`.
#                  Empty = codex's own config default. Same restriction.
#   path_prepend — when set, a directory prepended to this session's PATH.
#                  Generic by design (docs/design/plugin-boundary-contracts.md's
#                  GitHub CLI Guard section): this plugin carries no
#                  GitHub-specific guard switch of its own. A workflow that
#                  wants the write guard wires this from the github
#                  plugin's own gh_guard task output, e.g.
#                  `{{.Nodes.gh_guard.outputs.dir}}`.
#
# Codex CLI does not expose a Claude Code-style channel-server transport.
# This task therefore only starts the interactive Codex TUI in tmux and lets
# plect manage its process lifecycle.
#
setup = '''
# agent_activity self-report hooks: UserPromptSubmit/Stop call
# codex-agent-activity, fire-and-forget by design. Hook registration is
# written to a per-session codex profile file, not assembled as a `-c` value
# on the launch command: the JSON-in-CLI-arg form gets mangled once relayed
# through the terminal (shell quoting breaks in transit), so nothing
# hook-related rides the command line here. `bypass_hook_trust` moves into
# the profile file too, alongside the hooks table, since it's just a config
# key.
#
# The reset drops any record a previous run left behind, so this run's
# activity probe reports "no basis yet" until this run's first turn boundary
# rather than inheriting a stale fingerprint.
{{bin "codex-agent-activity"}} reset {{.SessionName}}

CODEX_HOME_DIR="${CODEX_HOME:-$HOME/.codex}"
mkdir -p "$CODEX_HOME_DIR"
PROFILE_NAME="plect-$(uuidgen)"
PROFILE_PATH="$CODEX_HOME_DIR/$PROFILE_NAME.config.toml"
cat > "$PROFILE_PATH" <<'HOOKS_TOML'
bypass_hook_trust = true

[hooks]
UserPromptSubmit = [{type = "command", command = ["{{bin "codex-agent-activity"}}", "working"]}]
Stop = [{type = "command", command = ["{{bin "codex-agent-activity"}}", "waiting"]}]
HOOKS_TOML

MODEL='{{get .Inputs "model"}}'
MODEL_FLAG=""
[ -n "$MODEL" ] && MODEL_FLAG="-m $MODEL"
EFFORT='{{get .Inputs "effort"}}'
EFFORT_FLAG=""
[ -n "$EFFORT" ] && EFFORT_FLAG="-c model_reasoning_effort=$EFFORT"

PREV_SID='{{get .Prev "session_id"}}'
if [ -n "$PREV_SID" ]; then
  CODEX_CMD="codex resume --dangerously-bypass-approvals-and-sandbox --profile $PROFILE_NAME $MODEL_FLAG $EFFORT_FLAG $PREV_SID"
else
  CODEX_CMD="codex --dangerously-bypass-approvals-and-sandbox --profile $PROFILE_NAME $MODEL_FLAG $EFFORT_FLAG"
fi

# Runtime plect commands use this as their current session and as the default
# parent when they dispatch child sessions.
EXPORTS="export PLECT_SESSION_NAME={{.SessionName}}; "

# path_prepend is a plain directory path, not shell-quoted here beyond the
# inputs_schema pattern restriction below — the same defense-in-depth
# reasoning as model/effort's comment applies (a crafted value could break
# out of this splice point otherwise).
PATH_PREPEND='{{get .Inputs "path_prepend"}}'
[ -n "$PATH_PREPEND" ] && EXPORTS="${EXPORTS}export PATH=$PATH_PREPEND:\$PATH; "

MARKER=$(mktemp)
touch "$MARKER"
TIMEOUT_SECONDS="${PLECT_CODEX_STARTUP_TIMEOUT_SECONDS:-60}"
ATTEMPTS=$((TIMEOUT_SECONDS * 2))

# No `exec`: Codex runs as a child of the pane shell, so exiting Codex
# returns to the shell instead of closing the pane — which would otherwise
# tear down the whole tmux session out from under an attached user. The pane
# PID is therefore the shell, not Codex; its real PID is the matching child,
# found below (the same shape this plugin's claude task uses to resolve
# its agent PID).
#
# The terminal template helper composes against whichever task in this
# workflow declares its interactive endpoint — never a concrete
# multiplexer named here directly. (Spelled out as prose, not as the
# literal helper call, because this comment is inside the setup string
# itself and Go's template engine parses delimiters wherever they appear,
# comment or not.)
send_text_cmd={{terminal "send_text" | shellQuote}}
send_keys_cmd={{terminal "send_keys" | shellQuote}}
sh -c "$send_text_cmd" terminal-send-text "${EXPORTS}${CODEX_CMD}"
sh -c "$send_keys_cmd" terminal-send-keys Enter

PANE_PID=$(tmux display-message -p -t {{.Inputs.tmux_session}} '#{pane_pid}')
PID=""
SID=""
for _ in $(seq 1 "$ATTEMPTS"); do
  sleep 0.5
  kill -0 "$PANE_PID" 2>/dev/null || continue
  for child in $(pgrep -P "$PANE_PID" 2>/dev/null); do
    COMM=$(ps -p "$child" -o comm= 2>/dev/null | tr -d '[:space:]')
    case "$COMM" in codex|codex-*) PID="$child"; break ;; esac
  done

  SID=$(find "$HOME/.codex/sessions" -type f -newer "$MARKER" -name '*.jsonl' 2>/dev/null \
    | while IFS= read -r file; do
        head -n 1 "$file" | jq -r --arg cwd '{{.WorkspaceDirPath}}' \
          'select(.type == "session_meta" and .payload.cwd == $cwd) | (.payload.session_id // empty)' 2>/dev/null
      done \
    | grep -E '^[0-9a-fA-F-]{36}$' \
    | tail -1)
  [ -n "$PID" ] && break
done
if [ -z "$PID" ]; then
  echo "codex not detected within ${TIMEOUT_SECONDS}s under pane pid $PANE_PID" >&2
  rm -f "$MARKER"
  exit 1
fi
rm -f "$MARKER"

# A detected PID only means Codex has started, not that its TUI/MCP is done
# booting and can accept a submit. Delivering the initial instruction before
# that point types it into the input box without an Enter that actually
# submits, so it silently merges into whatever turn kicks the session later.
# Wait for the boot banner to clear and the prompt to hold steady across
# consecutive samples (not a fixed sleep, since MCP boot time varies) before
# declaring the task produced.
READY_TIMEOUT_SECONDS="${PLECT_CODEX_READY_TIMEOUT_SECONDS:-60}"
READY_ATTEMPTS=$((READY_TIMEOUT_SECONDS * 2))
STABLE_STREAK=0
STABLE_STREAK_REQUIRED=3
capture_cmd={{terminal "capture" | shellQuote}}
READY=0
for _ in $(seq 1 "$READY_ATTEMPTS"); do
  sleep 0.5
  PANE=$(sh -c "$capture_cmd" terminal-capture 2>/dev/null)
  if printf '%s' "$PANE" | grep -qE 'Booting MCP server|esc to interrupt'; then
    STABLE_STREAK=0
    continue
  fi
  STABLE_STREAK=$((STABLE_STREAK + 1))
  if [ "$STABLE_STREAK" -ge "$STABLE_STREAK_REQUIRED" ]; then
    READY=1
    break
  fi
done
if [ "$READY" -ne 1 ]; then
  echo "codex pid $PID detected but TUI not ready (boot banner / busy indicator still present) within ${READY_TIMEOUT_SECONDS}s" >&2
  exit 1
fi

jq -nc \
  --argjson pid "$PID" \
  --arg sid "$SID" \
  --arg profile "$PROFILE_PATH" \
  '{pid:$pid, session_id:$sid, profile_path:$profile}'
'''

cleanup = '''
kill -TERM {{.Self.pid}} 2>/dev/null || exit 0
for _ in 1 2 3 4 5; do
  sleep 0.5
  kill -0 {{.Self.pid}} 2>/dev/null || break
done
kill -KILL {{.Self.pid}} 2>/dev/null || true
# get, not .Self.profile_path: a session produced before this field existed
# has no such key, and .Self's strict missingkey semantics would error.
PROFILE_PATH='{{get .Self "profile_path"}}'
[ -n "$PROFILE_PATH" ] && rm -f "$PROFILE_PATH"
{{bin "codex-agent-activity"}} reset {{.SessionName}}
true
'''

# This task's [health] table. The turn-boundary hooks registered at setup are
# this task's activity probe: the hook records each boundary and the probe
# reads the record back, so one plugin executable owns both halves. The probe
# reports no activity_expected opinion — a turn boundary attests that the
# agent moved, not whether more movement is owed, which is core's
# done_when-derived judgment.
[health]
alive    = "kill -0 {{.Self.pid}}"
activity = '{{bin "codex-agent-activity"}} probe {{.SessionName}}'

[inputs_schema]
type                 = "object"
required             = ["tmux_session"]
additionalProperties = false

# model/effort: restricted to a plain-token charset (no quotes, whitespace,
# or newlines) so a malicious value is rejected here, before it ever reaches
# this setup script's template splice.
[inputs_schema.properties]
tmux_session = { type = "string" }
model        = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
effort       = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
# path_prepend: a plain path charset (no quotes, whitespace, or shell
# metacharacters), same reasoning as model/effort above.
path_prepend = { type = "string", pattern = "^[A-Za-z0-9_./:-]*$" }

[outputs_schema]
type     = "object"
required = ["pid", "session_id"]

[outputs_schema.properties]
pid          = { type = "integer" }
session_id   = { type = "string" }
profile_path = { type = "string" }
