scope = "run"

# Inputs:
#   terminal_ready — ordering edge: forces this node to run after the
#                    session's [terminal]-declaring task (this plugin's own
#                    launch task does not own the interactive endpoint —
#                    the multiplexer plugin's task does) and after the
#                    agent is up. Its value is never read; only its
#                    presence in the workflow DAG matters, so a workflow
#                    typically wires it to
#                    {{.Nodes.<multiplexer>.outputs.session_name}} or
#                    similar — any upstream output that exists once the
#                    terminal is ready is enough.
#   template       — initial-prompt template name (from session input;
#                    empty means no prompt is sent).
#   agent_session  — a second ordering edge: forces this node to run after
#                    the agent launch task specifically. Its value is never
#                    read either.
#   repeat         — "true" resends the prompt on every `plect up` (a
#                    kick). Empty/unset sends it once per session lifetime.
#
# Composes the session's {{terminal "..."}} verbs instead of naming a
# concrete multiplexer directly (docs/design/plugin-boundary-contracts.md's
# Terminal Operation Surface) — this plugin owns its own initial-prompt
# submit/readiness composition (prompt glyphs, paste-burst retry schedule)
# because that describes codex's TUI contract, not the multiplexer's.
#
# Gate: by default `.Prev.sent` short-circuits re-sends across `plect down`
# → `up` (a resumed session stays quiet). `repeat=true` skips the gate so
# the prompt re-sends on every `up`. State is wiped on destroy, so the next
# `plect create` sends the prompt either way.
setup = '''
if [ '{{get .Inputs "repeat" ""}}' != "true" ] && [ '{{get .Prev "sent" ""}}' = "true" ]; then
  echo '{"sent":"true"}'
  exit 0
fi

send_text_cmd={{terminal "send_text" | shellQuote}}
send_keys_cmd={{terminal "send_keys" | shellQuote}}
capture_cmd={{terminal "capture" | shellQuote}}

# A cold pane can take tens of seconds to load its shell environment before
# the agent CLI's input box (a `›`/`❯` prompt line — CLI versions differ on
# which glyph they use) is even drawn. A fixed sleep loses the paste on a
# slow cold load, so poll for either glyph instead. A `--resume` node with a
# long conversation history (e.g. an orchestrator session) draws slower than
# a cold boot, which is why the bound below is generous: it only costs time
# on the failure path, since the loop exits as soon as the pane is ready.
ready=0
for _ in $(seq 1 180); do
  if sh -c "$capture_cmd" terminal-capture 2>/dev/null | grep -q '^[›❯]'; then
    ready=1
    break
  fi
  sleep 1
done
if [ "$ready" != 1 ]; then
  echo "initial_prompt: terminal did not show input box within 180s" >&2
  exit 1
fi

TEMPLATE='{{.Inputs.template}}'
if [ -n "$TEMPLATE" ]; then
  PROMPT=$(plect template render "$TEMPLATE" --session '{{.SessionName}}' 2>/dev/null || true)
  if [ -n "$PROMPT" ]; then
    sh -c "$send_text_cmd" terminal-send-text "$PROMPT"
    sleep 1
    sh -c "$send_keys_cmd" terminal-send-keys Enter

    # The TUI's paste-burst detection window can still be open just after a
    # long paste, absorbing the trailing Enter as a newline instead of a
    # submit — a distinct race from the boot-readiness one above, so gating
    # on boot readiness alone does not fix it. Re-check the input box and
    # resend Enter with backoff until it reads empty (submitted); a session
    # with heavy resume history renders and processes input slowly enough
    # that this needs several rounds in practice.
    submitted=0
    for delay in 2 4 8 16; do
      input=$(sh -c "$capture_cmd" terminal-capture 2>/dev/null | grep '^[›❯]' | tail -n 1)
      # The `❯` glyph is followed by NBSP (U+00A0), not a regular space, in
      # observed pane output; normalize it before the case match below.
      input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
      case "$input" in
        ''|'›'|'› '|'❯'|'❯ ') submitted=1; break ;;
      esac
      sleep "$delay"
      sh -c "$send_keys_cmd" terminal-send-keys Enter
    done
    if [ "$submitted" != 1 ]; then
      input=$(sh -c "$capture_cmd" terminal-capture 2>/dev/null | grep '^[›❯]' | tail -n 1)
      input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
      case "$input" in
        ''|'›'|'› '|'❯'|'❯ ') submitted=1 ;;
      esac
    fi
    if [ "$submitted" != 1 ]; then
      echo "initial_prompt: instruction still unsubmitted after retries" >&2
      exit 1
    fi
  fi
fi

echo '{"sent":"true"}'
'''

[inputs_schema]
type                 = "object"
additionalProperties = false

[inputs_schema.properties]
terminal_ready = { type = "string" }
template       = { type = "string" }
agent_session  = { type = "string" }
repeat         = { type = "string" }

[outputs_schema]
type     = "object"
required = ["sent"]

[outputs_schema.properties]
sent = { type = "string", enum = ["true"] }
