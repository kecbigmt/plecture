# Channel: deliver a session event to the Codex TUI by typing it into the
# session's terminal via the session's own [terminal] verbs — this file never
# names a concrete multiplexer, so it works unmodified against any effect
# that declares them. This plugin owns the burst split, readiness predicate,
# and retry policy below because they describe the Codex TUI contract
# specifically (docs/design/plugin-boundary-contracts.md's Codex Terminal
# Submit): the TUI treats an Enter that arrives in the same send-keys burst
# as the text as a newline, not a submit, so the keystrokes must be split:
# send text, short sleep, then send Enter (mirrors tasks/initial_prompt.toml).
#
# A single `sleep 1` before Enter is not enough: on long/multi-line
# instructions the TUI's paste-burst detection window can still be open past
# 1s, so the trailing Enter is absorbed as a newline inside the burst instead
# of acting as submit — a separate race from pane-boot readiness, so it is
# not fixed by gating on boot. After the first Enter, re-check the input box
# (the `›`/`❯` prompt line from a capture — different CLI versions use
# different glyphs) and resend Enter with backoff until it's empty; if it
# never clears, fail loudly instead of leaving a silent, unsubmitted
# instruction sitting in the pane. The `❯` glyph is followed by NBSP
# (U+00A0), not a regular space, in observed pane output, so normalize it to
# a space before the case match. A pane resuming a long conversation can stay
# slow past a short backoff, hence the longer 2+4+8+16 schedule.
[terminal_submit]
kind    = "channel"
type    = "shell"
timeout = "45s"

script = '''
set -u
sh -c "$send_text" terminal-send-text "$message"
sleep 1
sh -c "$send_keys" terminal-send-keys Enter
for delay in 2 4 8 16; do
  input=$(sh -c "$capture" terminal-capture 2>/dev/null | grep '^[›❯]' | tail -n 1)
  input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
  case "$input" in
    ''|'›'|'› '|'❯'|'❯ ') exit 0 ;;
  esac
  sleep "$delay"
  sh -c "$send_keys" terminal-send-keys Enter
done
input=$(sh -c "$capture" terminal-capture 2>/dev/null | grep '^[›❯]' | tail -n 1)
input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
case "$input" in
  ''|'›'|'› '|'❯'|'❯ ') exit 0 ;;
esac
echo "terminal_submit: instruction still unsubmitted after 4 retries" >&2
exit 1
'''

# The message is computed here rather than assembled by the script, so the
# script stays a literal the event can never reach.
[terminal_submit.bind]
send_text = { terminal = "send_text" }
send_keys = { terminal = "send_keys" }
capture   = { terminal = "capture" }
message   = { expr = "'[' + event.type + '] ' + (event.body != '' ? event.body : event.summary) + ('url' in event.metadata ? ' (' + event.metadata.url + ')' : '')" }
