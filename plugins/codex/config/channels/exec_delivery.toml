# Core holds the events this binding selects in the session inbox, and
# codex-exec-worker (launched by tasks/exec_runtime.toml) takes them from
# there. Unlike this plugin's terminal_submit channel, nothing is typed and
# nothing waits on the worker's current turn.
# The id is `exec_delivery` rather than the runtime's own `exec_runtime`: one
# plugin has one definition id namespace across every kind, so an effect and
# the channel that reaches it cannot share a name.
[exec_delivery]
kind = "channel"
type = "inbox"
