# goal-review agent (local-okf): dispatches an agent session against a
# local-okf goal resource, then delivers the goal_review task's
# instructions.
#
# This is a reference composition, not a self-contained agent runtime: the
# tmux/envfile/slack_thread/codex_exec/initial_task nodes below are task
# ids this plugin does not define — okf is scoped by the OKF specification,
# not by any particular agent CLI or chat channel, so which agent runs the
# review and how it's reached is a choice made by whichever agent-runtime
# and channel plugins the operator has enabled. Swap these node `uses`
# values for the equivalent task ids your own agent-runtime plugin
# provides if they differ.
name        = "goal-review agent (local-okf)"
description = "Dispatch an agent session against a local-okf goal resource, then deliver the goal_review task's instructions."

provider = "local-okf"

[display]
title  = "{{.Workflow.outputs.concept_id}}"
status = "goal_review"

[inputs_schema]
type                 = "object"
additionalProperties = false
required             = ["task"]

[inputs_schema.properties.task]
type        = "string"
description = "Initial task to instantiate for this session. Plect creates the matching task and delivers its instruction to the agent. Pass \"none\" to start an ad-hoc session with no initial instruction."
enum        = ["goal_review", "none"]
examples    = ["goal_review"]

# Review context wired by the goal review chain (tasks/pursue_goal.toml
# [[chains]]): the target session whose goal-met judge this review records
# a verdict for, and the pursue_goal task instance that judge leaf lives
# on.
[inputs_schema.properties.work_session]
type        = "string"
description = "Target session whose pursue_goal instance's goal-met judge this review records a verdict for."

[inputs_schema.properties.instance]
type        = "string"
description = "Task instance name of the pursue_goal instance on work_session (e.g. goal_<slug>)."

[inputs_schema.properties.judge_ids]
type        = "string"
description = "Space-separated pending judge leaf ids to record (one action per id; goal-met today)."

[[nodes]]
uses = "envfile"

[[nodes]]
uses = "slack_thread"

[[nodes]]
uses = "tmux"

[[nodes]]
uses                    = "codex_exec"
inputs.tmux_session     = "{{.Nodes.tmux.outputs.session_name}}"
inputs.slack_thread_ts  = "{{.Nodes.slack_thread.outputs.thread_ts}}"
inputs.slack_channel_id = "{{.Nodes.slack_thread.outputs.channel_id}}"

[[nodes]]
uses        = "initial_task"
inputs.task = "{{get .SessionInputs \"task\"}}"

[[event.channel]]
name             = "runtime"
uses             = "codex_exec"
inputs.queue_dir = "{{.Nodes.codex_exec.outputs.queue_dir}}"
include          = ["plect.instruction", "user.emit", "plect.terminal.*"]

[[event.channel]]
name              = "slack"
uses              = "slack_thread"
inputs.channel_id = "{{.Nodes.slack_thread.outputs.channel_id}}"
inputs.thread_ts  = "{{.Nodes.slack_thread.outputs.thread_ts}}"
include           = ["user.emit"]
