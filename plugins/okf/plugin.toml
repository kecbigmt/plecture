schema_version     = 1
version            = "0.1.0"
plect_min_version  = "0.0.0"
description        = "OKF goal resource: parsing, workspace dispatch, observation, and finalization for a local knowledge bundle's goal Concepts, plus the goal_bootstrap effect."

[[executables]]
name  = "okf-goal"
path  = "bin/okf-goal"
build = "go -C src build -o ../bin/okf-goal ./cmd/okf-goal"

[[executables]]
name  = "okf-bundle"
path  = "bin/okf-bundle"
build = "go -C src build -o ../bin/okf-bundle ./cmd/okf-bundle"
