# pursue_goal: one instance tracks one local-okf goal Concept. Add it to
# the owner's orchestrator session with the goal's resource id; the
# instance name convention is goal_<slug> (hyphens replaced with
# underscores, since instance names must be Go-template identifiers) so a
# second setup of the same goal collides on --name instead of silently
# duplicating:
#
#   plect task setup pursue_goal \
#     --session <owner>/_orchestrator \
#     --name goal_<slug> \
#     --resource local-okf://<owner>/goals/<slug>.md
#
# setup only gates the resource kind — goal-specific completion conditions
# live in the goal file's "## Done When" checklist, not in generated
# done_when config.
[pursue_goal]
kind  = "effect"
scope = "session"

[pursue_goal.setup]
type = "exec"
bin  = "okf-goal"
args = ["task", "validate-goal-resource", "--resource", { from = "resource.id" }]

# Observed goal state is copied from the resource definition
# (resources/okf_goal.toml) rather than fetched by a task-local script, so
# `plect resource status`, show, and this instance all read one contract.
# revision (= goal_revision) is the key judge staleness compares, so editing
# the goal file re-pends a recorded judge.
[[pursue_goal.outputs]]
produces = ["goal_parse_status", "goal_status", "checklist_status", "goal_revision", "revision", "open_items"]
from_resource_status = true

# goal_parse_status must be SUCCESS: FAILURE (malformed file) and UNRESOLVED
# (goal not locatable — e.g. orchestrator destroy in progress) both keep the
# check unsatisfied. goal_status must still be "open": completed is the
# consequence of satisfaction, never its precondition. The goal usually
# lives on the session-tree root (the owner's orchestrator), which has no
# parent and supervises its own children — so child is deliberately
# excluded (a supervised child approving its own supervisor's goal is a
# back door, not independence). sibling alone is accepted; the goal_review
# chain below spawns one.
[pursue_goal.done_when]
all = [
  { check = "goal_parse_status", in = ["SUCCESS"] },
  { check = "goal_status", in = ["open"] },
  { check = "checklist_status", in = ["SUCCESS"] },
  { judge = "goal is achieved according to the goal file and event evidence", id = "goal-met", relation = ["sibling"] },
]

# No budget: heartbeat_budget is a convergence bound, and a long-lived goal
# existing is not exhaustion — unbounded by omission.

# Once the checklist is fully satisfied and only goal-met is pending, spawn
# an independent goal_review reviewer as this session's sibling. The chain
# instance is keyed by this pursue_goal instance (Task.Instance below), so
# each goal tracked on the same session gets its own reviewer instead of
# colliding on one chain-spawn tag.
[[pursue_goal.chains]]
id        = "goal_review"
workflow  = "goal_review"
placement = "sibling"

[pursue_goal.chains.when]
all = [
  { check = "goal_parse_status", in = ["SUCCESS"] },
  { check = "goal_status", in = ["open"] },
  { check = "checklist_status", in = ["SUCCESS"] },
  { judge_pending = "goal-met" },
]

[pursue_goal.chains.inputs]
task         = "goal_review"
work_session = '{{.Work.session}}'
instance     = '{{.Work.instance}}'
judge_ids    = '{{.Work.done_when.pending_judge_ids}}'
