# goal_review: a session that reviews one local-okf goal, spawned by
# pursue_goal's chain once the goal's checklist is satisfied. Its own
# resource is the goal file being reviewed (resources/okf_goal.toml), not
# the target session's — its outputs mirror that resource's observe shape
# (goal_parse_status/goal_status/checklist_status/goal_revision/open_items)
# rather than any other resource kind's vocabulary.
#
# There is no third party to judge a reviewer, so this effect's own
# done_when cannot use a judge leaf either. Completion is instead this
# reviewer's self-report of "I recorded the goal-met verdict on the target
# session", captured as a revision (not a boolean) so a later goal file
# edit invalidates it automatically.
[goal_review]
kind  = "effect"
scope = "session"
requires = ["goal_parse_status", "verdict_current"]

[goal_review.setup]
type   = "shell"
script = '''
INSTRUCTION=$(plect template render goal_review --session "$session" --instruction "$extra")
if [ -z "$INSTRUCTION" ]; then
  echo "plect template render goal_review produced empty instruction" >&2
  exit 1
fi
jq -nc --arg instruction "$INSTRUCTION" '{instruction:$instruction}'
'''

[goal_review.setup.bind]
session = { from = "session.name" }
extra   = { from = "inputs.instruction", default = "" }

[[goal_review.outputs]]
produces = ["goal_parse_status", "goal_status", "checklist_status", "goal_revision", "revision", "open_items"]
from_resource_status = true

[[goal_review.outputs]]
name = "verdict_current"
script = '''
CURRENT_REVISION=$(plect resource status {{.ResourceID | shellQuote}} --json | jq -r '.state.revision // empty')
if [ -n "$CURRENT_REVISION" ] && [ {{.Self.verdict_revision | shellQuote}} = "$CURRENT_REVISION" ]; then
  echo true
else
  echo false
fi
'''

[goal_review.done_when]
all = [
  { check = "goal_parse_status", in = ["SUCCESS"] },
  { check = "verdict_current", in = ["true"] },
]

[goal_review.done_when.budget]
heartbeat_budget = 3
on_exhaust = "escalate"

[goal_review.inputs_schema]
type                 = "object"
additionalProperties = false

[goal_review.inputs_schema.properties]
instruction = { type = "string" }

[goal_review.outputs_schema]
type     = "object"
required = ["instruction"]

[goal_review.outputs_schema.properties]
instruction       = { type = "string" }
goal_parse_status = { type = "string", mutable = true }
goal_status       = { type = "string", mutable = true }
checklist_status  = { type = "string", mutable = true }
goal_revision     = { type = "string", mutable = true }
revision          = { type = "string", mutable = true }
open_items        = { type = "string", mutable = true }
verdict_revision  = { type = "string", mutable = true }
verdict_current   = { type = "string" }
