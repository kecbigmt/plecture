scope = "run"

# Session name / cwd come from the session itself, not from upstream nodes —
# tmux has no node-level inputs. A workflow wires
# {{.Nodes.tmux.outputs.session_name}} into downstream nodes that send keys
# into the pane this task creates.
setup = '''
tmux has-session -t {{.SessionName}} 2>/dev/null \
  || tmux new-session -d -s {{.SessionName}} -c {{.WorkspaceDirPath}}
tmux has-session -t {{.SessionName}} \
  || { echo "failed to ensure tmux session {{.SessionName}}" >&2; exit 1; }
echo '{"session_name":"{{.SessionName}}"}'
'''

cleanup = 'tmux kill-session -t {{.Self.session_name}} 2>/dev/null || true'

# This task's [health] table. `activity` is the generic, agent-agnostic half
# of the session's activity evidence: a pane whose visible contents keep
# changing is moving, whatever is running in it. It is deliberately paired
# with (not replaced by) an agent runtime's own turn-boundary probe — a
# single long turn crosses no boundary, so without this pane fingerprint the
# session would read stalled while the agent is plainly working.
[health]
alive = 'tmux has-session -t {{.Self.session_name}}'
activity = '''
PANE=$(tmux capture-pane -p -t {{.Self.session_name}}) || exit 1
# cksum, not sha256sum/shasum: POSIX, present on both GNU and BSD userlands,
# and this is a change detector rather than a security digest.
FP=$(printf '%s' "$PANE" | cksum | tr -d ' \t')
# No silence_expected: a pane's contents cannot establish that quiet is
# intended, so this probe never pardons silence.
jq -nc --arg fp "$FP" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  '{fingerprint: $fp, observed_at: $at}'
'''

# The four verbs below are this task's [terminal] table: attach/capture are
# consumed by `plect attach`/`plect capture`, and all four are reachable from
# any task hook or channel via {{terminal "..."}} without that consumer
# knowing tmux is behind it. send_text receives the literal text to type as
# its first positional argument; send_keys receives a key token (e.g.
# "Enter") the same way. TOML scopes every bare key after a table header to
# that table, so this must be the last table-free content in the file —
# [outputs_schema] below is its own table and is unaffected.
[terminal]
attach     = 'tmux attach -t {{.Self.session_name}}'
capture    = 'tmux capture-pane -p -t {{.Self.session_name}}'
send_text  = 'tmux send-keys -t {{.Self.session_name}} -- "$1"'
send_keys  = 'tmux send-keys -t {{.Self.session_name}} "$1"'

[outputs_schema]
type     = "object"
required = ["session_name"]

[outputs_schema.properties]
session_name = { type = "string" }
