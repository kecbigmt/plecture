[tmux]
kind  = "effect"
scope = "run"

# Session name / workspace directory come from the session itself, not from
# upstream nodes — tmux has no node-level inputs. A workflow wires this
# effect's `session_name` output into downstream nodes that send keys into
# the pane it creates.
[tmux.setup]
type   = "shell"
script = '''
tmux has-session -t "$session_name" 2>/dev/null \
  || tmux new-session -d -s "$session_name" -c "$workspace_dir"
tmux has-session -t "$session_name" \
  || { echo "failed to ensure tmux session $session_name" >&2; exit 1; }
jq -nc --arg name "$session_name" '{session_name:$name}'
'''

[tmux.setup.bind]
session_name  = { from = "session.name" }
workspace_dir = { from = "workspace.dir" }

[tmux.cleanup]
type   = "shell"
script = 'tmux kill-session -t "$session_name" 2>/dev/null || true'

[tmux.cleanup.bind]
session_name = { from = "self.outputs.session_name" }

# `activity` is the generic, agent-agnostic half of the session's activity
# evidence: a pane whose visible contents keep changing is moving, whatever
# is running in it. It is deliberately paired with (not replaced by) an agent
# runtime's own turn-boundary probe — a single long turn crosses no boundary,
# so without this pane fingerprint the session would read stalled while the
# agent is plainly working.
[tmux.health.alive]
type    = "exec"
command = "tmux"
args    = ["has-session", "-t", { from = "self.outputs.session_name" }]

[tmux.health.activity]
type   = "shell"
script = '''
PANE=$(tmux capture-pane -p -t "$session_name") || exit 1
# cksum, not sha256sum/shasum: POSIX, present on both GNU and BSD userlands,
# and this is a change detector rather than a security digest.
FP=$(printf '%s' "$PANE" | cksum | tr -d ' \t')
# No silence_expected: a pane's contents cannot establish that quiet is
# intended, so this probe never pardons silence.
jq -nc --arg fp "$FP" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  '{fingerprint: $fp, observed_at: $at}'
'''

[tmux.health.activity.bind]
session_name = { from = "self.outputs.session_name" }

# The four verbs below are this effect's interactive endpoint:
# attach/capture are consumed by `plect attach`/`plect capture`, and all four
# are reachable from any action or channel through
# `{ terminal = "<verb>" }` without that consumer knowing tmux is behind it.
# send_text receives the literal text to type as its operand; send_keys
# receives a key token (e.g. "Enter") the same way.
[tmux.terminal.attach]
type    = "exec"
command = "tmux"
args    = ["attach", "-t", { from = "self.outputs.session_name" }]

[tmux.terminal.capture]
type    = "exec"
command = "tmux"
args    = ["capture-pane", "-p", "-t", { from = "self.outputs.session_name" }]

[tmux.terminal.send_text]
type    = "exec"
command = "tmux"
args    = ["send-keys", "-t", { from = "self.outputs.session_name" }, "--"]

[tmux.terminal.send_keys]
type    = "exec"
command = "tmux"
args    = ["send-keys", "-t", { from = "self.outputs.session_name" }]

[tmux.outputs_schema]
type     = "object"
required = ["session_name"]

[tmux.outputs_schema.properties]
session_name = { type = "string" }
