# Channel: deliver a session event to a codex-headless runtime by appending
# it to the worker's queue directory (plect-codex-exec-worker, launched by
# tasks/codex_exec.toml, drains it serially into `codex exec`/`codex exec
# resume`). Unlike agent/runtime's tmux_send_keys channel, this enqueue is
# fire-and-forget on write — it must return well inside the exec channel's
# delivery timeout regardless of how long the worker's current turn runs, so
# the turn itself never happens inside this channel.
#
# A channel's `command` is never template-rendered (only its `args` are, and
# only with the `json` function — no `{{bin ...}}`; that helper exists only
# for task setup/cleanup hooks). So this plugin's `bin/` directory must be on
# `PATH` for plect-codex-exec-enqueue to resolve here — see this plugin's
# README.
# `command`/`args` precede [input_schema] so TOML scopes them at top level.
type = "exec"
command = "plect-codex-exec-enqueue"
args = [
  "{{.Inputs.queue_dir}}",
  "{{.Event.type}}",
  '[{{.Event.type}}] {{if .Event.body}}{{.Event.body}}{{else}}{{.Event.summary}}{{end}}{{with index .Event.metadata "url"}} ({{.}}){{end}}',
]
timeout = "5s"

[input_schema]
queue_dir = { type = "string", required = true }
