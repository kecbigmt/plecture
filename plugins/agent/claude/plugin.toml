schema_version = 1
version = "0.1.0"
# 0.0.0 matches app/internal/version.Current ("0.0.0-dev"): plect has no
# release/tagging process yet, so any higher floor would reject the plugin
# against every build until real versioning exists.
plect_min_version = "0.0.0"
description = "Launches and manages a Claude Code runtime in a tmux pane, with a channel-server MCP socket for structured event delivery."

# Duplicated from agent/runtime rather than referenced across plugins: a
# shipped plugin's own config can only resolve its own executables through
# {{bin ...}} (the reference has no alias to name a sibling plugin with —
# see docs/design/plugin-packaging.md's Plugin-local {{bin}} resolution
# section), so a plugin that needs another plugin's executable either folds
# into it or ships its own copy. This script is small and stable, so a copy
# per consuming plugin costs less than folding agent/claude into
# agent/runtime would.
[[executables]]
name = "plect-agent-activity"
path = "bin/plect-agent-activity"
