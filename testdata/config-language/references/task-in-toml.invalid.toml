# plect-fixture: result=invalid layer=structural diagnostic=PLECTURE-CFG-TASK-IN-TOML-DOCUMENT entry=definitions
# reason: a kind with a body is declared in a Markdown file's frontmatter, so a task block in a TOML definition document would have no instruction.

[review]
kind              = "task"
description       = "A task declaration with nowhere to keep its instruction"
resource_observer = "issue_pr"

[review.done_when]
all = [{ check = "resource.state.checks_status", in = ["SUCCESS"] }]
