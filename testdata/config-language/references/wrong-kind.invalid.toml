# plect-fixture: result=invalid layer=semantic diagnostic=PLECTURE-CFG-KIND-MISMATCH entry=definitions
# reason: a node's uses expects kind effect, and the resolved target declares kind channel.

[delivery]
kind    = "channel"
type    = "exec"
bin     = "agent-runtime-send"
args    = [{ from = "event.type" }]

[session]
kind = "workflow"
resource = "ticket"

[[session.nodes]]
uses = "delivery"

[ticket]
kind  = "resource"
match = '^ticket:(?P<number>\d+)$'
name  = { from = "match.number" }
