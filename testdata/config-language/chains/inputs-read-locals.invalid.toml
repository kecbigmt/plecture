# plect-fixture: result=invalid layer=semantic diagnostic=PLECT-CFG-FROM-ROOT entry=definitions
# reason: a chain passes on public work facts, not a layer's private locals.

[pursue_goal]
kind = "task"

[pursue_goal.setup]
type = "exec"
bin  = "okf-goal"
args = ["task", "validate-goal-resource"]

[[pursue_goal.chains]]
id        = "review"
workflow  = "goal_review"
placement = "sibling"

[pursue_goal.chains.when]
all = [{ judge_pending = "goal-met" }]

[pursue_goal.chains.inputs]
secret = { from = "locals.guard_dir" }
