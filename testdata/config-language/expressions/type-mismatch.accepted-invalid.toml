# plect-fixture: result=accepted-invalid layer=cel diagnostic=PLECTURE-CFG-CEL-TYPE entry=definitions
# reason: JSON Schema to CEL type projection is the sanctioned first check to drop, so this loads while result-type checking is disabled.

[review]
kind              = "task"
description       = "A task document whose computed leaf does not type-check"
resource_observer = "issue_pr"
instructions      = [{ text = "Review {{ resource.id }} and record a verdict." }]

[review.state_schema]
type = "object"

[review.state_schema.properties]
verdict_revision = { type = "string" }

[review.done_when]
all = [{ expr = "self.state.verdict_revision + 1" }]
