# plect-fixture: result=valid entry=definitions
# reason: a required projection selects one statically identifiable value and preserves its native type.

[bootstrap]
kind  = "task"
scope = "run"

[bootstrap.setup]
type = "exec"
bin  = "okf-goal"
args = [
  "task",
  "bootstrap",
  "--owner",
  { from = "inputs.owner" },
]

[bootstrap.inputs_schema]
type                 = "object"
required             = ["owner"]
additionalProperties = false

[bootstrap.inputs_schema.properties]
owner = { type = "string" }
