# plect-fixture: result=valid entry=plugin
# reason: a plugin manifest marks resident-capable executables without starting them.

schema_version    = 3
version           = "0.1.0"
plect_min_version = "0.0.0"
description       = "GitHub workspace provider, resource observation, and watcher subscription."

[[executables]]
name  = "github-worktree"
path  = "bin/github-worktree"
build = "go -C src build -o ../bin/github-worktree ./cmd/github-worktree"

[[executables]]
name = "gh-guard"
path = "scripts/gh-guard"

[[executables]]
name = "github-watcher"
path = "bin/github-watcher"
service = true
[executables.config_schema]
type = "object"
