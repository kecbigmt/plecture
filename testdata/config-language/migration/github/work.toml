# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/github/config/tasks/work.toml.

[work]
kind     = "task"
scope    = "session"
requires = ["resource_kind", "checks_status", "issue_status"]

[work.setup]
type = "shell"
script = '''
set -euo pipefail
INSTRUCTION=$(plect template render work --session "$session_name" --instruction "$extra")
if [ -z "$INSTRUCTION" ]; then
  echo "plect template render work produced empty instruction" >&2
  exit 1
fi
jq -nc --arg instruction "$INSTRUCTION" '{instruction:$instruction}'
'''

[work.setup.bind]
session_name = { from = "session.name" }
extra        = { from = "inputs.instruction", default = "" }

# Resource status is kept as first-class outputs rather than one rolled-up
# completion flag: collapsing a failing PR check and a still-running one onto
# a single value erases the failure-versus-pending distinction the check
# needs. A status that does not apply to this resource kind is the literal
# sentinel "NULL", which `in` accepts without it ever satisfying on its own.
#
# Observed state is projected per key from the resource observer, so
# `plect resource status`, show, and this instance all read one contract.
[work.outputs.bind]
resource_kind   = { from = "resource.status.resource_kind" }
checks_status   = { from = "resource.status.checks_status" }
issue_status    = { from = "resource.status.issue_status" }
revision        = { from = "resource.status.revision" }
pr_url          = { from = "resource.status.pr_url", optional = true }
mergeable_state = { from = "resource.status.mergeable_state", optional = true }

[work.done_when]
all = [
  { check = "resource_kind", in = ["pull", "issue"] },
  { check = "checks_status", in = ["SUCCESS", "NULL"] },
  { judge = "acceptance criteria are satisfied, with a concrete reason", id = "ac-met" },
  { judge = "the resource change actually resolves the requested work without unaddressed risks", id = "solves" },
]

[work.done_when.budget]
heartbeat_budget = 3
on_exhaust       = "escalate"

[work.inputs_schema]
type                 = "object"
additionalProperties = false

[work.inputs_schema.properties]
instruction = { type = "string" }

[work.outputs_schema]
type     = "object"
required = ["instruction"]

[work.outputs_schema.properties]
instruction     = { type = "string" }
resource_kind   = { type = "string", mutable = true }
checks_status   = { type = "string", mutable = true }
issue_status    = { type = "string", mutable = true }
revision        = { type = "string", mutable = true }
pr_url          = { type = "string", mutable = true }
mergeable_state = { type = "string", mutable = true }
