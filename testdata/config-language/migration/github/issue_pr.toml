# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/github/config/resources/github.toml.

[issue_pr]
kind  = "resource_observer"
match = '^https://github\.com/(?P<owner>[^/]+)/(?P<repo>[^/]+)/(issues|pull)/(?P<number>\d+)'

# workspace.dir is the observing task instance's session workspace directory
# when one exists, and absent for a standalone resource-status call — an issue
# resource's linked-PR discovery then skips straight to the GraphQL
# closing-PR lookup.
[issue_pr.observe]
type = "exec"
bin  = "github-issue-pr"
args = [
  "observe",
  "--resource", { from = "resource.id" },
  "--workspace-dir-path", { from = "workspace.dir", default = "" },
  "--watcher-bin", { bin = "github-watcher" },
]

[issue_pr.state_schema]
type     = "object"
required = ["resource_kind", "checks_status", "issue_status", "revision", "mergeable_state", "review_decision"]

[issue_pr.state_schema.properties]
resource_kind   = { type = "string", enum = ["pull", "issue", "unknown"] }
checks_status   = { type = "string", enum = ["SUCCESS", "PENDING", "FAILURE", "NULL"] }
issue_status    = { type = "string", enum = ["SUCCESS", "PENDING", "NULL"] }
revision        = { type = "string" }
pr_url          = { type = "string" }
# GitHub's own vocabulary for pulls.mergeable_state, plus "NULL" for the
# no-PR-observed sentinel — kept distinct from "unknown" (a real PR whose
# mergeability GitHub is still computing), since only "unknown" must never
# read as a rebase prompt.
mergeable_state = { type = "string", enum = ["clean", "dirty", "unstable", "blocked", "behind", "unknown", "draft", "has_hooks", "NULL"] }
review_decision = { type = "string", enum = ["APPROVED", "CHANGES_REQUESTED", "REVIEW_REQUIRED", "NULL"] }
