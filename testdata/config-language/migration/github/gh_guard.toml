# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/github/config/tasks/gh_guard.toml.

[gh_guard]
kind  = "task"
scope = "session"

# The real gh's resolved absolute path is embedded into the generated wrapper
# below at setup time, before the shim directory reaches anyone's PATH —
# resolving it lazily inside the guard would find the shim itself and recurse
# forever.
[gh_guard.setup]
type = "shell"
script = '''
REAL_GH=$(command -v gh) || { echo "gh_guard: no gh on PATH to guard" >&2; exit 1; }
DIR=$(mktemp -d "${TMPDIR:-/tmp}/plect-gh-guard.XXXXXX")
{
  printf '#!/usr/bin/env bash\n'
  printf 'export GH_GUARD_REAL_GH=%q\n' "$REAL_GH"
  printf 'exec %q "$@"\n' "$guard_bin"
} > "$DIR/gh"
chmod +x "$DIR/gh"
jq -nc --arg dir "$DIR" '{dir:$dir}'
'''

[gh_guard.setup.bind]
guard_bin = { bin = "gh-guard" }

[gh_guard.cleanup]
type   = "shell"
script = 'rm -rf "$dir"'

[gh_guard.cleanup.bind]
dir = { from = "self.dir" }

[gh_guard.outputs_schema]
type     = "object"
required = ["dir"]

[gh_guard.outputs_schema.properties]
dir = { type = "string" }
