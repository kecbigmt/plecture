# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/claude/config/tasks/claude_initial_prompt.toml.

[initial_prompt]
kind  = "task"
scope = "run"

# Inputs:
#   terminal_ready — ordering edge only; its value is never read.
#   agent_session  — a second ordering edge, onto the agent launch task.
#   template       — initial-prompt template name; empty sends no prompt.
#   repeat         — "true" resends the prompt on every up.
[initial_prompt.setup]
type = "shell"
script = '''
if [ "$repeat" != "true" ] && [ "$prev_sent" = "true" ]; then
  jq -nc '{sent:"true"}'
  exit 0
fi

# A cold pane can take tens of seconds to load its shell environment before
# the agent CLI's input box is drawn, and CLI versions differ on the glyph
# they use. A fixed sleep loses the paste on a slow cold load, so poll for
# either glyph instead.
ready=0
for _ in $(seq 1 180); do
  if sh -c "$capture" terminal-capture 2>/dev/null | grep -q '^[›❯]'; then
    ready=1
    break
  fi
  sleep 1
done
if [ "$ready" != 1 ]; then
  echo "initial_prompt: terminal did not show input box within 180s" >&2
  exit 1
fi

if [ -n "$template" ]; then
  PROMPT=$(plect template render "$template" --session "$session_name" 2>/dev/null || true)
  if [ -n "$PROMPT" ]; then
    sh -c "$send_text" terminal-send-text "$PROMPT"
    sleep 1
    sh -c "$send_keys" terminal-send-keys Enter

    # The TUI's paste-burst detection window can still be open just after a
    # long paste, absorbing the trailing Enter as a newline instead of a
    # submit — a distinct race from the boot-readiness one above, so gating
    # on boot readiness alone does not fix it.
    submitted=0
    for delay in 2 4 8 16; do
      input=$(sh -c "$capture" terminal-capture 2>/dev/null | grep '^[›❯]' | tail -n 1)
      # The ❯ glyph is followed by NBSP (U+00A0), not a regular space, in
      # observed pane output; normalize it before the case match.
      input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
      case "$input" in
        ''|'›'|'› '|'❯'|'❯ ') submitted=1; break ;;
      esac
      sleep "$delay"
      sh -c "$send_keys" terminal-send-keys Enter
    done
    if [ "$submitted" != 1 ]; then
      input=$(sh -c "$capture" terminal-capture 2>/dev/null | grep '^[›❯]' | tail -n 1)
      input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
      case "$input" in
        ''|'›'|'› '|'❯'|'❯ ') submitted=1 ;;
      esac
    fi
    if [ "$submitted" != 1 ]; then
      echo "initial_prompt: instruction still unsubmitted after retries" >&2
      exit 1
    fi
  fi
fi

jq -nc '{sent:"true"}'
'''

[initial_prompt.setup.bind]
session_name = { from = "session.name" }
template     = { from = "inputs.template", default = "" }
repeat       = { from = "inputs.repeat", default = "" }
prev_sent    = { from = "prev.sent", default = "" }
send_text    = { terminal = "send_text" }
send_keys    = { terminal = "send_keys" }
capture      = { terminal = "capture" }

[initial_prompt.inputs_schema]
type                 = "object"
additionalProperties = false

[initial_prompt.inputs_schema.properties]
terminal_ready = { type = "string" }
template       = { type = "string" }
agent_session  = { type = "string" }
repeat         = { type = "string" }

[initial_prompt.outputs_schema]
type     = "object"
required = ["sent"]

[initial_prompt.outputs_schema.properties]
sent = { type = "string", enum = ["true"] }
