# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/okf/config/resources/okf_goal.toml; the judge-evidence heredoc becomes a stdin binding.

[goal]
kind  = "resource_observer"
match = '^local-okf://[A-Za-z0-9][A-Za-z0-9-]*/goals/[A-Za-z0-9._/-]+\.md$'

# goal_parse_status UNRESOLVED means the observation could not even locate the
# goal; FAILURE means the file was read but is malformed. observe_error
# carries the human-readable reason. Escapes out of the bundle are refused as
# a hard error, never folded into UNRESOLVED.
[goal.observe]
type = "exec"
bin  = "okf-goal"
args = ["resource", "observe", "--resource", { from = "resource.id" }]

# `plect task finalize` already reconfirmed done_when and gathered judge
# evidence before invoking this, so finalize only writes the frontmatter and
# appends the log entry — it is not a second gate. Judge evidence arrives on
# stdin rather than in argv: judge reasons are arbitrary text, and argv is
# both size-bounded and visible to any process that can read the process
# table.
[goal.finalize]
type = "exec"
bin  = "okf-goal"
args = [
  "resource",
  "finalize",
  "--resource", { from = "resource.id" },
  "--revision", { from = "resource.revision" },
]
stdin = { json = { from = "judges" } }

[goal.state_schema]
type     = "object"
required = ["goal_parse_status", "goal_status", "checklist_status", "goal_revision", "open_items"]

[goal.state_schema.properties]
goal_parse_status = { type = "string", enum = ["SUCCESS", "FAILURE", "UNRESOLVED"] }
goal_status       = { type = "string", enum = ["open", "blocked", "completed", "archived", "NULL"] }
checklist_status  = { type = "string", enum = ["SUCCESS", "PENDING", "NULL"] }
# revision duplicates goal_revision under the reserved output key the judge
# staleness comparison reads, so a task copying it re-pends judges on edits.
goal_revision     = { type = "string" }
revision          = { type = "string" }
open_items        = { type = "string" }
observe_error     = { type = "string" }
