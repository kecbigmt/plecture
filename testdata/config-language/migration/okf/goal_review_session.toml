# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/okf/config/workflows/goal_review.toml; the workflow id changes because the task in the same plugin already owns goal_review.

# This is a reference composition, not a self-contained agent runtime: the
# node ids below name tasks this plugin does not define — okf is scoped by the
# OKF specification, not by any particular agent CLI or chat channel, so which
# agent runs the review and how it is reached is a choice made by whichever
# agent-runtime and channel plugins the operator has enabled.
[goal_review_session]
kind               = "workflow"
name               = "goal-review agent (local-okf)"
description        = "Dispatch an agent session against a local-okf goal resource, then deliver the goal_review task's instructions."
workspace_provider = "bundle"

[goal_review_session.display]
title  = { from = "workflow.outputs.concept_id" }
status = "goal_review"

[goal_review_session.inputs_schema]
type                 = "object"
required             = ["task"]
additionalProperties = false

[goal_review_session.inputs_schema.properties.task]
type        = "string"
description = "Initial task to instantiate for this session. Plect creates the matching task and delivers its instruction to the agent. Pass \"none\" to start an ad-hoc session with no initial instruction."
enum        = ["goal_review", "none"]
examples    = ["goal_review"]

# Review context wired by the goal review chain: the target session whose
# goal-met judge this review records a verdict for, and the pursue_goal task
# instance that judge leaf lives on.
[goal_review_session.inputs_schema.properties.work_session]
type        = "string"
description = "Target session whose pursue_goal instance's goal-met judge this review records a verdict for."

[goal_review_session.inputs_schema.properties.instance]
type        = "string"
description = "Task instance name of the pursue_goal instance on work_session."

[goal_review_session.inputs_schema.properties.judge_ids]
type        = "string"
description = "Space-separated pending judge leaf ids to record."

[[goal_review_session.nodes]]
uses = "envfile"

[[goal_review_session.nodes]]
uses = "slack_thread"

[[goal_review_session.nodes]]
uses = "pane"

# The exec runtime has no use for the Slack thread's channel_id/thread_ts —
# the "slack" event channel below delivers to that thread directly off
# slack_thread's own outputs, so the runtime only needs its pane.
[[goal_review_session.nodes]]
id   = "worker"
uses = "exec_runtime"

[goal_review_session.nodes.inputs]
tmux_session = { from = "nodes.pane.outputs.session_name" }

[[goal_review_session.nodes]]
uses = "initial_task"

[goal_review_session.nodes.inputs]
task = { from = "session.inputs.task", default = "" }

[[goal_review_session.event.channel]]
name    = "runtime"
uses    = "exec_delivery"
include = ["plect.instruction", "user.emit", "plect.terminal.*"]

[goal_review_session.event.channel.inputs]
queue_dir = { from = "nodes.worker.outputs.queue_dir" }

[[goal_review_session.event.channel]]
name    = "slack"
uses    = "slack_delivery"
include = ["user.emit"]

[goal_review_session.event.channel.inputs]
base_url   = "http://127.0.0.1:7890"
channel_id = { from = "nodes.slack_thread.outputs.channel_id" }
thread_ts  = { from = "nodes.slack_thread.outputs.thread_ts" }
