# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/codex/config/tasks/codex_initial_prompt.toml.

[initial_prompt]
kind  = "task"
scope = "run"

[initial_prompt.setup]
type = "shell"
script = '''
if [ "$repeat" != "true" ] && [ "$prev_sent" = "true" ]; then
  jq -nc '{sent:"true"}'
  exit 0
fi

ready=0
for _ in $(seq 1 180); do
  if sh -c "$capture" terminal-capture 2>/dev/null | grep -q '^[›❯]'; then
    ready=1
    break
  fi
  sleep 1
done
if [ "$ready" != 1 ]; then
  echo "initial_prompt: terminal did not show input box within 180s" >&2
  exit 1
fi

if [ -n "$template" ]; then
  PROMPT=$(plect template render "$template" --session "$session_name" 2>/dev/null || true)
  if [ -n "$PROMPT" ]; then
    sh -c "$send_text" terminal-send-text "$PROMPT"
    sleep 1
    sh -c "$send_keys" terminal-send-keys Enter

    submitted=0
    for delay in 2 4 8 16; do
      input=$(sh -c "$capture" terminal-capture 2>/dev/null | grep '^[›❯]' | tail -n 1)
      input=$(printf '%s' "$input" | sed 's/\xc2\xa0/ /g')
      case "$input" in
        ''|'›'|'› '|'❯'|'❯ ') submitted=1; break ;;
      esac
      sleep "$delay"
      sh -c "$send_keys" terminal-send-keys Enter
    done
    if [ "$submitted" != 1 ]; then
      echo "initial_prompt: instruction still unsubmitted after retries" >&2
      exit 1
    fi
  fi
fi

jq -nc '{sent:"true"}'
'''

[initial_prompt.setup.bind]
session_name = { from = "session.name" }
template     = { from = "inputs.template", default = "" }
repeat       = { from = "inputs.repeat", default = "" }
prev_sent    = { from = "prev.sent", default = "" }
send_text    = { terminal = "send_text" }
send_keys    = { terminal = "send_keys" }
capture      = { terminal = "capture" }

[initial_prompt.inputs_schema]
type                 = "object"
additionalProperties = false

[initial_prompt.inputs_schema.properties]
terminal_ready = { type = "string" }
template       = { type = "string" }
agent_session  = { type = "string" }
repeat         = { type = "string" }

[initial_prompt.outputs_schema]
type     = "object"
required = ["sent"]

[initial_prompt.outputs_schema.properties]
sent = { type = "string", enum = ["true"] }
