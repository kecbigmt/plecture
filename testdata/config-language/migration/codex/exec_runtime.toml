# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/codex/config/tasks/codex_exec.toml.

[exec_runtime]
kind  = "task"
scope = "run"

[exec_runtime.setup]
type = "shell"
script = '''
# The reset drops any record a previous run left behind, so this run's
# activity probe reports "no basis yet" until this run's first turn boundary
# rather than inheriting a stale fingerprint.
"$activity_bin" reset "$session_name"

CODEX_HOME_DIR="${CODEX_HOME:-$HOME/.codex}"
mkdir -p "$CODEX_HOME_DIR"
PROFILE_NAME="plect-$(uuidgen)"
PROFILE_PATH="$CODEX_HOME_DIR/$PROFILE_NAME.config.toml"
{
  printf 'bypass_hook_trust = true\n\n[hooks]\n'
  printf 'UserPromptSubmit = [{type = "command", command = ["%s", "working"]}]\n' "$activity_bin"
  printf 'Stop = [{type = "command", command = ["%s", "waiting"]}]\n' "$activity_bin"
} > "$PROFILE_PATH"

STATE_ROOT="$state_root"
[ -n "$STATE_ROOT" ] || STATE_ROOT="${TMPDIR:-/tmp}/plect-codex-exec"
STATE_DIR="$STATE_ROOT/$session_name"
QUEUE_DIR="$STATE_DIR/queue"
mkdir -p "$QUEUE_DIR"

# A resumed session keeps its queue/state dir and thread_id file — the
# worker just needs restarting, not reseeding.
if [ -n "$prev_state_dir" ] && [ "$prev_state_dir" != "$STATE_DIR" ]; then
  STATE_DIR="$prev_state_dir"
  QUEUE_DIR="$STATE_DIR/queue"
fi

EXPORTS="export PLECT_SESSION_NAME=$(printf '%q' "$session_name"); "
# The worker script runs standalone, outside plect's evaluation, so it
# cannot resolve a plugin executable itself for its own activity-hook calls;
# resolve it here and hand it down as an env var instead.
EXPORTS="${EXPORTS}export PLECT_AGENT_ACTIVITY_BIN=$(printf '%q' "$activity_bin"); "

LAUNCH_EXPORTS=$(printf '%s' "$launch_env" | jq -er '
  to_entries
  | map(if (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) then .
        else error("launch_env key \(.key) is not a valid environment variable name") end)
  | map("export \(.key)=\(.value | tostring | @sh); ")
  | add // ""') || exit 1
EXPORTS="${EXPORTS}${LAUNCH_EXPORTS}"

[ -n "$path_prepend" ] && EXPORTS="${EXPORTS}export PATH=$(printf '%q' "$path_prepend"):\$PATH; "
[ -n "$model" ] && EXPORTS="${EXPORTS}export CODEX_MODEL=$(printf '%q' "$model"); "
[ -n "$effort" ] && EXPORTS="${EXPORTS}export CODEX_MODEL_REASONING_EFFORT=$(printf '%q' "$effort"); "

rm -f "$STATE_DIR/ready"
# exec, not a bare command line: the worker replaces the pane shell, so the
# pane pid is the worker pid — no child-pid search like the interactive task
# needs for the TUI.
sh -c "$send_text" terminal-send-text "${EXPORTS}exec $(printf '%q' "$worker_bin") $(printf '%q' "$QUEUE_DIR") $(printf '%q' "$STATE_DIR") $(printf '%q' "$PROFILE_NAME")"
sh -c "$send_keys" terminal-send-keys Enter

PANE_PID=$(tmux display-message -p -t "$tmux_session" '#{pane_pid}')
READY_TIMEOUT_SECONDS="${PLECT_CODEX_EXEC_READY_TIMEOUT_SECONDS:-30}"
READY=0
for _ in $(seq 1 $((READY_TIMEOUT_SECONDS * 2))); do
  sleep 0.5
  kill -0 "$PANE_PID" 2>/dev/null || continue
  [ -f "$STATE_DIR/ready" ] && READY=1 && break
done
if [ "$READY" -ne 1 ]; then
  echo "codex-exec worker not ready within ${READY_TIMEOUT_SECONDS}s under pane pid $PANE_PID" >&2
  exit 1
fi

jq -nc \
  --argjson pid "$PANE_PID" \
  --arg queue_dir "$QUEUE_DIR" \
  --arg state_dir "$STATE_DIR" \
  --arg profile "$PROFILE_PATH" \
  '{pid:$pid, queue_dir:$queue_dir, state_dir:$state_dir, profile_path:$profile}'
'''

[exec_runtime.setup.bind]
session_name   = { from = "session.name" }
tmux_session   = { from = "inputs.tmux_session" }
model          = { from = "inputs.model", default = "" }
effort         = { from = "inputs.effort", default = "" }
state_root     = { from = "inputs.state_root", default = "" }
path_prepend   = { from = "inputs.path_prepend", default = "" }
launch_env     = { json = { from = "inputs.launch_env", default = {} } }
prev_state_dir = { from = "prev.state_dir", default = "" }
activity_bin   = { bin = "codex-agent-activity" }
worker_bin     = { bin = "codex-exec-worker" }
send_text      = { terminal = "send_text" }
send_keys      = { terminal = "send_keys" }

[exec_runtime.cleanup]
type = "shell"
script = '''
kill -TERM "$pid" 2>/dev/null || exit 0
for _ in 1 2 3 4 5; do
  sleep 0.5
  kill -0 "$pid" 2>/dev/null || break
done
kill -KILL "$pid" 2>/dev/null || true
[ -n "$profile_path" ] && rm -f "$profile_path"
"$activity_bin" reset "$session_name"
true
'''

[exec_runtime.cleanup.bind]
session_name = { from = "session.name" }
pid          = { from = "self.pid" }
profile_path = { from = "self.profile_path", default = "" }
activity_bin = { bin = "codex-agent-activity" }

# A live pid alone would hide a worker stuck on a permanently-failing turn.
# health.json is absent until the first turn finishes, which is healthy —
# nothing has failed yet.
[exec_runtime.health.alive]
type = "shell"
script = '''
kill -0 "$pid" || exit 1
HEALTH="$state_dir/health.json"
[ -f "$HEALTH" ] || exit 0
jq -e ".last_exit_code == 0" "$HEALTH" >/dev/null
'''

[exec_runtime.health.alive.bind]
pid       = { from = "self.pid" }
state_dir = { from = "self.state_dir" }

[exec_runtime.health.activity]
type = "exec"
bin  = "codex-agent-activity"
args = ["probe", { from = "session.name" }]

[exec_runtime.inputs_schema]
type                 = "object"
required             = ["tmux_session"]
additionalProperties = false

[exec_runtime.inputs_schema.properties]
tmux_session = { type = "string" }
model        = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
effort       = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
state_root   = { type = "string", pattern = "^[A-Za-z0-9_./:-]*$" }
path_prepend = { type = "string", pattern = "^[A-Za-z0-9_./:-]*$" }

[exec_runtime.inputs_schema.properties.launch_env]
type                 = "object"
additionalProperties = { type = "string" }

[exec_runtime.outputs_schema]
type     = "object"
required = ["pid", "queue_dir", "state_dir"]

[exec_runtime.outputs_schema.properties]
pid          = { type = "integer" }
queue_dir    = { type = "string" }
state_dir    = { type = "string" }
profile_path = { type = "string" }
