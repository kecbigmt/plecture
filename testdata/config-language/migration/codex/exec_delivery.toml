# plect-fixture: result=valid entry=definitions
# reason: translation of plugins/codex/config/channels/codex_exec.toml; bin resolves the plugin's own executable, so the PATH requirement is gone.

[exec_delivery]
kind = "channel"
type = "exec"
bin  = "codex-exec-enqueue"
args = [
  { from = "inputs.queue_dir" },
  { from = "inputs.message_envelope" },
  { from = "event.type" },
  { from = "event.body" },
  { from = "event.summary" },
  { from = "event.metadata.url", default = "" },
]
timeout = { from = "inputs.enqueue_timeout", default = "5s" }

# message_envelope is expanded by the enqueue executable rather than being a
# second template pass over the event: its placeholders name the same event
# fields the arguments above carry, so a user-supplied envelope can reorder
# and relabel the message but never reach a field the author did not offer.
[exec_delivery.input_schema]
queue_dir        = { type = "string", required = true }
enqueue_timeout  = { type = "string", default = "5s" }
message_envelope = { type = "string", default = "[{type}] {body_or_summary}{url_suffix}" }
