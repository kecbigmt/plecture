# reason: done_when is instance-only, and a workflow node reaches this task in node mode.

[work]
kind     = "task"
scope    = "session"
requires = ["checks_status"]

[work.setup]
type = "exec"
bin  = "github-issue-pr"
args = ["render-instruction"]

[work.outputs.bind]
checks_status = { from = "resource.status.checks_status" }

[work.outputs_schema]
type = "object"

[work.outputs_schema.properties]
checks_status = { type = "string", mutable = true }

[work.done_when]
all = [{ check = "checks_status", in = ["SUCCESS", "NULL"] }]

[work_session]
kind = "workflow"

[[work_session.nodes]]
uses = "work"
