# plect-fixture: result=invalid layer=semantic diagnostic=PLECT-CFG-FIELD-MODE entry=definitions
# reason: terminal is node-only, because the interactive endpoint is resolved through the session's node plan.

[pursue_goal]
kind  = "task"
scope = "session"

[pursue_goal.setup]
type = "exec"
bin  = "okf-goal"
args = ["task", "validate-goal-resource"]

[pursue_goal.terminal.capture]
type   = "shell"
script = 'tmux capture-pane -p -t "$session_name"'

[pursue_goal.terminal.capture.bind]
session_name = { from = "self.session_name" }

[pursue_goal.done_when]
all = [{ check = "goal_status", in = ["open"] }]
