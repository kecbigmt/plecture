name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.6"

jobs:
  # Core never imports plugins and plugins never import core, and both
  # sides depend only on contracts/* (scripts/check-provider-boundary.sh
  # enforces this) — that boundary, not convention, is what makes
  # scripts/ci-changed-modules.sh's trigger map safe to narrow.
  # Push events (post-merge to main) always run everything: that build is
  # the authoritative one, and there is no PR base to diff against.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      full_run: ${{ steps.decide.outputs.full_run }}
      build_test_matrix: ${{ steps.decide.outputs.build_test_matrix }}
      integration_test: ${{ steps.decide.outputs.integration_test }}
      readme_verify: ${{ steps.decide.outputs.readme_verify }}
      affected_plugins: ${{ steps.decide.outputs.affected_plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove the mapper reproduces the documented trigger map
        run: ./scripts/ci-changed-modules_selftest.sh
      - name: Prove a cross-scope rename keeps both its old and new path
        run: ./scripts/ci-diff-no-renames_selftest.sh
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --no-renames: default rename detection reports only the
            # destination path, so a rename across a mapped boundary (e.g.
            # app/x.go -> docs/x.md) would hide that the source side lost a
            # file. Reporting both the old and new path keeps both sides in
            # the trigger-map decision.
            out="$(git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | ./scripts/ci-changed-modules.sh)"
          else
            # No base to diff against on a direct push to main: that build is
            # the authoritative one, so run everything unconditionally.
            out="$(FORCE_FULL_RUN=true ./scripts/ci-changed-modules.sh < /dev/null)"
          fi
          echo "$out"
          full_run="$(echo "$out" | sed -n 's/^FULL_RUN=//p')"
          matrix="$(echo "$out" | sed -n 's/^BUILD_TEST_MATRIX=//p')"
          integration_test="$(echo "$out" | sed -n 's/^INTEGRATION_TEST=//p')"
          readme_verify="$(echo "$out" | sed -n 's/^README_VERIFY=//p')"
          affected_plugins="$(echo "$out" | sed -n 's/^AFFECTED_PLUGINS=//p')"
          echo "full_run=$full_run" >> "$GITHUB_OUTPUT"
          echo "build_test_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "integration_test=$integration_test" >> "$GITHUB_OUTPUT"
          echo "readme_verify=$readme_verify" >> "$GITHUB_OUTPUT"
          echo "affected_plugins=$affected_plugins" >> "$GITHUB_OUTPUT"

  # These four jobs are whole-repo invariant checks, not per-module builds,
  # so they stay unconditional: a docs-only diff still gets exactly this
  # lint set, and nothing from build-test/integration-test/readme-verify
  # below, which the changes job gates instead.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './app/internal/webui/*'))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  provider-boundary:
    name: provider-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the checker catches a seeded violation
        run: ./scripts/check-provider-boundary_selftest.sh
      - name: Check core provider-neutrality
        run: ./scripts/check-provider-boundary.sh

  comment-references:
    name: comment-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the checker catches a seeded violation
        run: ./scripts/check-comment-references_selftest.sh
      - name: Check comments for issue/PR/ADR number references
        run: ./scripts/check-comment-references.sh

  gh-guard:
    name: gh-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gh_guard shim denies merge/close and passes through everything else
        run: ./scripts/gh-guard_selftest.sh

  # This job covers the script-side half of a plugin's delivery contract;
  # its argv side is pinned by the channel-invocation records the
  # integration-test job regenerates from the shipped declarations. It is
  # scoped to the plugins the changes job flagged, since one plugin's
  # change must not run another plugin's selftests.
  plugin-script-selftests:
    name: plugin-script-selftests
    needs: changes
    if: needs.changes.outputs.affected_plugins != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the runner isolates one plugin's selftests from another's
        run: ./scripts/run-plugin-selftests_selftest.sh
      - name: Run each affected plugin's script selftests
        env:
          REQUIRE_FOUND: ${{ needs.changes.outputs.full_run }}
        run: |
          mapfile -t names < <(jq -r '.[]' <<< '${{ needs.changes.outputs.affected_plugins }}')
          ./scripts/run-plugin-selftests.sh "${names[@]}"

  build-test:
    name: build-test (${{ matrix.module }})
    needs: changes
    # An empty matrix produces zero job instances (shown as skipped, not
    # failed, in gh pr checks) rather than an error.
    if: needs.changes.outputs.build_test_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.build_test_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: go vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}
      - name: go test
        run: go test ./...
        working-directory: ${{ matrix.module }}

  integration-test:
    name: integration-test
    needs: changes
    if: needs.changes.outputs.integration_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # The integration-tagged tests (app/internal/service, app/internal/webui)
      # spin up real git repos and worktrees and, for the shipped
      # workspace-provider cases, build the plect/github-worktree/
      # github-watcher binaries (from plugins/github/src) under test — that's
      # slow enough to be excluded from the default
      # go test run but is exactly the coverage that would otherwise let a
      # spec-encoding test like TestIntegration_DestroyRefusesWhenWorkspaceDirDirty
      # rot unnoticed.
      - name: go test -tags integration
        run: go test -tags integration ./...
        working-directory: app
      - name: go vet -tags integration
        run: go vet -tags integration ./...
        working-directory: app

  readme-verify:
    name: readme-verify
    needs: changes
    if: needs.changes.outputs.readme_verify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run README build commands
        run: |
          go build ./app/...
          go build ./contracts/atomicfile/...
          go build ./contracts/channel-protocol/...
          go build ./contracts/event/...
          go build ./contracts/state/...
          go build ./plugins/claude/src/channel-server/...
          go build ./plugins/github/src/...
          go build ./plugins/legacy-migration/...
          go build ./plugins/okf/src/...
          go build ./plugins/slack/src/slack-adapter/...
      - name: Run README test commands
        run: |
          go test ./app/...
          go test ./contracts/atomicfile/...
          go test ./contracts/channel-protocol/...
          go test ./contracts/event/...
          go test ./contracts/state/...
          go test ./plugins/claude/src/channel-server/...
          go test ./plugins/github/src/...
          go test ./plugins/legacy-migration/...
          go test ./plugins/okf/src/...
          go test ./plugins/slack/src/slack-adapter/...
