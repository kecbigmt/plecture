name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.23.4"

# Every setup-go step sets cache: false, and the jobs whose main cost is
# compilation cache Go through actions/cache with the job in the key.
# setup-go's own cache has one key shared by every job, and only the first
# job to finish saves it: a job that builds nothing wins that race, so every
# later job restores an empty entry as a hit and never saves its own.
jobs:
  # Core never imports plugins and plugins never import core, and both
  # sides depend only on contracts/* (scripts/check-provider-boundary.sh
  # enforces this) — that boundary, not convention, is what makes
  # scripts/ci-changed-modules.sh's trigger map safe to narrow.
  # Push events (post-merge to main) always run everything: that build is
  # the authoritative one, and there is no PR base to diff against.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      full_run: ${{ steps.decide.outputs.full_run }}
      build_test_matrix: ${{ steps.decide.outputs.build_test_matrix }}
      integration_test: ${{ steps.decide.outputs.integration_test }}
      readme_verify: ${{ steps.decide.outputs.readme_verify }}
      affected_plugins: ${{ steps.decide.outputs.affected_plugins }}
      web_ci: ${{ steps.decide.outputs.web_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: ./scripts/ci/changes.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # gofmt, go-install, provider-boundary, comment-references,
  # instruction-orphans, and check-all are whole-repo invariant checks, not
  # per-module builds, so they stay unconditional: a docs-only diff still
  # gets exactly this lint set, and nothing from
  # build-test/integration-test/readme-verify below, which the changes job
  # gates instead.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: ./scripts/ci/gofmt.sh

  # app/internal/webui/webapp/embed.go embeds a committed
  # static/unbuilt.html placeholder (static/dist/, Vite's real output, is
  # gitignored and untracked) so go:embed always has something to compile
  # against — the invariant this job guards is that
  # building the app module never needs Node, on every PR. The changes
  # job's per-module map can route around app's own build-test entry (e.g.
  # a web/app-only change whose rebuilt dist happens to be byte-identical
  # touches nothing under app/), so this is unconditional, with no Node
  # ever installed in the job, rather than
  # gated like build-test.
  go-install:
    name: go-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - name: go build ./app/... from a fresh checkout, no Node installed
        run: ./scripts/ci/go-install.sh

  provider-boundary:
    name: provider-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: ./scripts/ci/provider-boundary.sh

  comment-references:
    name: comment-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/comment-references.sh

  # Diff-scoped, not a whole-repo scan like comment-references above: it
  # enforces CLAUDE.md's Comments-section shape rules (density, block
  # length, no duplicated rationale) against exactly the lines a PR adds,
  # so it needs the PR's base/head shas and therefore only runs on
  # pull_request events — a push to main has no PR diff to scope to.
  comment-density:
    name: comment-density
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: ./scripts/ci/comment-density.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        env:
          HEAD_REF: ${{ github.head_ref }}

  instruction-orphans:
    name: instruction-orphans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: ./scripts/ci/instruction-orphans.sh

  # The linter versions are pinned in scripts/lint-tools.sh, which is part
  # of the cache key, so a version bump never restores a stale install.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.cache/plecture/lint-tools
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum', 'scripts/lint-tools.sh') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: ./scripts/ci/lint.sh "${{ github.event.pull_request.base.sha }}"

  # check-all.sh runs every script below on a developer's machine; here it
  # is proved against a fixture rather than re-run, which would only run
  # those scripts twice. The ADR lifecycle check lives here rather than in
  # its own job: its immutability comparison needs main and the PR head
  # with full history.
  check-all:
    name: check-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: ./scripts/ci/check-all.sh "${{ github.event.pull_request.head.sha }}"

  gh-guard:
    name: gh-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gh_guard shim denies merge/close and passes through everything else
        run: ./scripts/ci/gh-guard.sh

  gh-app-guard:
    name: gh-app-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gh_app_guard shim mints before allow, denies before mint, and scopes GH_TOKEN to the delegated gh
        run: ./scripts/gh-app-guard_selftest.sh

  # The schema-contract decision record under docs/adr/ requires CI to
  # check schema compilation, reproducible Go/TypeScript generation, and
  # generated-code compilation — this job is that check.
  # Gated on WEB_CI (web/api/** or its app/internal/webapi/** consumer) so a
  # PR touching neither doesn't pay for a pnpm install; a frozen-reference
  # change under docs/design/web-ui/prototype/** alone leaves WEB_CI false,
  # so it cannot stand in for validating the production contract.
  web-api-contract:
    name: web-api-contract
    needs: changes
    if: needs.changes.outputs.web_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - run: ./scripts/ci/web-api-contract.sh

  # app/internal/webui/webapp/static/dist/ is gitignored and untracked,
  # built only by the release workflow and by web-browser-acceptance below;
  # this job's
  # invariant is narrower — that the pinned frontend dependency graph can
  # build and test from source, not that a generated artifact matches one
  # committed to Git. Gated on WEB_CI for the same reason web-api-contract
  # is: a frozen-reference-only change under docs/design/web-ui/prototype/**
  # must not stand in for validating this production path.
  web-app-build:
    name: web-app-build
    needs: changes
    if: needs.changes.outputs.web_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: ./scripts/ci/web-app-build.sh

  # Browser-level acceptance for the /app/ shell's read/live milestone: a
  # real Chromium against a freshly built /app/ (dist/ is gitignored, so
  # this job builds it itself before the Go build below picks it up — see
  # app/internal/webui/webapp/embed.go), served by the real
  # service/state stack over httptest.NewServer — the same seam
  # acceptance_test.go already drives at the HTTP level, with a browser on
  # top. Kept separate from web-app-build (rather than an extra step there)
  # because the browser download and launch are materially slower than that
  # job's build-and-unit-test check, and a browser/env failure here must not
  # obscure a real build or unit-test failure in the same job log. Gated on
  # WEB_CI for the same reason web-app-build is.
  #
  # No caching action for the browser download: actions/cache here holds
  # only the Go module and build caches of compilation-heavy jobs, and a
  # browser cache entry is a bigger commitment than this single job's
  # download time justifies; the download cost is accepted per run.
  #
  # Adjustment rule (this job is part of ci-ok, so it must earn its keep):
  # if it produces a false failure on main more than once in its first ten
  # runs, it moves out of ci-ok to a non-blocking job in a follow-up PR.
  web-browser-acceptance:
    name: web-browser-acceptance
    needs: changes
    if: needs.changes.outputs.web_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: ./scripts/ci/web-browser-acceptance.sh
      - run: ./scripts/ci/web-browser-acceptance-browser.sh

  # This job covers the script-side half of a plugin's delivery contract;
  # its argv side is pinned by the channel-invocation records the
  # integration-test job regenerates from the shipped declarations. It is
  # scoped to the plugins the changes job flagged, since one plugin's
  # change must not run another plugin's selftests.
  plugin-script-selftests:
    name: plugin-script-selftests
    needs: changes
    if: needs.changes.outputs.affected_plugins != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci/plugin-script-selftests.sh
        env:
          AFFECTED_PLUGINS: ${{ needs.changes.outputs.affected_plugins }}
          REQUIRE_FOUND: ${{ needs.changes.outputs.full_run }}

  # The storage contract in app/db gets its own required check, so a
  # contract failure is reported by name rather than as one failure among
  # the app tests. The manifest and drift tests also run under plain
  # go test in build-test (app); the upgrade fixtures need the integration tag.
  storage-contract:
    name: storage-contract
    needs: changes
    if: contains(needs.changes.outputs.build_test_matrix, '"app"')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - run: ./scripts/ci/storage-contract.sh

  # Every past darwin-only breakage was first seen in release.yml's
  # darwin-arm64 job, because this workflow otherwise runs go test on Linux
  # only; running the same command on every push to main catches it before
  # a release tag, without paying for a macOS runner on every PR.
  build-test-darwin:
    name: build-test-darwin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      # release.yml's darwin-arm64 build job runs this same `go test ./...`
      # against the app module before packaging.
      - run: ./scripts/ci/build-test.sh app

  build-test:
    name: build-test (${{ matrix.module }})
    needs: changes
    # An empty matrix produces zero job instances (shown as skipped, not
    # failed, in gh pr checks) rather than an error.
    if: needs.changes.outputs.build_test_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.build_test_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ matrix.module }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ matrix.module }}-
      - run: ./scripts/ci/build-test.sh "${{ matrix.module }}"

  integration-test:
    name: integration-test
    needs: changes
    if: needs.changes.outputs.integration_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - run: ./scripts/ci/integration-test.sh

  readme-verify:
    name: readme-verify
    needs: changes
    if: needs.changes.outputs.readme_verify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - run: ./scripts/ci/readme-verify.sh

  # The only job a branch-protection ruleset can require without going
  # BLOCKED forever on a path-filtered PR: matrix jobs above report nothing
  # when skipped by the changes job, and GitHub's required-status-check
  # semantics treat a never-reporting required context as forever-pending.
  # if: always() plus needs on every other job makes this the one context
  # that always reports, so the ruleset can require it alone and still
  # cover the full matrix.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - gofmt
      - go-install
      - provider-boundary
      - comment-references
      - comment-density
      - instruction-orphans
      - lint
      - check-all
      - gh-guard
      - web-api-contract
      - web-app-build
      - web-browser-acceptance
      - plugin-script-selftests
      - storage-contract
      - build-test-darwin
      - build-test
      - integration-test
      - readme-verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have succeeded or been skipped
        # The needs context is passed via env, not spliced into the script
        # body, because needs.*.outputs can carry diff-derived strings (e.g.
        # affected_plugins) that a malicious PR could shape to break out of
        # an inline interpolation.
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_CONTEXT" | jq -e '
            to_entries | all(.value.result == "success" or .value.result == "skipped")
          '
