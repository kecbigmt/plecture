name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.6"

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './app/internal/webui/*'))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  provider-boundary:
    name: provider-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the checker catches a seeded violation
        run: ./scripts/check-provider-boundary_selftest.sh
      - name: Check core provider-neutrality
        run: ./scripts/check-provider-boundary.sh

  comment-references:
    name: comment-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the checker catches a seeded violation
        run: ./scripts/check-comment-references_selftest.sh
      - name: Check comments for issue/PR/ADR number references
        run: ./scripts/check-comment-references.sh

  gh-guard:
    name: gh-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gh_guard shim denies merge/close and passes through everything else
        run: ./scripts/gh-guard_selftest.sh

  build-test:
    name: build-test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - app
          - contracts/atomicfile
          - contracts/channel-protocol
          - contracts/event
          - contracts/state
          - plugins/claude/src/channel-server
          - plugins/github/src
          - plugins/legacy-migration
          - plugins/okf/src
          - plugins/slack/src/slack-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: go vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}
      - name: go test
        run: go test ./...
        working-directory: ${{ matrix.module }}

  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # The integration-tagged tests (app/internal/service, app/internal/webui)
      # spin up real git repos and worktrees and, for the shipped
      # workspace-provider cases, build the plect/github-worktree/
      # github-watcher binaries (from plugins/github/src) under test — that's
      # slow enough to be excluded from the default
      # go test run but is exactly the coverage that would otherwise let a
      # spec-encoding test like TestIntegration_DestroyRefusesWhenWorkspaceDirDirty
      # rot unnoticed.
      - name: go test -tags integration
        run: go test -tags integration ./...
        working-directory: app
      - name: go vet -tags integration
        run: go vet -tags integration ./...
        working-directory: app

  readme-verify:
    name: readme-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run README build commands
        run: |
          go build ./app/...
          go build ./contracts/atomicfile/...
          go build ./contracts/channel-protocol/...
          go build ./contracts/event/...
          go build ./contracts/state/...
          go build ./plugins/claude/src/channel-server/...
          go build ./plugins/github/src/...
          go build ./plugins/legacy-migration/...
          go build ./plugins/okf/src/...
          go build ./plugins/slack/src/slack-adapter/...
      - name: Run README test commands
        run: |
          go test ./app/...
          go test ./contracts/atomicfile/...
          go test ./contracts/channel-protocol/...
          go test ./contracts/event/...
          go test ./contracts/state/...
          go test ./plugins/claude/src/channel-server/...
          go test ./plugins/github/src/...
          go test ./plugins/legacy-migration/...
          go test ./plugins/okf/src/...
          go test ./plugins/slack/src/slack-adapter/...
