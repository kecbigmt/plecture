name: Docker fault injection

env:
  GO_VERSION: "1.26.10"

on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      recovery:
        description: Run the S1 and S2 recovery assertions
        type: boolean
        default: false

jobs:
  fault:
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, nested]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Exercise the packaged image with a stub agent
        env:
          PLECT_FAULT_RECOVERY: ${{ (github.event_name == 'schedule' || inputs.recovery) && '1' || '0' }}
          PLECT_FAULT_VARIANT: ${{ matrix.variant }}
        run: deploy/docker/fault/run.sh
